<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELIO - Power from the sun.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d150c;--ink-mute:rgba(29,21,12,.7);--amber:#f5a623;--cream:251,245,236}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fbf5ec;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;background:#cfd8de}
.scrim,.blur{position:fixed;left:0;right:0;pointer-events:none;z-index:1}
.scrim-bottom{inset:0;background:linear-gradient(to top,rgba(var(--cream),.97) 0%,rgba(var(--cream),.82) 16%,rgba(var(--cream),.30) 38%,rgba(var(--cream),0) 56%)}
.blur-bottom{inset:0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to top,#000 0%,#000 10%,transparent 40%);mask-image:linear-gradient(to top,#000 0%,#000 10%,transparent 40%)}
.scrim-top{inset:0;background:linear-gradient(to bottom,rgba(var(--cream),.60),transparent 20%)}
.shell{position:relative;z-index:10;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:24px clamp(28px,4.6vw,60px) clamp(38px,6vh,58px)}
nav{display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font:800 22px Manrope,sans-serif;letter-spacing:.01em;color:var(--ink)}
.sun{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#ffd27a,#f5a623 70%);box-shadow:0 0 0 3px rgba(245,166,35,.28)}
.links{display:flex;gap:34px;margin-left:auto;margin-right:34px}
.links a{font:500 14px Inter,sans-serif;color:var(--ink-mute);text-decoration:none;transition:color .2s}
.links a:hover{color:var(--ink)}
.glass{font:600 14px Inter,sans-serif;color:var(--ink);text-decoration:none;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 20px rgba(60,40,10,.12);transition:transform .25s,box-shadow .25s;white-space:nowrap}
.glass:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 26px rgba(60,40,10,.18)}
.hero{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;min-height:0}
.kicker{display:flex;align-items:center;gap:14px;font:500 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.3em;margin-bottom:22px}
.kicker i{display:block;width:26px;height:3px;border-radius:3px;background:var(--amber)}
h1{font:800 clamp(46px,9.7vw,124px)/.92 Manrope,sans-serif;letter-spacing:-.035em;max-width:14ch;margin-bottom:24px}
.sub{font:400 clamp(16px,1.6vw,21px)/1.45 Inter,sans-serif;color:var(--ink-mute);max-width:38ch;margin-bottom:34px}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:20px 30px;margin-bottom:30px}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--amber);color:var(--ink);font:700 15px Manrope,sans-serif;padding:15px 28px;border-radius:999px;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 28px rgba(245,166,35,.45);transition:transform .25s,box-shadow .25s}
.cta svg{width:16px;height:16px;transition:transform .25s}
.cta:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 14px 34px rgba(245,166,35,.55)}
.cta:hover svg{transform:translateX(4px)}
.how{font:500 15px Inter,sans-serif;color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(29,21,12,.45);padding-bottom:2px;transition:border-color .2s}
.how:hover{border-color:var(--ink)}
.stat{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font:500 13px 'JetBrains Mono',monospace;color:var(--ink-mute)}
.stat b{font-weight:600;color:var(--ink)}
.stat s{display:block;width:5px;height:5px;border-radius:50%;background:var(--amber)}
@keyframes blurRise{from{opacity:0;filter:blur(18px);transform:translateY(34px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
.r{opacity:0;animation:blurRise 1s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d,0ms)}
@media(max-width:720px){
 .links{display:none}
 .shell{padding:20px 22px 34px}
 .glass{padding:9px 16px}
 .kicker{margin-bottom:16px}
 .sub{margin-bottom:26px}
 .actions{margin-bottom:22px}
 .stat{font-size:12px}
}
@media(max-height:620px){h1{font-size:clamp(40px,8vw,80px)}.sub{margin-bottom:20px}.actions{margin-bottom:16px}.kicker{margin-bottom:12px}}
@media (prefers-reduced-motion:reduce){.r{animation:none;opacity:1;filter:none;transform:none}.cta,.cta svg,.glass{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="scrim scrim-bottom"></div>
<div class="blur blur-bottom"></div>
<div class="scrim scrim-top"></div>

<div class="shell">
  <nav>
    <div class="brand r" style="--d:0ms"><span class="sun"></span>HELIO</div>
    <div class="links">
      <a class="r" style="--d:70ms" href="#">Panels</a>
      <a class="r" style="--d:120ms" href="#">Savings</a>
      <a class="r" style="--d:170ms" href="#">Install</a>
    </div>
    <a class="glass r" style="--d:230ms" href="#">Get a quote</a>
  </nav>
  <main class="hero">
    <div class="kicker r" style="--d:340ms"><i></i>HOME SOLAR</div>
    <h1 class="r" style="--d:440ms">Power from the sun.</h1>
    <p class="sub r" style="--d:560ms">Cut your bill to zero with rooftop solar.</p>
    <div class="actions r" style="--d:680ms">
      <a class="cta" href="#">See your savings <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
      <a class="how" href="#">How it works</a>
    </div>
    <div class="stat r" style="--d:800ms"><span><b>25-yr</b> warranty</span><s></s><span><b>$0</b> down</span></div>
  </main>
</div>

<script>
/* Stand-in for the aerial golden-hour video: a procedural canvas glide over a solar-panel field. */
(function(){
  var cv=document.getElementById('bg'),ctx=cv.getContext('2d');
  var W,H,hor,f,sunX,camH=7,A=0.34,cA=Math.cos(A),sA=Math.sin(A),PW=3.2,PD=2.2;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var skyG,hazeG,gndG;
  function resize(){
    var s=Math.min(1,1100/innerWidth)*0.8;
    W=cv.width=Math.max(320,Math.round(innerWidth*s));H=cv.height=Math.max(240,Math.round(innerHeight*s));
    hor=H*0.37;f=Math.max(W*0.95,H*1.1);sunX=W*(innerWidth<720?0.72:0.66);
    skyG=ctx.createLinearGradient(0,0,0,hor);
    skyG.addColorStop(0,'#6fa6c4');skyG.addColorStop(.45,'#a9cdd6');skyG.addColorStop(.8,'#f0dcc0');skyG.addColorStop(1,'#f6d6a6');
    gndG=ctx.createLinearGradient(0,hor,0,hor+H*0.2);gndG.addColorStop(0,'#e4cfae');gndG.addColorStop(.12,'#b7b3a9');gndG.addColorStop(1,'#3a4b60');
    hazeG=ctx.createLinearGradient(0,hor-H*0.04,0,hor+H*0.12);
    hazeG.addColorStop(0,'rgba(246,214,166,0)');hazeG.addColorStop(.35,'rgba(246,220,182,.6)');hazeG.addColorStop(1,'rgba(240,215,185,0)');
    draw(last);
  }
  function hash(i,j){var h=Math.sin(i*127.1+j*311.7)*43758.5453;return h-Math.floor(h)}
  function mix(a,b,t){return a+(b-a)*t}
  var HZ=[243,216,178];
  function draw(time){
    ctx.fillStyle=skyG;ctx.fillRect(0,0,W,hor+1);
    ctx.fillStyle=gndG;ctx.fillRect(0,hor,W,H-hor);
    var t=(time*0.0035)%PD, sway=Math.sin(time*0.0003)*1.2, cx=W/2;
    var sunGlow=ctx.createRadialGradient(sunX,hor,0,sunX,hor,W*0.16);
    sunGlow.addColorStop(0,'rgba(255,246,220,.9)');sunGlow.addColorStop(.2,'rgba(255,226,165,.45)');sunGlow.addColorStop(1,'rgba(255,224,160,0)');
    ctx.fillStyle=sunGlow;ctx.fillRect(0,0,W,hor+1);
    var inset=0.045;
    for(var j=230;j>=-6;j--){
      for(var i=-130;i<=130;i++){
        var u=i*PW,v=j*PD-t;
        var mx=(u+PW/2)*cA-(v+PD/2)*sA+sway, mz=(u+PW/2)*sA+(v+PD/2)*cA;
        if(mz<1.6||mz>420)continue;
        var sxm=cx+f*mx/mz;
        var m=PW*f/mz*1.4+20;
        if(sxm<-m||sxm>W+m)continue;
        var pts=[[u+PW*inset,v+PD*inset],[u+PW*(1-inset),v+PD*inset],[u+PW*(1-inset),v+PD*(1-inset)],[u+PW*inset,v+PD*(1-inset)]];
        ctx.beginPath();var ok=true;
        for(var k=0;k<4;k++){
          var gx=pts[k][0],gz=pts[k][1];
          var X=gx*cA-gz*sA+sway,Z=gx*sA+gz*cA;
          if(Z<0.8){ok=false;break}
          var px=cx+f*X/Z,py=hor+f*camH/Z;
          if(k)ctx.lineTo(px,py);else ctx.moveTo(px,py);
        }
        if(!ok)continue;
        ctx.closePath();
        var r=Math.min(.8,0.12+Z/260)+(hash(i,j)-.5)*0.3;
        var dx=(sxm-sunX)/(W*0.28);
        r+=0.7*Math.exp(-dx*dx*2.2)*Math.min(1,Z/50);
        r=Math.max(0,Math.min(1,r));
        var R=mix(58,205,r),G=mix(82,218,r),B=mix(112,230,r);
        var fog=0.9*(1-Math.exp(-Z/190));
        R=mix(R,HZ[0],fog);G=mix(G,HZ[1],fog);B=mix(B,HZ[2],fog);
        ctx.fillStyle='rgb('+(R|0)+','+(G|0)+','+(B|0)+')';
        ctx.fill();
      }
    }
    ctx.fillStyle=hazeG;ctx.fillRect(0,hor-H*0.04,W,H*0.16);
    ctx.globalCompositeOperation='lighter';
    var g2=ctx.createRadialGradient(sunX,hor,0,sunX,hor,W*0.14);
    g2.addColorStop(0,'rgba(255,240,200,.35)');g2.addColorStop(1,'rgba(255,240,200,0)');
    ctx.fillStyle=g2;ctx.fillRect(0,hor-W*0.2,W,W*0.4);
    ctx.globalCompositeOperation='source-over';
  }
  var last=1500,raf;
  function loop(ts){last=ts;draw(ts);raf=requestAnimationFrame(loop)}
  window.addEventListener('resize',resize);
  resize();
  if(!reduce){
    raf=requestAnimationFrame(loop);
    document.addEventListener('visibilitychange',function(){
      if(document.hidden)cancelAnimationFrame(raf);else raf=requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
