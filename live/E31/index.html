<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prosthetics Hero</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border:0 solid #e5e7eb}
html{font-family:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji";line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.root{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:#f0f0ee}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
@media(max-aspect-ratio:1/1){.bg{opacity:.4}}
.fg{position:relative;z-index:10;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
nav{display:flex;align-items:center;justify-content:center;padding:16px 16px 0;gap:8px}
.logo{display:flex;align-items:center;justify-content:center;border-radius:9999px;width:40px;height:40px;flex-shrink:0;background:#EDEDED}
.pill{display:flex;align-items:center;gap:16px;border-radius:12px;padding:10px 16px;background:#EDEDED}
.pill a{font-size:12px;font-weight:500;color:#374151;transition:color .2s}
.pill a:hover{color:#111827}
.hero{flex:1;display:flex;align-items:flex-end;padding:0 24px 40px}
.inner{max-width:20rem}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:#3b82f6;transition:color .2s;margin-bottom:12px}
.badge:hover{color:#2563eb}
.arrow{display:inline-block;transition:transform .2s}
.group:hover .arrow{transform:translateX(.125rem)}
h1{font-size:1.5rem;line-height:1.15;font-weight:500;color:#111827;letter-spacing:-.025em;margin-bottom:12px}
.sub{font-size:13px;color:#9ca3af;font-weight:400;margin-bottom:12px}
.cta{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#3b82f6;border:1px solid #60a5fa;border-radius:9999px;padding:10px 20px;transition:all .2s}
.cta:hover{background:#3b82f6;color:#fff;border-color:#3b82f6}
@media(min-width:640px){
 nav{padding:24px 32px 0;gap:12px}
 .logo{width:44px;height:44px}
 .pill{gap:40px;padding:12px 32px}
 .pill a{font-size:14px}
 .hero{padding:0 48px 64px}
 h1{font-size:1.75rem}
}
@media(min-width:768px){.hero{padding-left:80px;padding-right:80px}}
@media(min-width:1024px){.hero{padding:0 112px 80px}}
/* stand-in video: slow looping light + sway */
.light{animation:drift 14s ease-in-out infinite alternate}
.sway{transform-origin:50% 8%;animation:sway 7s ease-in-out infinite alternate}
.sheen{animation:sheen 6s ease-in-out infinite}
@keyframes drift{from{transform:translate(-3%,0)}to{transform:translate(3%,2%)}}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@keyframes sheen{0%,100%{opacity:.15}50%{opacity:.7}}
@media(prefers-reduced-motion:reduce){.light,.sway,.sheen{animation:none}.sheen{opacity:.4}.arrow,.cta,.badge,.pill a{transition:none}}
</style>
</head>
<body>
<div class="root">
 <!-- Stand-in for the looping background video: soft studio light + carbon prosthetic blade -->
 <svg class="bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
   <radialGradient id="glow" cx="65%" cy="40%" r="60%"><stop offset="0" stop-color="#fafaf8"/><stop offset="1" stop-color="#e6e6e3"/></radialGradient>
   <radialGradient id="floor" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
   <linearGradient id="carbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b2d31"/><stop offset=".45" stop-color="#6b6f76"/><stop offset=".6" stop-color="#2a2c30"/><stop offset="1" stop-color="#16171a"/></linearGradient>
   <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9bbbf"/><stop offset=".5" stop-color="#f4f4f5"/><stop offset="1" stop-color="#9a9da2"/></linearGradient>
   <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
   <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g class="light" filter="url(#blur)" opacity=".7">
   <ellipse cx="1150" cy="260" rx="260" ry="200" fill="#ffffff"/>
   <ellipse cx="500" cy="700" rx="320" ry="140" fill="#dcdcd8"/>
  </g>
  <ellipse cx="1130" cy="835" rx="260" ry="26" fill="url(#floor)"/>
  <g class="sway">
   <!-- socket -->
   <path d="M1040 40 Q1130 20 1220 40 L1204 260 Q1130 290 1056 260 Z" fill="url(#carbon)"/>
   <path d="M1064 60 Q1130 46 1196 60" stroke="#8a8e95" stroke-width="3" fill="none" opacity=".6"/>
   <!-- adapter -->
   <rect x="1100" y="262" width="60" height="70" rx="10" fill="url(#metal)"/>
   <circle cx="1130" cy="300" r="9" fill="#55585d"/>
   <!-- pylon -->
   <rect x="1112" y="330" width="36" height="250" rx="12" fill="url(#metal)"/>
   <!-- blade foot -->
   <path d="M1108 570 L1152 570 L1156 640 C1158 740 1210 790 1330 802 L1346 822 C1190 822 1096 760 1092 650 Z" fill="url(#carbon)"/>
   <path d="M1128 580 C1126 730 1190 800 1320 812" stroke="url(#shine)" stroke-width="5" fill="none" class="sheen"/>
   <rect x="1100" y="560" width="60" height="26" rx="8" fill="#3a3c41"/>
  </g>
 </svg>

 <div class="fg">
  <nav>
   <div class="logo"><svg width="18" height="18" viewBox="0 0 256 256" fill="none" aria-label="Logo"><path fill="rgb(84, 84, 84)" d="M 160 88 L 194 34 L 216 0 L 256 0 L 256 40 L 221.5 93.5 L 200 128 L 256 128 L 256 256 L 96 256 L 96 168 L 64.246 220 L 40 256 L 0 256 L 0 216 L 34 162 L 56 128 L 0 128 L 0 0 L 160 0 Z"/></svg></div>
   <div class="pill"><a href="#">Story</a><a href="#">Products</a><a href="#">Help</a><a href="#">Support</a></div>
  </nav>
  <div class="hero">
   <div class="inner">
    <a href="#" class="badge group">Seen on Shark Tank in India <span class="arrow">→</span></a>
    <h1>Simple, smart prosthetics made for people who keep fighting.</h1>
    <p class="sub">Reclaim your movement now.</p>
    <a href="#" class="cta group">Try a free fitting <span class="arrow">→</span></a>
   </div>
  </div>
 </div>
</div>
<script>
(function(){var s=document.querySelector('.bg'),m=window.matchMedia('(max-aspect-ratio:1/1)');
function f(){s.setAttribute('viewBox',m.matches?'760 0 740 900':'0 0 1600 900')}
f();(m.addEventListener?m.addEventListener('change',f):m.addListener(f));})();
</script>
</body>
</html>
