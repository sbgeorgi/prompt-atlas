<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mainframe - A.R.I.A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font-heading:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --font-body:'Inter Tight','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#b0001c;overflow:hidden}
body{font-family:var(--font-body);color:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
#stage{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
/* navbar */
nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.logo{display:flex;align-items:center;gap:12px}
.logo .name{font-family:var(--font-heading);font-size:21px;letter-spacing:-.025em;font-weight:500}
.logo .ast{font-size:25px;user-select:none;letter-spacing:-.02em}
.links,.cta{display:none;font-size:23px}
.links a,.cta{transition:opacity .2s}
.links a:hover,.cta:hover{opacity:.6}
.cta{text-decoration:underline;text-underline-offset:2px}
.burger{background:none;border:0;display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:6px;z-index:11}
.burger i{display:block;width:24px;height:2px;background:#fff;transition:all .3s}
.burger.open i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open i:nth-child(2){opacity:0}
.burger.open i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.overlay{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 32px;gap:32px;font-size:32px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:auto}
.overlay .u{text-decoration:underline}
/* hero */
.hero{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 48px;overflow:hidden}
.content{position:relative;z-index:10;max-width:36rem}
.intro{pointer-events:none;user-select:none;margin-bottom:20px;font-size:clamp(18px,4vw,26px);line-height:1.3;font-weight:400;filter:blur(4px)}
.type{margin-bottom:20px;font-size:clamp(18px,4vw,26px);line-height:1.35;font-weight:400;min-height:54px}
.cursor{display:inline-block;width:2px;height:1.1em;background:#fff;vertical-align:middle;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pills{display:flex;flex-wrap:wrap;row-gap:4px;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
.pills.show{opacity:1;transform:none}
.pill{display:inline-flex;align-items:center;justify-content:center;font:inherit;cursor:pointer;background:#fff;color:#000;border:1px solid rgba(0,0,0,.1);border-radius:9999px;font-size:13px;padding:.3em 16px;margin:0 .2em .4em;white-space:nowrap;transition:background-color .2s,color .2s}
.pill:hover{background:#000;color:#fff}
.pill.out{background:transparent;color:#fff;border:1px solid #fff;gap:8px}
.pill.out:hover{background:#fff;color:#000}
.pill.out u{text-underline-offset:1px}
@media(min-width:640px){
  nav{padding:20px 32px}
  .logo .name{font-size:26px}.logo .ast{font-size:30px}
  .hero{padding-left:32px;padding-right:32px}
  .intro,.type{margin-bottom:24px}
  .pill{font-size:15px;padding:.3em 20px}
  .pill.out{gap:12px}
}
@media(min-width:768px){
  .links{display:flex}.cta{display:block}
  .burger,.overlay{display:none}
  .hero{justify-content:center;padding-bottom:0;padding-left:40px;padding-right:40px}
}
@media(max-width:767px){.pill{font-size:12px}}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>

<nav>
  <div class="logo"><span class="name">Mainframe&reg;</span><span class="ast">&#x2733;&#xFE0E;</span></div>
  <div class="links"><a href="#">Labs</a>,&nbsp;<a href="#">Studio</a>,&nbsp;<a href="#">Openings</a>,&nbsp;<a href="#">Shop</a></div>
  <a class="cta" href="#">Get in touch</a>
  <button class="burger" id="burger" aria-label="Menu"><i></i><i></i><i></i></button>
</nav>
<div class="overlay" id="ov"><a href="#">Labs</a><a href="#">Studio</a><a href="#">Openings</a><a href="#">Shop</a><a class="u" href="#">Get in touch</a></div>

<section class="hero">
  <div class="content">
    <p class="intro">Hey there, meet A.R.I.A,<br>Mainframe's Adaptive Response Interface Agent</p>
    <p class="type"><span id="tw"></span><span class="cursor" id="cur"></span></p>
    <div class="pills" id="pills">
      <button class="pill">Pitch us an idea</button>
      <button class="pill">Come work here</button>
      <button class="pill">Send a brief hello</button>
      <button class="pill">See how we operate</button>
      <button class="pill out" id="copy"><span>Reach us: <u>hello@mainframe.co</u></span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><rect x="4" y="4" width="7" height="7" rx="1"/><path d="M8 4V2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h2"/></svg>
      </button>
    </div>
  </div>
</section>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* mobile menu */
  var b=document.getElementById('burger'),ov=document.getElementById('ov');
  b.onclick=function(){b.classList.toggle('open');ov.classList.toggle('open')};

  /* copy */
  document.getElementById('copy').onclick=function(){
    try{navigator.clipboard.writeText('hello@mainframe.co').catch(function(){})}catch(e){}
  };

  /* typewriter */
  var TEXT='Glad you stopped in. Good taste tends to find us. Now, what are we building?';
  var tw=document.getElementById('tw'),cur=document.getElementById('cur'),pills=document.getElementById('pills');
  if(reduce){tw.textContent=TEXT;cur.style.display='none';pills.classList.add('show')}
  else{
    setTimeout(function(){pills.classList.add('show')},400);
    setTimeout(function(){
      var i=0,id=setInterval(function(){
        i++;tw.textContent=TEXT.slice(0,i);
        if(i>=TEXT.length){clearInterval(id);cur.style.display='none'}
      },38);
    },600);
  }

  /* ---------- stand-in "video": a clay character rendered on canvas, scrubbed by mouse ---------- */
  var cv=document.getElementById('stage'),ctx=cv.getContext('2d');
  var W=0,H=0,dpr=1;
  var DUR=8,SENS=.8;               // virtual video duration (s) and mouse sensitivity (as in the prompt)
  var cur_t=DUR*0.62,target=cur_t,prevX=null,dirty=true;

  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  // pre-generate hair strokes (in head units)
  var R=rng(7),hair=[];
  var blobs=[[0,-86,90,40],[-56,-72,44,34],[52,-74,44,34],[-12,-116,56,40],[34,-108,44,36],[-52,-98,34,28],[80,-54,18,32],[-82,-52,18,32],[8,-100,70,34]];
  for(var i=0;i<1500;i++){
    var bl=blobs[(R()*blobs.length)|0],a=R()*6.283,r=Math.sqrt(R());
    var x=bl[0]+Math.cos(a)*bl[2]*r,y=bl[1]+Math.sin(a)*bl[3]*r;
    // keep clear of the face below the hairline
    var hl=-34+Math.cos(x/95*1.57)*-26;
    if(y>-44&&Math.abs(x)<70)continue;
    if(y>-30)continue;
    var ang=Math.atan2(y+40,x)+ (R()-.5)*1.4;
    hair.push({x:x,y:y,a:ang,l:6+R()*10,c:(R()*4)|0,d:R()*.5+.5});
  }
  var HC=['#6e3a26','#8a4b30','#a45f3e','#5a2e1f'];
  var skin=[];
  for(i=0;i<500;i++){var a2=R()*6.283,r2=Math.sqrt(R());skin.push([Math.cos(a2)*84*r2,Math.sin(a2)*96*r2,R()])}

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;dirty=true;
  }
  addEventListener('resize',resize);resize();

  function ell(x,y,rx,ry,fill,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(rx,.1),ry,rot||0,0,6.283);ctx.fillStyle=fill;ctx.fill()}

  function draw(t,time){
    // background: deep red with soft light, like the studio backdrop
    var g=ctx.createRadialGradient(W*.72,H*.35,0,W*.72,H*.35,Math.max(W,H)*.9);
    g.addColorStop(0,'#e6203a');g.addColorStop(.45,'#c3081f');g.addColorStop(1,'#8c0016');
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var lg=ctx.createLinearGradient(0,0,W,0);
    lg.addColorStop(0,'rgba(60,0,10,.35)');lg.addColorStop(.55,'rgba(60,0,10,0)');
    ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);

    var mobile=W<768;
    var k=(mobile?Math.min(H/397*0.95,W/360):H/397)*0.88;
    var cx=mobile?W*.62:W*.735, cy=mobile?H*.3:H*.37;
    var p=t/DUR;                                  // 0..1 through the "clip"
    var yaw=Math.sin((p-.5)*Math.PI*1.6);         // -1 (look left) .. +1 (look right)
    var tilt=Math.sin(p*Math.PI*2)*.05;
    var bob=Math.sin(time*.0016)*(reduce?0:1.5);

    ctx.save();
    ctx.translate(cx,cy+bob*k);ctx.scale(k,k);

    // body: olive knit shirt
    var sx=yaw*-8;
    ctx.save();ctx.translate(sx,0);
    ell(0,110,46,60,'#e7a98f');                      // neck
    ctx.beginPath();
    ctx.moveTo(-700,800);ctx.lineTo(-700,420);ctx.bezierCurveTo(-400,400,-250,230,-62,138);
    ctx.lineTo(62,138);ctx.bezierCurveTo(250,230,400,400,700,420);ctx.lineTo(700,800);ctx.closePath();
    var sg=ctx.createLinearGradient(-200,150,200,320);sg.addColorStop(0,'#8c9640');sg.addColorStop(1,'#667028');
    ctx.fillStyle=sg;ctx.fill();
    // knit texture
    ctx.strokeStyle='rgba(40,50,10,.18)';ctx.lineWidth=1;
    for(i=0;i<110;i++){var kx=-200+(i*37%400),ky=170+(i*53%160);ctx.beginPath();ctx.moveTo(kx,ky);ctx.lineTo(kx+3,ky+7);ctx.stroke()}
    // neck shadow + collar
    ctx.beginPath();ctx.moveTo(-60,136);ctx.quadraticCurveTo(0,176,60,136);ctx.quadraticCurveTo(0,112,-60,136);ctx.fillStyle='#d68e78';ctx.fill();
    ctx.beginPath();ctx.moveTo(-62,134);ctx.lineTo(-18,176);ctx.lineTo(-8,214);ctx.lineTo(-68,184);ctx.closePath();ctx.fillStyle='#7a8534';ctx.fill();ctx.strokeStyle='rgba(30,40,5,.35)';ctx.stroke();
    ctx.beginPath();ctx.moveTo(62,134);ctx.lineTo(18,176);ctx.lineTo(8,214);ctx.lineTo(68,184);ctx.closePath();ctx.fillStyle='#707b2e';ctx.fill();ctx.stroke();
    ell(0,224,9,9,'#4c5518');ell(-1,222,4,4,'#6a742a');
    ell(0,278,9,9,'#4c5518');ell(-1,276,4,4,'#6a742a');
    ctx.restore();

    // head
    ctx.save();ctx.rotate(tilt);
    var hx=yaw*-6;
    // ears (far ear smaller / hidden behind head)
    var earL=1-Math.max(0,yaw)*.55, earR=1+Math.min(0,yaw)*.55;
    ell(-86+hx+yaw*10,12,16*earL,26,'#e5a48a'); ell(-86+hx+yaw*10,12,8*earL,16,'#d68b75');
    ell(86+hx+yaw*10,12,16*earR,26,'#e5a48a'); ell(86+hx+yaw*10,12,8*earR,16,'#d68b75');
    // face
    var fg=ctx.createRadialGradient(-20+yaw*20,-30,10,0,10,120);
    fg.addColorStop(0,'#f7c4ac');fg.addColorStop(.7,'#eeaa90');fg.addColorStop(1,'#d98f7a');
    ctx.save();ctx.translate(hx,0);
    ctx.beginPath();ctx.ellipse(0,6,90,102,0,0,6.283);ctx.fillStyle=fg;ctx.fill();
    ctx.clip();
    ctx.fillStyle='rgba(255,230,215,.25)';
    for(i=0;i<skin.length;i++){ctx.fillRect(skin[i][0]*1.05,skin[i][1]+6,1.3,1.3)}
    ctx.restore();

    // features
    var fx=yaw*34+hx, fy=2;
    // cheeks
    var ck=function(x,s){var gg=ctx.createRadialGradient(x,fy+34,0,x,fy+34,26*s);gg.addColorStop(0,'rgba(236,110,110,.75)');gg.addColorStop(1,'rgba(236,110,110,0)');ctx.fillStyle=gg;ctx.fillRect(x-30,fy+4,60,60)};
    ck(fx-60,1-yaw*.2);ck(fx+60,1+yaw*.2);
    // eyes
    function eye(x,sc){
      ctx.save();ctx.translate(x,fy-12);ctx.scale(sc,1);
      ell(0,2,18,21,'#f6f2ee');
      ctx.strokeStyle='rgba(120,60,50,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,2,18,21,0,0,6.283);ctx.stroke();
      var ix=yaw*9+4,iy=3;
      ell(ix,iy+2,12,13,'#7a4426');ell(ix,iy+2,9.5,10.5,'#5b2f18');ell(ix+1,iy+3,5.5,6,'#1b0c06');
      ell(ix-4,iy-5,3.4,3.4,'#fff');ell(ix+5,iy+5,1.6,1.6,'rgba(255,255,255,.8)');
      ctx.restore();
    }
    eye(fx-40,1+yaw*.12);eye(fx+40,1-yaw*.16);
    // brows
    ctx.lineCap='round';
    function brow(x,w,a){ctx.save();ctx.translate(x,fy-52);ctx.rotate(a);
      ctx.strokeStyle='#6d3a24';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(-w,2);ctx.quadraticCurveTo(0,-9,w,3);ctx.stroke();
      ctx.strokeStyle='#8b4e32';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-w+4,-1);ctx.quadraticCurveTo(0,-11,w-4,0);ctx.stroke();ctx.restore()}
    brow(fx-42,28,-.16+yaw*.04);brow(fx+42,28,.16+yaw*.04);
    // nose
    var nx=fx+yaw*16,ng=ctx.createRadialGradient(nx-6,fy+24,2,nx,fy+30,34);
    ng.addColorStop(0,'#f7a69a');ng.addColorStop(.7,'#ee8e88');ng.addColorStop(1,'#df7b78');
    ctx.beginPath();ctx.ellipse(nx,fy+30,33,28,0,0,6.283);ctx.fillStyle=ng;ctx.fill();
    ell(nx-9,fy+20,8,5,'rgba(255,225,215,.55)');
    // mouth
    ctx.strokeStyle='#b4574f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(fx-26+yaw*8,fy+72);ctx.quadraticCurveTo(fx+yaw*12,fy+88,fx+32+yaw*10,fy+68);ctx.stroke();
    ctx.strokeStyle='rgba(180,87,79,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(fx+32+yaw*10,fy+68);ctx.lineTo(fx+36+yaw*10,fy+64);ctx.stroke();

    // hair: wool-felt strokes
    var hxs=yaw*-10;
    ctx.save();ctx.translate(hxs+hx,-14);
    for(i=0;i<blobs.length;i++){var bl2=blobs[i];ell(bl2[0],bl2[1],bl2[2]*.92,bl2[3]*.92,'#7b4129')}
    ctx.lineWidth=2.2;
    for(i=0;i<hair.length;i++){
      var h=hair[i];ctx.strokeStyle=HC[h.c];
      ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.quadraticCurveTo(h.x+Math.cos(h.a+.6)*h.l*.6,h.y+Math.sin(h.a+.6)*h.l*.6,h.x+Math.cos(h.a)*h.l,h.y+Math.sin(h.a)*h.l);ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
    ctx.restore();
    // soft felt look
    ctx.fillStyle='rgba(255,255,255,.025)';
  }

  function render(time){
    draw(cur_t,time||0);
  }

  /* mouse scrub: delta of X -> time offset, clamped, with a seek queue like the video onSeeked handler */
  var seeking=false;
  function seek(){
    if(seeking)return;
    seeking=true;
    requestAnimationFrame(function(){
      cur_t=target;dirty=true;seeking=false;
      if(Math.abs(cur_t-target)>.001)seek();
    });
  }
  function onMove(x){
    if(prevX===null){prevX=x;return}
    var d=x-prevX;prevX=x;
    target=Math.max(0,Math.min(DUR,target+(d/innerWidth)*SENS*DUR*4));
    seek();
  }
  addEventListener('mousemove',function(e){onMove(e.clientX)},{passive:true});
  addEventListener('touchmove',function(e){if(e.touches[0])onMove(e.touches[0].clientX)},{passive:true});

  var last=0;
  function loop(ts){
    if(!reduce&&ts-last>33){last=ts;dirty=true}
    if(dirty){render(ts);dirty=false}
    requestAnimationFrame(loop);
  }
  render(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
