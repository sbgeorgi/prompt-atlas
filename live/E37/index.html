<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEX Ventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#000;color:#fff;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0}
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;background:#000}
/* stand-in for the background video: no overlay on top of it */
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pad{padding-left:24px;padding-right:24px;position:relative;z-index:2}
@media(min-width:768px){.pad{padding-left:48px;padding-right:48px}}
@media(min-width:1024px){.pad{padding-left:64px;padding-right:64px}}
.navwrap{padding-top:24px}
.liquid-glass{background:rgba(0,0,0,.4);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.1) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.1) 80%,rgba(255,255,255,.3) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
nav.liquid-glass{border-radius:12px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.025em}
.links{display:none;gap:32px;font-size:14px;line-height:20px}
@media(min-width:768px){.links{display:flex}}
.links a{transition:color .2s}
.links a:hover{color:#d1d5db}
.btn{border-radius:8px;font-weight:500;transition:background .2s,color .2s}
.btn-w{background:#fff;color:#000}
.btn-w:hover{background:#f3f4f6}
.nav-btn{padding:8px 24px;font-size:14px;line-height:20px}
.content{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:48px;padding-top:80px}
@media(min-width:1024px){.content{padding-bottom:64px;display:flex}.grid{display:grid;grid-template-columns:1fr 1fr;align-items:end}}
h1{font-weight:400;margin-bottom:16px;letter-spacing:-.04em;font-size:min(36px,8.4vw);line-height:1.1}
@media(min-width:768px){h1{font-size:48px;line-height:1}}
@media(min-width:1024px){h1{font-size:60px;line-height:1}}
@media(min-width:1280px){h1{font-size:72px;line-height:1}}
h1 .ch{display:inline-block;opacity:0;transform:translateX(-18px);transition:opacity 500ms,transform 500ms}
h1.go .ch{opacity:1;transform:none}
.line{display:block;white-space:nowrap}
.fade{opacity:0;transition:opacity 1000ms}
.fade.go{opacity:1}
.sub{font-size:16px;line-height:24px;color:#d1d5db;margin-bottom:20px}
@media(min-width:768px){.sub{font-size:18px;line-height:28px}}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row .btn{padding:12px 32px;font-size:16px;line-height:24px}
.btn-g{color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px}
.btn-g:hover{background:#fff;color:#000}
.btn-g.liquid-glass{transition:background .2s,color .2s}
.tagcol{display:flex;align-items:flex-end;justify-content:flex-start;margin-top:32px}
@media(min-width:1024px){.tagcol{justify-content:flex-end;margin-top:0}}
.tag{border:1px solid rgba(255,255,255,.2);padding:12px 24px;border-radius:12px;font-weight:300;font-size:18px;line-height:28px}
@media(min-width:768px){.tag{font-size:20px}}
@media(min-width:1024px){.tag{font-size:24px;line-height:32px}}
@media(prefers-reduced-motion:reduce){h1 .ch,.fade{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<section class="hero">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="pad navwrap">
    <nav class="liquid-glass">
      <div class="logo">VEX</div>
      <div class="links"><a href="#">Story</a><a href="#">Investing</a><a href="#">Building</a><a href="#">Advisory</a></div>
      <button class="btn btn-w nav-btn">Start a Chat</button>
    </nav>
  </div>
  <div class="pad content">
    <div class="grid">
      <div>
        <h1 id="h" aria-label="Shaping tomorrow with vision and action."></h1>
        <p class="sub fade" data-d="800">We back visionaries and craft ventures that define what comes next.</p>
        <div class="row fade" data-d="1200">
          <button class="btn btn-w">Start a Chat</button>
          <button class="btn btn-g liquid-glass">Explore Now</button>
        </div>
      </div>
      <div class="tagcol">
        <div class="tag liquid-glass fade" data-d="1400">Investing. Building. Advisory.</div>
      </div>
    </div>
  </div>
</section>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // AnimatedHeading
  var h=document.getElementById('h'),lines=['Shaping tomorrow','with vision and action.'],CD=30;
  lines.forEach(function(t,li){
    var l=document.createElement('span');l.className='line';
    for(var i=0;i<t.length;i++){
      var s=document.createElement('span');s.className='ch';s.setAttribute('aria-hidden','true');
      s.textContent=t[i]===' '?' ':t[i];
      s.style.transitionDelay=(li*t.length*CD+i*CD)+'ms';
      l.appendChild(s);
    }
    h.appendChild(l);
  });
  setTimeout(function(){h.classList.add('go')},reduce?0:200);
  // FadeIn
  document.querySelectorAll('.fade').forEach(function(e){
    setTimeout(function(){e.classList.add('go')},reduce?0:+e.dataset.d);
  });
  // Background stand-in: slow dark flowing light field (canvas, low-res)
  var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,t=0;
  function size(){var s=.5;W=c.width=Math.max(2,Math.floor(innerWidth*s/2));H=c.height=Math.max(2,Math.floor(innerHeight*s/2))}
  size();addEventListener('resize',size);
  var blobs=[[.2,.3,.55,'70,110,170'],[.75,.25,.5,'150,170,200'],[.5,.8,.6,'40,70,110'],[.9,.7,.45,'110,90,70'],[.1,.85,.4,'30,50,80']];
  function draw(){
    x.globalCompositeOperation='source-over';
    var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#05070b');g.addColorStop(1,'#0a0f18');
    x.fillStyle=g;x.fillRect(0,0,W,H);
    x.globalCompositeOperation='lighter';
    blobs.forEach(function(b,i){
      var px=(b[0]+Math.sin(t*.25+i*1.7)*.18)*W,py=(b[1]+Math.cos(t*.2+i*2.3)*.18)*H,r=b[2]*Math.max(W,H)*(.9+.15*Math.sin(t*.3+i));
      var rg=x.createRadialGradient(px,py,0,px,py,r);
      rg.addColorStop(0,'rgba('+b[3]+',.55)');rg.addColorStop(.5,'rgba('+b[3]+',.2)');rg.addColorStop(1,'rgba('+b[3]+',0)');
      x.fillStyle=rg;x.fillRect(0,0,W,H);
    });
    // soft light ribbons
    x.globalCompositeOperation='screen';
    for(var k=0;k<3;k++){
      x.beginPath();
      for(var i=0;i<=W;i+=4){
        var y=H*(.35+.12*k)+Math.sin(i*.02+t*.5+k*2)*H*.08+Math.sin(i*.007-t*.3+k)*H*.12;
        i?x.lineTo(i,y):x.moveTo(i,y);
      }
      x.strokeStyle='rgba(200,220,255,'+(.05+.02*k)+')';x.lineWidth=H*.06;x.stroke();
    }
    t+=.016;
  }
  draw();
  if(!reduce){(function loop(){draw();requestAnimationFrame(loop)})()}
})();
</script>
</body>
</html>
