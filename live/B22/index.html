<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apogee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;450;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#080A19}
body{font-family:'Suisse Intl','Inter Tight',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:#fff}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none}

@keyframes fade-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-down{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-scale{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes bar-grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.a{opacity:0;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.a-up{animation-name:fade-up;animation-duration:.8s}
.a-down{animation-name:fade-down;animation-duration:.7s}
.a-scale{animation-name:fade-scale;animation-duration:.9s}
.bar{flex:1;border-radius:.5px;transform-origin:bottom;opacity:0;animation:bar-grow .6s cubic-bezier(.16,1,.3,1) forwards}

/* hero */
.hero{position:relative;width:100%;height:100vh;height:100svh;min-height:640px;overflow:hidden;background:#080A19}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wrap{position:relative;z-index:10;height:100%;display:flex;flex-direction:column}
.main{flex:1;display:flex;align-items:center;padding:32px 0}
.row{width:100%;max-width:1800px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:40px}
.copy{max-width:593px}
h1{font-weight:400;font-size:36px;line-height:.95;margin-bottom:20px;letter-spacing:-.01em}
.sub{color:rgba(255,255,255,.8);font-size:16px;font-weight:450;line-height:1.3;max-width:370px;margin-bottom:28px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{height:46px;padding:0 20px;border-radius:12px;font-size:14px;font-weight:450;line-height:15.5px;transition:opacity .2s;display:inline-flex;align-items:center;justify-content:center}
.btn.light{background:#E9E9E9;color:#0A0707}
.btn.light:hover{opacity:.9}
.btn.line{border:1px solid #fff;color:#fff}
.btn.line:hover{opacity:.8}

/* card */
.cardw{width:100%;max-width:405px;margin:0 auto}
.card{width:100%;border-radius:24px;background:rgba(17,16,15,.35);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:20px}
.card .lbl{font-size:16px;font-weight:450;line-height:20px;margin-bottom:12px}
.card .amt{margin-bottom:8px}
.card .amt span{font-size:28px;font-weight:450;line-height:1}
.card .amt .c{color:rgba(255,255,255,.2)}
.delta{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.badge{padding:7px 6px;background:rgba(255,255,255,.2);border-radius:6px;font-size:12px;font-weight:450;line-height:14px}
.cap{color:rgba(255,255,255,.8);opacity:.7;font-size:12px;font-weight:450;line-height:14px}
.chart{position:relative}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:80px}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.1)}
.axis{display:flex;justify-content:space-between;margin-top:12px}
.axis span{font-size:9px;font-weight:450;line-height:10px;color:rgba(255,255,255,.8)}

/* nav */
nav{width:100%;max-width:1800px;margin:0 auto;padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:50}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:28px;height:28px}
.logo span{font-size:22px;font-weight:450;line-height:1;letter-spacing:-.02em}
.pill{display:none;height:52px;align-items:center;-webkit-backdrop-filter:blur(17px);backdrop-filter:blur(17px)}
.pill.mid{padding:0 24px;gap:30px;background:rgba(10,7,7,.35);border-radius:11px}
.pill.mid button,.pill.mid span{color:rgba(255,255,255,.8);font-size:14px;font-weight:450;line-height:14px;transition:color .2s;cursor:pointer}
.pill.mid button:hover,.pill.mid span:hover{color:#fff}
.pill.mid button{display:flex;align-items:center;gap:5px}
.pill.mid svg{width:10px;height:10px;opacity:.8}
.pill.auth{padding:3px;gap:5px;background:rgba(0,0,0,.35);border-radius:13px}
.pill.auth a{height:46px;padding:0 24px;border-radius:11px;font-size:14px;font-weight:450;line-height:14px;display:flex;align-items:center;transition:background .2s}
.pill.auth a.login:hover{background:rgba(255,255,255,.05)}
.pill.auth a.demo{background:#E9E9E9;color:#0A0707}
.pill.auth a.demo:hover{background:#fff}
.burger{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(10,7,7,.35);-webkit-backdrop-filter:blur(17px);backdrop-filter:blur(17px);transition:background .2s}
.burger:hover{background:rgba(255,255,255,.1)}
.ico{position:relative;width:20px;height:20px}
.ico svg{position:absolute;inset:0;width:20px;height:20px;transition:all .3s ease-out}
.ico .m{opacity:1;transform:none}.ico .x{opacity:0;transform:rotate(-90deg) scale(.75)}
.open .ico .m{opacity:0;transform:rotate(90deg) scale(.75)}.open .ico .x{opacity:1;transform:none}

/* mobile menu */
.menu{position:fixed;inset:0;z-index:40;visibility:hidden;transition:visibility .5s}
.open .menu{visibility:visible}
.menu .bd{position:absolute;inset:0;background:rgba(8,10,25,.9);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);opacity:0;transition:opacity .5s}
.open .menu .bd{opacity:1}
.panel{position:absolute;top:76px;left:16px;right:16px;background:rgba(17,16,15,.6);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:20px;border:1px solid rgba(255,255,255,.06);padding:24px;transition:all .5s cubic-bezier(.32,.72,0,1);transform-origin:top;opacity:0;transform:translateY(-16px) scale(.97)}
.open .panel{opacity:1;transform:none}
.links{display:flex;flex-direction:column;gap:4px}
.links a{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:12px;color:rgba(255,255,255,.9);font-size:18px;font-weight:450;transition:all .3s;opacity:0;transform:translateX(-12px);transition-delay:0ms}
.links a:hover{background:rgba(255,255,255,.06)}
.links svg{width:16px;height:16px;opacity:.5}
.open .links a{opacity:1;transform:none}
.open .links a:nth-child(1){transition-delay:100ms}.open .links a:nth-child(2){transition-delay:150ms}.open .links a:nth-child(3){transition-delay:200ms}.open .links a:nth-child(4){transition-delay:250ms}
.div{height:1px;background:rgba(255,255,255,.1);margin:20px 0}
.pcta{display:flex;flex-direction:column;gap:12px;transition:all .3s;opacity:0;transform:translateY(8px)}
.open .pcta{opacity:1;transform:none;transition-delay:350ms}
.pcta a{width:100%;height:50px;border-radius:12px;font-size:15px;font-weight:450;display:flex;align-items:center;justify-content:center;transition:background .2s}
.pcta .d{background:#E9E9E9;color:#0A0707}.pcta .d:hover{background:#fff}
.pcta .l{border:1px solid rgba(255,255,255,.3)}.pcta .l:hover{background:rgba(255,255,255,.05)}
.open{overflow:hidden}

@media(min-width:640px){
 nav{padding:30px 32px 0}.row{padding:0 32px}
 .logo svg{width:32px;height:32px}.logo span{font-size:26px}
 h1{font-size:52px;margin-bottom:32px}.sub{font-size:18px;margin-bottom:40px}
 .ctas{gap:16px}.btn{height:51px;padding:0 27px;font-size:15.5px}
 .card{border-radius:33px;padding:32px 32px 24px}
 .card .lbl{font-size:20px;margin-bottom:16px}.card .amt{margin-bottom:12px}.card .amt span{font-size:46px}
 .delta{margin-bottom:32px}.badge,.cap{font-size:14px}.bars{height:100px}.axis span{font-size:10px}
 .panel{top:86px;left:24px;right:24px;padding:32px}
}
@media(min-width:768px){nav,.row{padding-left:82px;padding-right:82px}h1{font-size:64px}.sub{font-size:20px}}
@media(min-width:1024px){
 h1{font-size:72px}
 .row{flex-direction:row;align-items:center;justify-content:space-between;gap:48px}
 .cardw{margin:0}
 .pill{display:flex}.burger,.menu{display:none}
}
@media(prefers-reduced-motion:reduce){.a,.bar{animation-duration:.01s!important}}
</style>
</head>
<body>
<section class="hero" id="root">
  <canvas class="bg" id="bg"></canvas>
  <div class="wrap">
    <nav>
      <div class="a a-down" style="animation-delay:0ms">
        <div class="logo">
          <svg viewBox="0 0 256 256" fill="none"><path fill="#fff" d="M 256 256 L 178 256 C 150.386 256 128 233.614 128 206 L 128 256 L 0 256 L 0 192 C 0 156.654 28.654 128 64 128 C 99.346 128 128 156.654 128 192 L 128 128 L 256 128 Z M 78 0 C 105.614 0 128 22.386 128 50 L 128 0 L 256 0 L 256 64 C 256 99.346 227.346 128 192 128 C 156.654 128 128 99.346 128 64 L 128 128 L 0 128 L 0 0 Z"/></svg>
          <span>Apogee</span>
        </div>
      </div>
      <div class="a a-down pill mid" style="animation-delay:100ms">
        <button>Platform <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <span>Pricing</span><span>Resources</span><span>Blog</span>
      </div>
      <div class="a a-down pill auth" style="animation-delay:200ms">
        <a href="#" class="login">Login</a><a href="#" class="demo">Book a demo</a>
      </div>
      <div class="a a-down" style="animation-delay:100ms" id="burgerw">
        <button class="burger" id="burger" aria-label="Toggle menu">
          <div class="ico">
            <svg class="m" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
            <svg class="x" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </div>
        </button>
      </div>
    </nav>
    <div class="menu" id="menu">
      <div class="bd" id="bd"></div>
      <div class="panel">
        <div class="links">
          <a href="#">Platform <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></a>
          <a href="#">Pricing</a><a href="#">Resources</a><a href="#">Blog</a>
        </div>
        <div class="div"></div>
        <div class="pcta"><a href="#" class="d">Book a demo</a><a href="#" class="l">Login</a></div>
      </div>
    </div>

    <div class="main">
      <div class="row">
        <div class="copy">
          <div class="a a-up" style="animation-delay:300ms"><h1>Elevate your essential data to new heights</h1></div>
          <div class="a a-up" style="animation-delay:500ms"><p class="sub">Advanced reasoning systems and predictive models built for the unknown</p></div>
          <div class="a a-up" style="animation-delay:700ms"><div class="ctas"><button class="btn light">Book a demo</button><button class="btn line">Talk with the team</button></div></div>
        </div>
        <div class="a a-scale cardw" style="animation-delay:900ms">
          <div class="card">
            <p class="lbl">Revenue Growth</p>
            <p class="amt"><span>$14,205,890</span><span class="c">.00</span></p>
            <div class="delta"><span class="badge">+32.4%</span><span class="cap">vs. previous period ($10.7M)</span></div>
            <div class="chart">
              <div class="bars" id="bars"></div>
              <div class="grid" id="grid"></div>
              <div class="axis" id="axis"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
const BAR_HEIGHTS=[23,40,53,40,33,14,7,17,75,65,88,75,65,47,33,88,4,7,9,14,95,65,79,37,7,40,17,20,62,47,92,72];
const maxH=Math.max(...BAR_HEIGHTS);
document.getElementById('bars').innerHTML=BAR_HEIGHTS.map((h,i)=>
 `<div class="bar" style="height:${h/maxH*100}%;background:${i>=28?'rgba(255,255,255,.1)':'#fff'};animation-delay:${1100+i*30}ms"></div>`).join('');
document.getElementById('grid').innerHTML=[0,1,2,3,4].map(i=>`<i style="left:${(i+1)/5*100}%"></i>`).join('');
document.getElementById('axis').innerHTML=['10:00','12:00','14:00','16:00','16:00'].map((t,i)=>`<span style="opacity:${i>=3?.4:1}">${t}</span>`).join('');

// menu
const root=document.getElementById('root');
function toggle(v){const o=v===undefined?!root.classList.contains('open'):v;root.classList.toggle('open',o);document.body.style.overflow=o?'hidden':''}
document.getElementById('burger').onclick=()=>toggle();
document.getElementById('bd').onclick=()=>toggle(false);
addEventListener('resize',()=>{if(innerWidth>=1024)toggle(false)});

// nebula (stand-in for the background video)
(function(){
 const c=document.getElementById('bg'),g=c.getContext('2d');
 const S=0.5;let W,H;
 function size(){W=c.width=Math.max(2,Math.round(innerWidth*S));H=c.height=Math.max(2,Math.round(innerHeight*S))}
 size();addEventListener('resize',size);
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const blobs=[];
 const cols=[[14,30,120],[10,18,80],[150,16,30],[190,24,36],[20,44,150],[110,10,24],[8,12,56],[8,12,56]];
 for(let i=0;i<22;i++){const col=cols[Math.floor(rnd()*cols.length)];
  blobs.push({x:rnd(),y:rnd(),r:.18+rnd()*.35,col,a:.09+rnd()*.2,sx:(rnd()-.5)*.02,sy:(rnd()-.5)*.02,ph:rnd()*6.28,sp:.05+rnd()*.12})}
 const stars=[];for(let i=0;i<260;i++)stars.push({x:rnd(),y:rnd(),r:rnd()*1.1+.2,a:.2+rnd()*.7,ph:rnd()*6.28});
 function frame(t){
  t/=1000;
  g.globalCompositeOperation='source-over';g.fillStyle='#05061a';g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  const m=Math.max(W,H);
  for(const b of blobs){
   const x=(b.x+Math.sin(t*b.sp+b.ph)*.08+b.sx*t)%1*W, y=(b.y+Math.cos(t*b.sp*.8+b.ph)*.07)*H, r=b.r*m;
   const gr=g.createRadialGradient(x,y,0,x,y,r);const [R,G,B]=b.col;
   gr.addColorStop(0,`rgba(${R},${G},${B},${b.a})`);gr.addColorStop(.5,`rgba(${R},${G},${B},${b.a*.35})`);gr.addColorStop(1,`rgba(${R},${G},${B},0)`);
   g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);
  }
  for(const s of stars){g.fillStyle=`rgba(255,255,255,${s.a*(.6+.4*Math.sin(t*1.2+s.ph))})`;g.fillRect(s.x*W,s.y*H,s.r,s.r)}
  // vignette
  g.globalCompositeOperation='source-over';
  const v=g.createRadialGradient(W/2,H/2,m*.25,W/2,H/2,m*.8);v.addColorStop(0,'rgba(5,6,26,0)');v.addColorStop(1,'rgba(5,6,26,.55)');
  g.fillStyle=v;g.fillRect(0,0,W,H);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
})();
</script>
</body>
</html>
