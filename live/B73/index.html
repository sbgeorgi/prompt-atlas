<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultShield - Lock Down Your Passwords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Inter+Tight:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --font-heading:'Helvetica Now Display Bold','Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --color-text:#192837;
  --color-accent:#7342E2;
  --color-login-bg:#F2F2EE;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9E5E0}
body{font-family:var(--font-body);color:var(--color-text);-webkit-font-smoothing:antialiased}
.root{position:relative;width:100%;min-height:100vh;min-height:100dvh;overflow:hidden;font-family:var(--font-body);color:var(--color-text)}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.veil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(242,242,238,.72) 0%,rgba(242,242,238,.38) 38%,rgba(242,242,238,0) 66%)}
.wrap{position:relative;z-index:10;max-width:1280px;margin:0 auto}
nav.wrap{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
@media(min-width:640px){nav.wrap{padding:20px 32px}}
.logo{display:block;flex:none}
.links{display:none;gap:36px;list-style:none}
.links a{font-size:.875rem;font-weight:500;color:var(--color-text);text-decoration:none;transition:opacity .2s}
.links:hover a{opacity:.45}.links a:hover{opacity:1}
.actions{display:none;gap:10px}
.btn{border:0;border-radius:9999px;padding:10px 20px;font:600 .875rem var(--font-body);cursor:pointer;transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(1.06)}
.btn.primary{background:var(--color-accent);color:#fff}
.btn.light{background:var(--color-login-bg);color:var(--color-text)}
.burger{background:none;border:0;color:var(--color-text);cursor:pointer;display:flex;padding:6px}
@media(min-width:768px){.links,.actions{display:flex}.burger{display:none}}
.hero{padding:clamp(40px,8vw,72px) 20px 80px}
@media(min-width:640px){.hero{padding-left:32px;padding-right:32px}}
.hero-in{max-width:560px}
h1{font-family:var(--font-heading);font-weight:700;font-size:clamp(1.65rem,5vw,3rem);line-height:1.05;letter-spacing:-.01em;color:#192837;margin-bottom:24px}
h1 svg{display:inline-block;vertical-align:middle;position:relative;top:-2px;margin:0 4px}
.sub{font-size:clamp(.9rem,2.5vw,1.1rem);line-height:1.65;opacity:.8;max-width:560px;margin-bottom:32px}
.cta{display:inline-flex;align-items:center;justify-content:space-between;gap:32px;min-width:210px;background:var(--color-accent);color:#fff;border:0;border-radius:50px;padding:17px 24px;font:600 clamp(.9rem,2vw,1rem) var(--font-body);box-shadow:0 4px 24px rgba(115,66,226,.28);cursor:pointer;transition:transform .2s,filter .2s}
.cta:hover{transform:scale(1.04);filter:brightness(1.1)}
.cta:active{transform:scale(.96)}
.fade{opacity:0;transform:translateY(28px);animation:up .6s cubic-bezier(.22,1,.36,1) forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}
@keyframes up{to{opacity:1;transform:none}}
/* mobile sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(25,40,55,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:fixed;top:0;right:0;z-index:50;width:min(88vw,360px);height:100dvh;background:#CFC8C5;box-shadow:-12px 0 48px rgba(25,40,55,.18);transform:translateX(100%);transition:transform .45s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;padding:20px 24px}
.open .backdrop{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid rgba(25,40,55,.18)}
.sheet ul{list-style:none;margin-top:18px;flex:1}
.sheet li{opacity:0;transform:translateX(24px);transition:opacity .4s,transform .4s}
.open .sheet li{opacity:1;transform:none;transition-delay:calc(.18s + var(--i)*.07s)}
.sheet li a{display:block;padding:14px 0;font:600 1.4rem var(--font-heading);color:var(--color-text);text-decoration:none}
.sheet .btn{width:100%;padding:14px 20px;margin-top:10px}
</style>
</head>
<body>
<div class="root" id="root">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="veil"></div>

  <nav class="wrap">
    <a class="logo" href="#" aria-label="VaultShield"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" overflow="visible" viewBox="0 0 256 256"><path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z" fill="#192837"/></svg></a>
    <ul class="links">
      <li><a href="#">Vault</a></li><li><a href="#">Plans</a></li><li><a href="#">Install</a></li><li><a href="#">News</a></li><li><a href="#">Help</a></li>
    </ul>
    <div class="actions">
      <button class="btn primary">Start For Free</button>
      <button class="btn light">Sign In</button>
    </div>
    <button class="burger" id="burger" aria-label="Menu"></button>
  </nav>

  <main class="wrap hero">
    <div class="hero-in">
      <h1 class="fade" id="h1"></h1>
      <p class="sub fade d1">Zero stress, total control. VaultShield keeps you covered with unbreakable storage, one-tap access, and pro-grade tools for your non-stop world.</p>
      <button class="cta fade d2"><span>Get It Free</span><span id="arrow" style="display:flex"></span></button>
    </div>
  </main>

  <div class="backdrop" id="backdrop"></div>
  <aside class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-h">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 256 256"><path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z" fill="#192837"/></svg>
      <button class="burger" id="close" aria-label="Close"></button>
    </div>
    <ul>
      <li style="--i:0"><a href="#">Vault</a></li><li style="--i:1"><a href="#">Plans</a></li><li style="--i:2"><a href="#">Install</a></li><li style="--i:3"><a href="#">News</a></li><li style="--i:4"><a href="#">Help</a></li>
    </ul>
    <div>
      <button class="btn primary">Start For Free</button>
      <button class="btn light">Sign In</button>
    </div>
  </aside>
</div>

<script>
// Lucide icon paths (inline)
const I={
 zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
 lock:'<circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/>',
 finger:'<path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>',
 arrow:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/>',
 menu:'<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'
};
const svg=(k,s,c='#192837')=>`<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
document.getElementById('h1').innerHTML=`${svg('zap',24)} Lock Down Your Passwords ${svg('lock',24)} with Ironclad Security ${svg('finger',24)}`;
document.getElementById('arrow').innerHTML=svg('arrow',20,'#fff');
const root=document.getElementById('root');
document.getElementById('burger').innerHTML=svg('menu',26);
document.getElementById('close').innerHTML=svg('x',26);
const set=o=>{root.classList.toggle('open',o);document.getElementById('sheet').setAttribute('aria-hidden',!o)};
document.getElementById('burger').onclick=()=>set(true);
document.getElementById('close').onclick=()=>set(false);
document.getElementById('backdrop').onclick=()=>set(false);

// Background: stands in for the looping video. Slow-drifting vault-logo blocks with a travelling light sweep.
const cv=document.getElementById('bg'),ctx=cv.getContext('2d');
const P=new Path2D("M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z");
let W,H,dpr;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',size);size();
// layers: x,y (fraction), scale (fraction of H), rotation drift, tone
const L=[
 {x:.80,y:.46,s:1.25,a:0,t:0,sp:.00012},
 {x:.62,y:.92,s:.62,a:0,t:1,sp:-.00018},
 {x:.97,y:.05,s:.52,a:0,t:2,sp:.00022},
 {x:.50,y:.10,s:.30,a:0,t:3,sp:-.00026}
];
const tones=[['#CFC8C5','#E4DFDB'],['#D9D2E6','#BFB0E6'],['#E8E3DC','#D3CBC6'],['#C9BEEA','#E6E1F2']];
function draw(ms){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#F2F0EC');g.addColorStop(1,'#E2DDD8');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const t=ms||0;
  L.forEach((l,i)=>{
    const sz=l.s*Math.max(H,W*.55);
    const dx=Math.sin(t*l.sp*6+i)*sz*.04, dy=Math.cos(t*l.sp*5+i*2)*sz*.04;
    ctx.save();
    ctx.translate(l.x*W+dx,l.y*H+dy);
    ctx.rotate(Math.sin(t*l.sp*3+i)*.06);
    ctx.scale(sz/256,sz/256);ctx.translate(-128,-128);
    const c=tones[l.t],gr=ctx.createLinearGradient(0,0,256,256);
    gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1]);
    ctx.fillStyle=gr;ctx.globalAlpha=i?0.85:0.95;
    ctx.shadowColor='rgba(25,40,55,.14)';ctx.shadowBlur=40*(256/sz)*dpr;ctx.shadowOffsetY=14*(256/sz);
    ctx.fill(P,'evenodd');
    ctx.restore();
  });
  // travelling light sweep
  const sx=((t*.00006)%1.6-.3)*W;
  const sw=ctx.createLinearGradient(sx-W*.25,0,sx+W*.25,H*.4);
  sw.addColorStop(0,'rgba(255,255,255,0)');sw.addColorStop(.5,'rgba(255,255,255,.35)');sw.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sw;ctx.fillRect(0,0,W,H);
}
draw(2600);
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){(function loop(ms){draw(ms);requestAnimationFrame(loop)})(0)}
</script>
</body>
</html>
