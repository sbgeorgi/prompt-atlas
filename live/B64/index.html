<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mėntality — IntelligentX hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Outfit","Inter",system-ui,sans-serif;
  --color-brand-green:#9fff00;
  --color-bg-base:#EDEEF5;
  --ink:#1a1a1a; --mute:#8e8e8e;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--color-bg-base);color:#18181b;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
::selection{background:var(--color-brand-green);color:#000}
a{color:inherit;text-decoration:none}
.wrap{min-height:100vh;background:var(--color-bg-base)}

/* NAV */
.nav{position:fixed;top:0;left:0;width:100%;z-index:50;padding:24px 0;background:linear-gradient(to bottom,rgba(241,241,241,.8),transparent);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
@media(min-width:768px){.nav{padding:40px 0}}
.nav-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:16px;max-width:80rem;margin:0 auto;padding:0 32px;align-items:center}
@media(min-width:768px){.nav-grid{padding:0 64px}}
@media(min-width:1024px){.nav-grid{padding:0 80px}}
.brand{grid-column:1/span 6;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:22px;font-weight:500;letter-spacing:-.02em;color:var(--ink)}
@media(min-width:768px){.brand{grid-column:1/span 3}}
.brand svg{width:28px;height:28px;flex:none}
.links{display:none;grid-column:4/span 6;justify-content:center;gap:28px;font-size:13px;color:#3f3f46}
@media(min-width:768px){.links{display:flex}}
.links a{position:relative;padding:4px 0;transition:color .25s}
.links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.links a:hover{color:var(--ink)}.links a:hover::after{transform:scaleX(1)}
.right{grid-column:7/span 6;display:flex;justify-content:flex-end;align-items:center;gap:20px;font-size:13px}
@media(min-width:768px){.right{grid-column:10/span 3}}
.find{display:none;color:#3f3f46;transition:color .25s}
.find:hover{color:var(--ink)}
@media(min-width:768px){.find{display:inline}}
.cta{display:none;background:var(--ink);color:#fff;border-radius:999px;padding:11px 20px;font-size:13px;font-weight:500;transition:transform .25s,background .25s;white-space:nowrap}
.cta:hover{background:#000;transform:translateY(-1px)}
.cta span{display:inline-block;transition:transform .25s}.cta:hover span{transform:translateX(3px)}
@media(min-width:768px){.cta{display:inline-block}}
.burger{width:40px;height:40px;border:0;background:rgba(255,255,255,.55);border-radius:50%;position:relative;cursor:pointer;backdrop-filter:blur(6px)}
@media(min-width:768px){.burger{display:none}}
.burger i{position:absolute;left:12px;width:16px;height:1.5px;background:var(--ink);border-radius:2px;transition:transform .4s cubic-bezier(.7,0,.2,1),opacity .2s,top .4s}
.burger i:nth-child(1){top:15px}.burger i:nth-child(2){top:20px;width:10px}.burger i:nth-child(3){top:25px}
.burger.open i:nth-child(1){top:20px;transform:rotate(45deg)}
.burger.open i:nth-child(2){opacity:0;transform:translateX(6px)}
.burger.open i:nth-child(3){top:20px;transform:rotate(-45deg)}
.drawer{position:absolute;top:100%;left:0;width:100%;background:rgba(237,238,245,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;max-height:0;opacity:0;transition:max-height .5s cubic-bezier(.7,0,.2,1),opacity .35s;border-bottom:1px solid rgba(0,0,0,.05)}
.drawer.open{max-height:420px;opacity:1}
.drawer nav{display:flex;flex-direction:column;padding:12px 32px 28px}
.drawer a{font-family:var(--font-display);font-size:26px;letter-spacing:-.02em;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.06);color:var(--ink)}
.drawer a:last-child{border:0;margin-top:14px;background:var(--ink);color:#fff;border-radius:999px;padding:14px 22px;font-size:16px;text-align:center;font-family:var(--font-sans)}
@media(min-width:768px){.drawer{display:none}}

/* HERO */
.hero{position:relative;min-height:110vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;background:var(--color-bg-base)}
@media(min-width:640px){.hero{min-height:140vh}}
.video{position:absolute;top:15vh;left:0;width:100%;height:95vh;z-index:0;pointer-events:none;overflow:hidden}
@media(min-width:640px){.video{top:20vh;height:120vh}}
.video canvas{width:100%;height:100%;display:block}
.video .mask{position:absolute;top:0;left:0;width:100%;height:96px;background:linear-gradient(to bottom,var(--color-bg-base),transparent)}
@media(min-width:640px){.video .mask{height:128px}}
.content{max-width:80rem;width:100%;margin:0 auto;padding:0 32px;position:relative;z-index:10;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:16px;padding-top:150px}
@media(min-width:768px){.content{padding:170px 64px 0;column-gap:32px}}
@media(min-width:1024px){.content{padding-left:80px;padding-right:80px}}
.text{grid-column:1/span 12}
@media(min-width:768px){.text{grid-column:2/span 10}}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(32px,4.5vw,58px);line-height:1.04;letter-spacing:-.035em;color:var(--mute)}
h1 .k{color:var(--ink)}
h1 .ln{display:inline}
@media(max-width:700px){h1 .ln{display:none}}
.eye{display:inline-flex;align-items:center;justify-content:center;width:30px;height:.58em;border:2px solid var(--ink);border-radius:999px;vertical-align:.02em;margin:0 .06em;position:relative}
@media(min-width:768px){.eye{width:42px}}
@media(min-width:1024px){.eye{width:62px}}
.eye::before{content:"";width:8px;height:8px;border-radius:50%;background:#000;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform:translate(var(--dx,0),var(--dy,0))}
.fade{opacity:0;transform:translateY(15px);animation:up .8s cubic-bezier(.22,.8,.3,1) forwards}
.fade.d{animation-delay:.15s}
@keyframes up{to{opacity:1;transform:none}}
.search{margin-top:36px;display:flex;align-items:center;width:min(100%,400px);background:#fff;border-radius:6px;border:1px solid rgba(0,0,0,.05);padding:4px 4px 4px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .3s}
.search:focus-within{box-shadow:0 6px 24px -8px rgba(26,26,26,.25),0 0 0 2px rgba(159,255,0,.7)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:400 14px var(--font-sans);color:var(--ink);padding:9px 0}
.search input::placeholder{color:#9a9aa5}
.search button{flex:none;background:var(--ink);color:#fff;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;position:relative;transition:background .25s,color .25s}
.search button:hover{background:var(--color-brand-green);color:#000}
.search svg{position:absolute;inset:0;margin:auto;width:16px;height:16px}

.lang{position:absolute;right:20px;top:50%;z-index:10;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:12px;letter-spacing:.04em;color:var(--ink);background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 8px 28px -10px rgba(40,30,110,.35),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer;font-family:var(--font-sans)}
.lang b{font-weight:500}.lang .off{opacity:.45}
.lang .sep{width:14px;height:1px;background:currentColor;opacity:.5}
@media(min-width:768px){.lang{right:40px}}
.edge{position:absolute;bottom:28px;z-index:10;font-size:12px;letter-spacing:.02em;color:var(--ink)}
.edge.l{left:32px}.edge.r{right:32px}
@media(min-width:768px){.edge.l{left:64px}.edge.r{right:64px}}
@media(min-width:1024px){.edge.l{left:80px}.edge.r{right:80px}}
@media(prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="nav">
    <div class="nav-grid">
      <a class="brand" href="#">
        <svg viewBox="0 0 32 32" fill="#1a1a1a" aria-hidden="true">
          <circle cx="16" cy="8" r="6"/><circle cx="24" cy="16" r="6"/><circle cx="16" cy="24" r="6"/><circle cx="8" cy="16" r="6"/>
          <circle cx="16" cy="16" r="3" fill="#EDEEF5"/>
        </svg>
        <span>mėntality</span>
      </a>
      <nav class="links" aria-label="Main">
        <a href="#">service</a><a href="#">patient resources</a><a href="#">about us</a><a href="#">education center</a>
      </nav>
      <div class="right">
        <a class="find" href="#">find help</a>
        <a class="cta" href="#">get started <span>→</span></a>
        <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false"><i></i><i></i><i></i></button>
      </div>
    </div>
    <div class="drawer" id="drawer">
      <nav><a href="#">service</a><a href="#">patient resources</a><a href="#">about us</a><a href="#">education center</a><a href="#">get started →</a></nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="video" aria-hidden="true">
        <canvas id="cv"></canvas>
        <div class="mask"></div>
      </div>

      <div class="content">
        <div class="text">
          <h1 class="fade"><span class="k">Remix: Mentality offers</span> information<br class="ln"> and resources to help you manage<br class="ln"> your <span class="eye" id="eye" aria-hidden="true"></span> mental wellbeing.</h1>
          <div class="search fade d">
            <input type="text" placeholder="Ask me anything..." aria-label="Ask me anything">
            <button type="button" aria-label="Send"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
          </div>
        </div>
      </div>

      <button class="lang" id="lang" aria-label="Switch language"><b id="l1">pl</b><span class="sep"></span><b class="off" id="l2">en</b></button>
      <span class="edge l">2024</span>
      <span class="edge r">mental health tools</span>
    </section>
  </main>
</div>

<script>
const b=document.getElementById('burger'),d=document.getElementById('drawer');
b.onclick=()=>{const o=b.classList.toggle('open');d.classList.toggle('open',o);b.setAttribute('aria-expanded',o)};
document.getElementById('lang').onclick=()=>{document.getElementById('l1').classList.toggle('off');document.getElementById('l2').classList.toggle('off')};
const eye=document.getElementById('eye');
addEventListener('pointermove',e=>{const r=eye.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,a=Math.atan2(e.clientY-cy,e.clientX-cx),m=Math.min(1,Math.hypot(e.clientX-cx,e.clientY-cy)/300);
 const mx=(r.width/2-9)*m,my=(r.height/2-9)*m;eye.style.setProperty('--dx',Math.cos(a)*mx+'px');eye.style.setProperty('--dy',Math.sin(a)*my+'px')});

// "video" substitute: slow twisting silk ribbon drawn as fine contour lines
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,dpr;
function size(){dpr=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);
const N=72,STEPS=90;
const lerp=(a,b,t)=>a+(b-a)*t;
const stops=[[188,186,236],[120,112,214],[58,48,150],[159,255,0]];
function col(s,a){
  let f=Math.min(s,0.999)*2.2,i=Math.min(2,Math.floor(f)),t=Math.min(f-i,1);
  const c=[0,1,2].map(k=>lerp(stops[i][k],stops[i+1][k],t));
  return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
}
function pt(u,s,t,amp){
  const x=-W*.05+u*W*1.1;
  const cy=H*(.5+.12*Math.sin(u*3.1+t*1.3)+.06*Math.sin(u*7+t*.8));
  const phi=u*7.5-t*2.2+Math.sin(u*2+t)*1.2;
  const w=amp*(.55+.55*Math.sin(u*2.6+t*.9+1));
  return [x,cy+s*w*Math.cos(phi)+s*s*w*.18*Math.sin(phi*.5)];
}
function frame(ms){
  const t=ms/1000*0.22,amp=Math.min(W,H)*.2;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#EDEEF5');g.addColorStop(.35,'#dfe0f2');g.addColorStop(1,'#cfd0ea');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const gl=ctx.createRadialGradient(W*.78,H*.3,0,W*.78,H*.3,W*.45);
  gl.addColorStop(0,'rgba(190,255,90,.42)');gl.addColorStop(1,'rgba(190,255,90,0)');
  ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  ctx.lineWidth=1.1;
  for(let i=0;i<N;i++){
    const s=i/(N-1)*2-1;
    ctx.beginPath();
    for(let k=0;k<=STEPS;k++){const p=pt(k/STEPS,s,t,amp);k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}
    ctx.strokeStyle=col((s+1)/2,.55);ctx.stroke();
  }
  for(let j=0;j<3;j++){
    ctx.beginPath();
    for(let k=0;k<=STEPS;k++){const p=pt(k/STEPS,1.04+j*.05,t,amp);k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}
    ctx.strokeStyle=`rgba(159,255,0,${.9-j*.25})`;ctx.lineWidth=1.8-j*.4;ctx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
