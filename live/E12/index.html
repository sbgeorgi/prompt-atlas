<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Epoch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0}
:root{--font-sans:'Inter',system-ui,sans-serif;--font-display:'Outfit','Inter',system-ui,sans-serif;--navy:#0a1b33;--slate:#64748b}
html,body{background:#f9fafb}
body{font-family:var(--font-sans);color:var(--navy);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
.page{padding:16px 16px 56px}
@media(min-width:768px){.page{padding:32px 32px 72px}}
.hero{position:relative;width:100%;max-width:1400px;margin:0 auto;border-radius:48px;background:#fff;border:1px solid rgba(226,232,240,.5);box-shadow:0 40px 100px -20px rgba(0,0,0,.03);overflow:hidden;height:600px;display:flex;flex-direction:column}
.bg{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;user-select:none}
.bg canvas{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.05);transition:transform 1s}
.content{position:relative;z-index:20;flex:1;padding:48px 32px 0;display:flex;flex-direction:column;align-items:flex-start}
@media(min-width:768px){.content{padding:64px 64px 0}}
h1{font-family:var(--font-display);font-weight:500;font-size:42px;line-height:1.08;letter-spacing:-.03em;color:var(--navy)}
@media(max-width:420px){h1{font-size:36px}}
@media(min-width:768px){h1{font-size:56px}}
.sub{margin-top:20px;max-width:440px;font-size:14px;line-height:1.6;color:var(--slate)}
@media(min-width:768px){.sub{font-size:15px}}
.cta{margin-top:28px;background:#0a152d;color:#fff;border:0;border-radius:999px;padding:12px 26px;font:600 13px var(--font-sans);cursor:pointer;box-shadow:0 8px 20px rgba(10,21,45,.18)}
.navwrap{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:30}
nav{display:flex;align-items:center;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);padding:6px;border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.08);border:1px solid rgba(226,232,240,.4);white-space:nowrap}
.logo{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #f1f5f9;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--navy);margin-right:4px}
.nb{background:none;border:0;padding:8px 14px;font:600 12px var(--font-sans);color:#64748b;cursor:pointer;transition:color .2s}
.nb:hover{color:var(--navy)}
.git,.card{background:#fff;border:1px solid rgba(226,232,240,.6);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:all .2s}
.git{display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding:8px 14px 8px 20px;border-radius:999px;font:600 12px var(--font-sans);color:var(--navy);cursor:pointer}
.git:hover,.card:hover{border-color:#cbd5e1}
.git svg{width:14px;height:14px}
.marq{margin-top:40px;overflow:hidden;max-width:1400px;margin-inline:auto;-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;gap:16px;width:max-content;animation:scroll 32s linear infinite;padding:6px 0}
.marq:hover .track{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.card{position:relative;height:96px;width:160px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:999px;overflow:hidden}
.card .g{position:absolute;inset:0;opacity:0;transform:scale(1.5);transition:all .5s}
.card:hover .g{opacity:1;transform:scale(1)}
.card .im{position:relative;display:flex;align-items:center;gap:7px;transition:filter .3s;font:600 14px var(--font-sans);color:var(--navy)}
.card .im svg{width:26px;height:26px;flex-shrink:0}
.card:hover .im{filter:brightness(0) invert(1)}
@media(prefers-reduced-motion:reduce){.track{animation:none}.marq{overflow-x:auto;-webkit-mask-image:none;mask-image:none}.bg canvas{transition:none}}
</style>
</head>
<body>
<div class="page">
<section class="hero">
  <div class="bg" aria-hidden="true"><canvas id="cv"></canvas></div>
  <div class="content" id="txt">
    <h1>Foundation of the<br>new digital epoch</h1>
    <p class="sub">Designing products, powering ecosystems and laying the foundation of a decentralized web for enterprises, builders and communities alike.</p>
    <button class="cta" id="cta">Contact Us</button>
  </div>
  <div class="navwrap"><nav id="nav">
    <div class="logo">&#10022;</div>
    <button class="nb">Products</button><button class="nb">Docs</button>
    <button class="git">Get in touch <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </nav></div>
</section>
<div class="marq"><div class="track" id="track"></div></div>
</div>
<script>
// logos: inline stand-in marks (no third-party hotlinks)
var L=[
['Procure','#2563eb','linear-gradient(135deg,#60a5fa,#1d4ed8)','<rect x="3" y="3" width="18" height="18" rx="5" fill="#2563eb"/><path d="M8 17V7h5a3 3 0 010 6H8" fill="none" stroke="#fff" stroke-width="2.2"/>'],
['Shopify','#16a34a','linear-gradient(135deg,#fde68a,#f59e0b)','<path d="M5 8h14l-1.2 11H6.2z" fill="#95bf47"/><path d="M9 8a3 3 0 016 0" fill="none" stroke="#5e8e3e" stroke-width="2"/>'],
['Blender','#ea7600','linear-gradient(135deg,#93c5fd,#2563eb)','<circle cx="13" cy="13" r="8" fill="#ea7600"/><circle cx="13" cy="13" r="3.4" fill="#fff"/><circle cx="13" cy="13" r="1.6" fill="#265787"/>'],
['Figma','#a259ff','linear-gradient(135deg,#d8b4fe,#7c3aed)','<circle cx="16" cy="12" r="3.5" fill="#1abcfe"/><rect x="5" y="2" width="7" height="7" rx="3.5" fill="#f24e1e"/><rect x="12" y="2" width="7" height="7" rx="3.5" fill="#ff7262"/><rect x="5" y="9" width="7" height="7" rx="3.5" fill="#a259ff"/><rect x="5" y="16" width="7" height="7" rx="3.5" fill="#0acf83"/>'],
['Spotify','#1db954','linear-gradient(135deg,#f9a8d4,#ef4444)','<circle cx="13" cy="13" r="10" fill="#1db954"/><path d="M7 10c4-1.2 8-.8 12 1.2M8 13.6c3.4-1 6.6-.6 9.6 1M9 17c2.6-.7 5-.4 7.4.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>'],
['Lottielab','#0ea5a4','linear-gradient(135deg,#fde047,#4ade80)','<rect x="3" y="3" width="20" height="20" rx="6" fill="#111827"/><path d="M8 17c1-6 3-8 5-8s2 4 5 4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>'],
['Google Cloud','#4285f4','linear-gradient(135deg,#bae6fd,#38bdf8)','<path d="M8 19a5 5 0 01-.5-9.97A6 6 0 0119 11a4 4 0 01-1 8z" fill="#4285f4"/><path d="M8 19h10a4 4 0 001-8" fill="none" stroke="#ea4335" stroke-width="2"/>'],
['Bing','#0f766e','linear-gradient(135deg,#67e8f9,#0d9488)','<path d="M8 3l4 1.4v10l5-2.8-2.4-1.2L13 9 8 3z" fill="#00897b"/><path d="M8 20l9-5.2v-3L8 15z" fill="#26c6da"/>']
];
var h=L.map(function(l){return '<div class="card"><div class="g" style="background:'+l[2]+'"></div><div class="im"><svg viewBox="0 0 26 26">'+l[3]+'</svg><span>'+l[0]+'</span></div></div>'}).join('');
document.getElementById('track').innerHTML=h+h;

// entrance animation
var red=matchMedia('(prefers-reduced-motion:reduce)').matches;
function enter(el,delay){if(red)return;el.style.opacity=0;el.style.transform=(el.id==='nav'?'translateY(20px)':'translateY(24px)');
 el.style.transition='opacity .9s cubic-bezier(.2,.7,.2,1) '+delay+'s,transform .9s cubic-bezier(.2,.7,.2,1) '+delay+'s';
 requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.opacity=1;el.style.transform='none'})})}
enter(document.getElementById('txt'),.1);enter(document.getElementById('nav'),.7);
var c=document.getElementById('cta');
c.style.transition='transform .2s';c.onmouseenter=function(){c.style.transform='scale(1.05)'};c.onmouseleave=function(){c.style.transform='none'};c.onmousedown=function(){c.style.transform='scale(.97)'};c.onmouseup=function(){c.style.transform='scale(1.05)'};

// background stand-in for the looping video: soft luminous flowing ribbons
var cv=document.getElementById('cv'),x=cv.getContext('2d'),W,H,dpr=Math.min(devicePixelRatio||1,2);
function rs(){var r=cv.parentNode.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
rs();addEventListener('resize',function(){rs();draw(t)});
var t=0;
function draw(t){
 var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#f4f8ff');g.addColorStop(1,'#e6efff');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 var blobs=[[.82,.3,.34,'rgba(125,170,255,.40)'],[.6,.8,.3,'rgba(190,160,255,.30)'],[.95,.85,.28,'rgba(120,220,240,.30)']];
 blobs.forEach(function(b,i){var cx=W*(b[0]+.03*Math.sin(t*.5+i*2)),cy=H*(b[1]+.04*Math.cos(t*.4+i)),r=Math.max(W,H)*b[2];
  var rg=x.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,b[3]);rg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=rg;x.fillRect(0,0,W,H)});
 var n=26;x.lineWidth=1.2;
 for(var i=0;i<n;i++){
  var k=i/n;x.beginPath();
  for(var px=-10;px<=W+10;px+=10){
   var u=px/W,
   y=H*(.35+.5*k)+Math.sin(u*4+t*.6+k*4)*H*.09*(.4+u)+Math.sin(u*9-t*.4+k*7)*H*.025;
   if(px<0)x.moveTo(px,y);else x.lineTo(px,y)}
  x.strokeStyle='rgba('+(90+k*80|0)+','+(130+k*60|0)+',255,'+(.07+.16*k)*(1-.0)+')';x.stroke()}
}
draw(0);
if(!red){(function loop(ts){t=ts/1000;draw(t);requestAnimationFrame(loop)})(0)}
</script>
</body>
</html>
