<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0a09;color:#fff;font-family:'IBM Plex Mono',ui-monospace,monospace}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.blur{position:fixed;inset:0;z-index:1;pointer-events:none;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
 -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 45%);mask-image:linear-gradient(to top,#000 0%,transparent 45%)}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.page{position:relative;z-index:10;height:100vh;height:100dvh;display:flex;flex-direction:column}
.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;
 box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
 background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);
 -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.amp-line{height:1px;background:linear-gradient(90deg,transparent,rgba(232,132,61,.85),transparent);box-shadow:0 0 10px rgba(232,132,61,.35)}
@keyframes blurFadeUp{from{opacity:0;filter:blur(20px);transform:translateY(40px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
.bfu{opacity:0;animation:blurFadeUp 1s ease-out forwards}
@keyframes eq{0%{transform:scaleY(.3)}33%{transform:scaleY(1)}66%{transform:scaleY(.5)}100%{transform:scaleY(1)}}
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:14px}
.eq i{width:2px;height:100%;background:#e8843d;transform-origin:bottom;animation:eq 900ms ease-in-out infinite;display:block}
.eq i:nth-child(1){animation-delay:0ms}.eq i:nth-child(2){animation-delay:120ms}.eq i:nth-child(3){animation-delay:240ms}.eq i:nth-child(4){animation-delay:360ms}.eq i:nth-child(5){animation-delay:480ms}
nav{position:relative;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 16px}
.word{font-weight:500;letter-spacing:.3em;font-size:14px}
.links{display:none;gap:40px}
.links a{font-size:14px;color:rgba(255,255,255,.7);transition:color .2s;font-family:'IBM Plex Mono',monospace}
.links a:hover{color:#fff}
.right{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-size:14px}
.ico{width:40px;height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.ico svg,.pill svg,.btn svg{display:block}
.burger{position:relative}
.burger svg{position:absolute;transition:all .5s}
.burger .x{opacity:0;transform:rotate(-90deg) scale(.5)}
.burger.open .x{opacity:1;transform:none}
.burger.open .m{opacity:0;transform:rotate(90deg) scale(.5)}
.audio-d{display:none}
.mm{position:absolute;left:0;right:0;top:64px;z-index:40;background:rgba(11,10,9,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);box-shadow:0 25px 50px -12px rgba(0,0,0,.6);
 padding:12px 16px;transform:translateY(-16px);opacity:0;pointer-events:none;transition:all .5s ease-out}
.mm.open{transform:none;opacity:1;pointer-events:auto}
.mm a{display:block;padding:12px;border-radius:8px;font-size:14px;color:rgba(255,255,255,.8);transform:translateX(-16px);opacity:0;transition:all .5s ease-out,background .2s}
.mm.open a{transform:none;opacity:1}
.mm a:hover{background:rgba(255,255,255,.05)}
.mm .foot{display:flex;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.hero{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 32px;position:relative;z-index:10}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:24px;font-size:11px;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.22em}
.meta .g{display:inline-flex;align-items:center;gap:10px}
.meta .acc{color:#e8843d}
.amp{width:96px;margin-bottom:20px}
h1{font-family:'DM Serif Display',serif;font-weight:400;letter-spacing:-.01em;font-size:36px;line-height:1.02;margin-bottom:16px}
.sub{font-size:16px;color:rgba(255,255,255,.6);margin-bottom:24px;max-width:36rem}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 24px;font-size:14px;font-weight:500;width:100%}
.btn.solid{background:#fff;color:#000;transition:background .2s}
.btn.solid:hover{background:#e5e7eb}
@media(min-width:640px){
 nav{padding:16px 24px}.hero{padding:0 24px 32px}
 .audio-d{display:inline-flex}.mm .foot{display:none}
 h1{font-size:60px}.sub{font-size:18px}.meta{gap:24px}
 .btn{width:auto;padding:12px 32px}.ctas{gap:16px}
}
@media(min-width:768px){nav{padding:24px 48px}.hero{padding:0 48px 64px}.meta{margin-bottom:32px}h1{font-size:72px;margin-bottom:24px}.sub{margin-bottom:40px}.pill{padding:8px 24px}}
@media(min-width:1024px){.links{display:flex}.burger{display:none}.mm{display:none}h1{font-size:96px}}
@media(prefers-reduced-motion:reduce){
 .bfu{animation:none;opacity:1;filter:none;transform:none}
 .eq i{animation:none;transform:scaleY(.7)}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="blur"></div>
<div class="grain"></div>

<div class="page">
 <nav>
  <span class="word bfu" style="animation-delay:0ms">SONOR</span>
  <div class="links">
   <a class="bfu" href="#" style="animation-delay:100ms">Monitors</a>
   <a class="bfu" href="#" style="animation-delay:150ms">The Lab</a>
   <a class="bfu" href="#" style="animation-delay:200ms">Sessions</a>
   <a class="bfu" href="#" style="animation-delay:250ms">Journal</a>
  </div>
  <div class="right">
   <a class="pill liquid-glass bfu" href="#" style="animation-delay:300ms">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#e8843d" stroke="#e8843d" stroke-width="2" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>Listen</a>
   <a class="ico liquid-glass bfu audio-d" href="#" aria-label="Audio" style="animation-delay:350ms">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg></a>
   <button class="ico liquid-glass burger bfu" id="bg-btn" aria-label="Menu" style="animation-delay:300ms">
    <svg class="m" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <svg class="x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
   </button>
  </div>
 </nav>
 <div class="mm" id="mm">
  <a href="#" style="transition-delay:0ms">Monitors</a>
  <a href="#" style="transition-delay:50ms">The Lab</a>
  <a href="#" style="transition-delay:100ms">Sessions</a>
  <a href="#" style="transition-delay:150ms">Journal</a>
  <div class="foot">
   <a class="pill liquid-glass" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="#e8843d" stroke="#e8843d" stroke-width="2" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>Listen</a>
   <a class="ico liquid-glass" href="#" aria-label="Audio"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg></a>
  </div>
 </div>

 <main class="hero">
  <div class="meta bfu" style="animation-delay:300ms">
   <span class="g"><span class="eq"><i></i><i></i><i></i><i></i><i></i></span>Live room</span>
   <span class="g"><span>&middot;</span>24-bit / 96 kHz</span>
   <span class="g"><span>&middot;</span><span class="acc">Free pack</span></span>
  </div>
  <div class="amp amp-line bfu" style="animation-delay:350ms"></div>
  <h1 class="bfu" style="animation-delay:400ms">Hear it before<br>you build it.</h1>
  <p class="sub bfu" style="animation-delay:500ms">A studio where the sound is the product.</p>
  <div class="ctas">
   <a class="btn solid bfu" href="#" style="animation-delay:600ms"><svg width="18" height="18" viewBox="0 0 24 24" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>Play the room</a>
   <a class="btn liquid-glass bfu" href="#" style="animation-delay:700ms"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e8843d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Free download</a>
  </div>
 </main>
</div>

<script>
(function(){
var btn=document.getElementById('bg-btn'),mm=document.getElementById('mm');
btn.addEventListener('click',function(){btn.classList.toggle('open');mm.classList.toggle('open')});

/* Stand-in for the speaker + waveform loop: canvas studio monitor, copper voice coil, rippling air waves */
var cv=document.getElementById('bg'),c=cv.getContext('2d');
var W,H,dpr,still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',function(){size();draw(last)});
var last=0;
function draw(t){
 t=t/1000;last=t*1000;
 c.fillStyle='#050403';c.fillRect(0,0,W,H);
 var cx=W>=1024?W*.62:W*.5, cy=H*(W>=1024?.42:.32), R=Math.min(W*(W>=1024?.3:.36),H*.3);
 var beat=still?0:Math.pow(Math.max(0,Math.sin(t*5.2)),6)*.5+Math.sin(t*2.1)*.12;
 /* ambient amber glow */
 var g=c.createRadialGradient(cx,cy,R*.2,cx,cy,R*2.6);
 g.addColorStop(0,'rgba(232,132,61,'+(.16+beat*.06)+')');g.addColorStop(1,'rgba(232,132,61,0)');
 c.fillStyle=g;c.fillRect(0,0,W,H);
 /* waveforms rippling through the air */
 c.lineWidth=1;
 for(var i=0;i<9;i++){
  var p=still?(i/9):((t*.12+i/9)%1);
  var r=R*(1.05+p*2.4);
  c.strokeStyle='rgba(232,132,61,'+(.38*(1-p)*(1-p))+')';
  c.beginPath();
  for(var a=0;a<=96;a++){var th=a/96*Math.PI*2;
   var rr=r+Math.sin(th*14+t*(still?0:3)-i)*R*.012*(1-p);
   var x=cx+Math.cos(th)*rr,y=cy+Math.sin(th)*rr;a?c.lineTo(x,y):c.moveTo(x,y)}
  c.stroke();
 }
 /* cabinet */
 var bw=R*1.75;
 var cab=c.createLinearGradient(cx-bw,0,cx+bw,0);
 cab.addColorStop(0,'#0c0b0a');cab.addColorStop(.5,'#1b1917');cab.addColorStop(1,'#0a0908');
 c.fillStyle=cab;rr2(cx-bw,cy-R*1.5,bw*2,R*3.4,R*.18);c.fill();
 c.strokeStyle='rgba(255,255,255,.06)';c.lineWidth=1.5;c.stroke();
 /* screws */
 [[-1,-1],[1,-1]].forEach(function(s){var sx=cx+s[0]*R*1.38,sy=cy-R*1.28;
  var sg=c.createRadialGradient(sx-2,sy-2,1,sx,sy,R*.06);sg.addColorStop(0,'#777');sg.addColorStop(1,'#111');
  c.fillStyle=sg;c.beginPath();c.arc(sx,sy,R*.06,0,7);c.fill();});
 /* surround ring */
 var rg=c.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.28);
 rg.addColorStop(0,'#000');rg.addColorStop(.6,'#1c1a18');rg.addColorStop(1,'#050505');
 c.fillStyle=rg;c.beginPath();c.arc(cx,cy,R*1.28,0,7);c.fill();
 c.strokeStyle='rgba(255,255,255,.10)';c.lineWidth=1.5;c.beginPath();c.arc(cx,cy,R*1.27,0,7);c.stroke();
 /* cone / coil face with breathing excursion */
 var ex=1+beat*.025;
 c.save();c.translate(cx,cy);c.scale(ex,ex);
 var face=c.createRadialGradient(0,0,R*.1,0,0,R);
 face.addColorStop(0,'#2a1608');face.addColorStop(1,'#0a0705');
 c.fillStyle=face;c.beginPath();c.arc(0,0,R,0,7);c.fill();
 /* copper concentric windings, light sweeps like a conic reflection */
 var n=22;
 for(var k=0;k<n;k++){
  var rad=R*(.30+.68*k/(n-1));
  var cg=c.createConicGradient(t*(still?0:.25)+k*.12,0,0);
  cg.addColorStop(0,'#d98a52');cg.addColorStop(.18,'#4a230f');cg.addColorStop(.38,'#b9672f');
  cg.addColorStop(.55,'#2a1308');cg.addColorStop(.78,'#e6a06a');cg.addColorStop(1,'#d98a52');
  c.strokeStyle=cg;c.lineWidth=R*.020;
  c.beginPath();c.arc(0,0,rad,0,7);c.stroke();
  c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=R*.006;
  c.beginPath();c.arc(0,0,rad+R*.014,0,7);c.stroke();
 }
 /* dust cap */
 var dc=c.createRadialGradient(-R*.04,-R*.05,R*.01,0,0,R*.28);
 dc.addColorStop(0,'#6a6a6a');dc.addColorStop(.35,'#222');dc.addColorStop(1,'#050505');
 c.fillStyle=dc;c.beginPath();c.arc(0,0,R*.28,0,7);c.fill();
 c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1.5;c.beginPath();c.arc(0,0,R*.27,0,7);c.stroke();
 var dc2=c.createRadialGradient(0,0,0,0,0,R*.12);
 dc2.addColorStop(0,'#000');dc2.addColorStop(1,'#1a1a1a');
 c.fillStyle=dc2;c.beginPath();c.arc(0,0,R*.12,0,7);c.fill();
 c.restore();
 /* bottom fade into page colour */
 var fg=c.createLinearGradient(0,H*.5,0,H);fg.addColorStop(0,'rgba(11,10,9,0)');fg.addColorStop(1,'rgba(11,10,9,.55)');
 c.fillStyle=fg;c.fillRect(0,H*.5,W,H*.5);
}
function rr2(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function loop(ms){draw(ms);requestAnimationFrame(loop)}
if(still)draw(0);else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
