<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeuralKinetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:#000;font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.page{position:relative;min-height:100vh;min-height:100svh;background:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px;pointer-events:none}
nav>*{pointer-events:auto}
.left,.right{display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.brand{display:none;font-weight:600;font-size:15px;letter-spacing:-0.02em}
.menu{display:flex;align-items:center;gap:8px;background:#000;color:#fff;border-radius:999px;padding:4px 14px 4px 4px;font-size:11px;font-weight:500}
.menu .c{width:28px;height:28px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.pill{display:none;align-items:center;background:#F4F4F6;border-radius:999px;font-size:11px;font-weight:500;color:rgba(0,0,0,.75)}
.tags span{padding:10px 16px;white-space:nowrap}
.tags span+span{padding-left:4px}
.rpill{padding:4px 16px 4px 4px;gap:8px}
.rpill .c{width:28px;height:28px;border-radius:50%;background:#000;display:grid;place-items:center}

/* video stand-in */
.vid{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center}
.vwrap{width:80%;height:80%;position:relative}
canvas{width:100%;height:100%;display:block}

/* footer */
.foot{position:relative;z-index:30;padding:80px 16px 24px;display:flex;flex-direction:column;gap:20px;background:linear-gradient(to top,#fff 0%,rgba(255,255,255,.8) 50%,transparent 100%)}
.sub{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(0,0,0,.55);margin-bottom:14px}
.sub i{width:8px;height:8px;border-radius:50%;background:#000;display:block}
h1{font-weight:300;font-size:clamp(2rem,8vw,4.5rem);letter-spacing:-.03em;line-height:1;margin-bottom:22px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:999px;font-size:13px;font-weight:500;padding:12px 22px;transition:transform .25s,background .25s}
.btn.dark{background:#000;color:#fff}
.btn.ghost{border:1px solid rgba(0,0,0,.35)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost:hover{background:rgba(0,0,0,.05)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:999px;font-size:11px;padding:8px 14px}

/* entrance */
@keyframes up{from{opacity:0;transform:translateY(var(--y,16px))}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes vin{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
:root{--e:cubic-bezier(.16,1,.3,1)}
nav{animation:down .8s var(--e) both}
.vid{animation:vin 1.8s var(--e) both}
.foot{--y:20px;animation:up 1s var(--e) .5s both}
.sub{animation:up .8s var(--e) .6s both}
h1{--y:20px;animation:up .8s var(--e) .8s both}
.btns{animation:up .8s var(--e) 1s both}
.sub,h1,.btns{will-change:transform}
.foot{background-clip:border-box}

@media(min-width:768px){
 nav{padding:24px 32px}
 .left,.right{gap:10px}
 .brand{display:block}
 .pill{display:flex}
 .menu .c{width:32px;height:32px}
 .rpill .c{width:32px;height:32px}
 .vwrap{width:100%;height:100%}
 .foot{flex-direction:row;align-items:flex-end;justify-content:space-between;padding:120px 32px 32px}
 h1{font-size:clamp(2.5rem,5.5vw,4.5rem)}
 .chips{justify-content:flex-end;padding-bottom:6px}
}
@media(prefers-reduced-motion:reduce){
 nav,.vid,.foot,.sub,h1,.btns{animation:none}
 .btn{transition:none}
}
</style>
</head>
<body>
<main class="page">
  <nav>
    <div class="left">
      <div class="logo">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(-35 16 16)"><rect x="2" y="6" width="19" height="9" rx="4.5" fill="#000"/><rect x="11" y="17" width="19" height="9" rx="4.5" fill="#000"/></g></svg>
        <span class="brand">NeuralKinetics</span>
      </div>
      <button class="menu" aria-label="Menu"><span class="c"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Menu</button>
      <div class="pill tags"><span>Advanced Bionics</span><span>Cognitive AI</span></div>
    </div>
    <div class="right">
      <div class="pill rpill"><span class="c"><svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><circle cx="4" cy="4" r="1.7"/><circle cx="10" cy="4" r="1.7"/><circle cx="4" cy="10" r="1.7"/><circle cx="10" cy="10" r="1.7"/></svg></span>Adaptive Systems</div>
    </div>
  </nav>

  <div class="vid"><div class="vwrap"><canvas id="c" aria-hidden="true"></canvas></div></div>

  <div></div>

  <section class="foot">
    <div>
      <div class="sub"><i></i>Best digital banking card 2026</div>
      <h1>One Card, Zero<br>Limits. Worldwide.</h1>
      <div class="btns"><button class="btn dark">See Features</button><button class="btn ghost">How It Works</button></div>
    </div>
    <div class="chips"><span>Neuromorphic</span><span>AGI</span><span>Cybernetics</span></div>
  </section>
</main>

<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W,H,dpr;
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  // points on sphere (fibonacci) + inner shell
  var P=[],N=260;
  for(var i=0;i<N;i++){var y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),t=i*2.399963;P.push([Math.cos(t)*r,y,Math.sin(t)*r,1])}
  for(var j=0;j<90;j++){var y2=1-2*(j+.5)/90,r2=Math.sqrt(1-y2*y2),t2=j*2.399963+1;P.push([Math.cos(t2)*r2*.55,y2*.55,Math.sin(t2)*r2*.55,.55])}
  var rr=function(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()};
  function frame(ms){
    var t=ms/1000;ctx.clearRect(0,0,W,H);
    var cx=W*.5,cy=H*.44,R=Math.min(W,H)*.3;
    // soft floor shadow
    var g=ctx.createRadialGradient(0,0,0,0,0,R*1.3);g.addColorStop(0,'rgba(0,0,0,.12)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save();ctx.translate(cx,cy+R*1.55);ctx.scale(1,.22);ctx.fillStyle=g;ctx.fillRect(-R*1.4,-R*1.4,R*2.8,R*2.8);ctx.restore();
    var ay=t*.35,ax=.35+Math.sin(t*.3)*.1,ca=Math.cos(ay),sa=Math.sin(ay),cb=Math.cos(ax),sb=Math.sin(ax);
    var pr=P.map(function(p){var x=p[0]*ca+p[2]*sa,z=-p[0]*sa+p[2]*ca,y=p[1]*cb-z*sb;z=p[1]*sb+z*cb;var s=1/(1.8-z*.5);return[cx+x*R*s*1.8,cy+y*R*s*1.8,z,p[3],s]});
    // edges
    ctx.lineWidth=.7;
    for(var a=0;a<pr.length;a++){for(var b=a+1;b<pr.length;b++){var dx=pr[a][0]-pr[b][0],dy=pr[a][1]-pr[b][1],d=dx*dx+dy*dy,m=R*R*.035;if(d<m){var al=(1-d/m)*.35*(0.4+(pr[a][2]+1)*.3);ctx.strokeStyle='rgba(0,0,0,'+al.toFixed(3)+')';ctx.beginPath();ctx.moveTo(pr[a][0],pr[a][1]);ctx.lineTo(pr[b][0],pr[b][1]);ctx.stroke()}}}
    // nodes
    pr.sort(function(a,b){return a[2]-b[2]});
    pr.forEach(function(p){var k=(p[2]+1)/2,rad=(1+k*1.8)*(p[3]<1?.8:1);ctx.fillStyle='rgba(0,0,0,'+(.25+k*.7).toFixed(2)+')';ctx.beginPath();ctx.arc(p[0],p[1],rad,0,6.283);ctx.fill()});
    // orbit rings
    ctx.lineWidth=1;
    for(var k2=0;k2<3;k2++){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.15*(k2+1)*(k2%2?-1:1)+k2);ctx.scale(1,.28+k2*.08);ctx.strokeStyle='rgba(0,0,0,'+(.18-k2*.04)+')';ctx.beginPath();ctx.arc(0,0,R*(1.25+k2*.22),0,6.283);ctx.stroke();
      var ang=t*(.8-k2*.2)+k2*2;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(Math.cos(ang)*R*(1.25+k2*.22),Math.sin(ang)*R*(1.25+k2*.22),3.5,0,6.283);ctx.fill();ctx.restore()}
    // floating card
    var cw=Math.min(W*.34,300),ch=cw*.63,fy=Math.sin(t*.9)*8,tilt=Math.sin(t*.6)*.06;
    ctx.save();ctx.translate(cx,cy+fy);ctx.rotate(-.12+tilt);
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=40;ctx.shadowOffsetY=24;
    var cg=ctx.createLinearGradient(-cw/2,-ch/2,cw/2,ch/2);cg.addColorStop(0,'#2a2a2e');cg.addColorStop(.5,'#0b0b0d');cg.addColorStop(1,'#1c1c20');
    ctx.fillStyle=cg;rr(-cw/2,-ch/2,cw,ch,cw*.055);ctx.fill();ctx.shadowColor='transparent';
    // sheen sweep
    ctx.save();rr(-cw/2,-ch/2,cw,ch,cw*.055);ctx.clip();
    var sx=((t*.25)%1.6-.3)*cw*1.6-cw*.9;var sg=ctx.createLinearGradient(sx,-ch/2,sx+cw*.4,ch/2);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.16)');sg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sg;ctx.fillRect(-cw/2,-ch/2,cw,ch);ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;rr(-cw/2,-ch/2,cw,ch,cw*.055);ctx.stroke();
    // logo + chip
    var u=cw/300;ctx.save();ctx.translate(-cw/2+30*u,-ch/2+34*u);ctx.rotate(-.61);ctx.fillStyle='#fff';rr(-10*u,-9*u,24*u,11*u,5.5*u);ctx.fill();rr(-2*u,3*u,24*u,11*u,5.5*u);ctx.fill();ctx.restore();
    var chg=ctx.createLinearGradient(0,0,1,1);ctx.fillStyle='#bdbdc2';rr(-cw/2+24*u,-4*u,42*u,32*u,6*u);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-cw/2+24*u,12*u);ctx.lineTo(-cw/2+66*u,12*u);ctx.moveTo(-cw/2+45*u,-4*u);ctx.lineTo(-cw/2+45*u,28*u);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='500 '+(15*u)+'px Inter,system-ui,sans-serif';ctx.textBaseline='alphabetic';ctx.fillText('4821  ••••  ••••  0026',-cw/2+24*u,ch/2-38*u);
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='400 '+(10*u)+'px Inter,system-ui,sans-serif';ctx.fillText('NEURALKINETICS  ·  ZERO LIMITS',-cw/2+24*u,ch/2-18*u);
    ctx.restore();
    if(!reduce)requestAnimationFrame(frame);
  }
  if(reduce)frame(4000);else requestAnimationFrame(frame);
  if(reduce)addEventListener('resize',function(){frame(4000)});
})();
</script>
</body>
</html>
