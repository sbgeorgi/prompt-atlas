<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROVE - AI Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4ede1;--paper2:#efe5d5;--ink:#2b241d;--soft:#6f6357;--acc:#b5763f;--hair:rgba(43,36,29,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.wash{position:fixed;inset:0;pointer-events:none;z-index:0;background:
 radial-gradient(ellipse 60% 45% at 50% 0%,rgba(181,118,63,.10),transparent 70%),
 radial-gradient(ellipse 45% 40% at 88% 0%,rgba(181,118,63,.06),transparent 70%)}
.backdrop{position:fixed;left:0;right:0;bottom:0;height:55vh;overflow:hidden;pointer-events:none;z-index:0}
.backdrop svg{position:absolute;inset:0;width:100%;height:100%;transform-origin:center 68%;animation:kb 22s ease-in-out infinite alternate;will-change:transform}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#f4ede1 0%,rgba(244,237,225,.88) 16%,rgba(244,237,225,.38) 36%,rgba(244,237,225,0) 60%,rgba(244,237,225,.12) 100%)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.page{position:relative;z-index:2;display:flex;flex-direction:column;height:100vh;height:100svh;padding:26px clamp(20px,4vw,54px) 0;overflow:hidden}
nav{display:flex;align-items:center;gap:clamp(14px,2.4vw,34px);z-index:3}
.brand{display:flex;align-items:center;gap:9px;font:700 18px 'Space Grotesk',sans-serif;letter-spacing:.06em;color:var(--ink);text-decoration:none;margin-right:auto}
.brand svg{width:18px;height:18px;color:var(--acc)}
nav a{color:var(--soft);text-decoration:none;font-size:13.5px;font-weight:500;transition:color .2s}
nav a:hover{color:var(--ink)}
nav a.login{color:var(--ink);font-weight:500;margin-left:6px}
nav a.login:hover{opacity:.6}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;text-decoration:none;transition:transform .2s,box-shadow .2s}
nav a.pill{color:var(--paper)}
.pill:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(43,36,29,.5)}
.pill svg{width:12px;height:12px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:8vh;z-index:3;min-height:0}
.kicker{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);display:flex;align-items:center;gap:12px;margin-bottom:clamp(14px,2.6vh,26px)}
.kicker i{width:28px;height:1px;background:var(--acc)}
h1{font:600 clamp(40px,7.2vw,92px)/1 'Space Grotesk',sans-serif;letter-spacing:-.035em;margin-bottom:clamp(14px,2.6vh,24px)}
h1 em{font-style:normal;color:var(--acc)}
.sub{color:var(--soft);font-size:18.5px;line-height:1.5;max-width:560px;margin-bottom:clamp(20px,4vh,38px)}
.box{width:min(700px,92vw);display:flex;align-items:center;gap:14px;padding:14px 14px 14px 22px;border-radius:22px;background:rgba(255,251,244,.62);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 60px -28px rgba(43,36,29,.42)}
.field{flex:1;min-width:0;text-align:left;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;color:var(--ink)}
.field span{overflow:hidden;text-overflow:ellipsis}
.field span.empty{color:var(--soft)}
.caret{flex:none;width:2px;height:19px;background:var(--acc);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.up{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--hair);background:transparent;color:var(--soft);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.up:hover{background:rgba(43,36,29,.06);border-color:rgba(43,36,29,.3)}
.up svg{width:18px;height:18px}
.go{flex:none;display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;background:var(--ink);color:var(--paper);border-radius:14px;height:42px;padding:0 20px;font:500 14.5px Inter,sans-serif;transition:transform .2s,box-shadow .2s}
.go:hover{transform:translateY(-1px);box-shadow:0 10px 20px -10px rgba(43,36,29,.6)}
.go svg{width:14px;height:14px;transition:transform .2s}
.go:hover svg{transform:translateX(3px)}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--soft);background:rgba(255,251,244,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--hair);cursor:pointer;transition:color .2s}
.chip:hover{color:var(--ink)}
.chip b{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.fr{opacity:0;animation:fadeRise .95s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes fadeRise{from{opacity:0;filter:blur(12px);transform:translateY(26px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@media(max-width:1120px){h1{font-size:clamp(40px,7vw,72px)}nav{gap:16px}}
@media(max-width:720px){nav .nl{display:none}.sub{font-size:16px}.box{padding:10px 10px 10px 16px;gap:8px}.field{font-size:15px}.go{padding:0 14px}.go .t{display:none}.go{width:42px;padding:0;justify-content:center}.chips{gap:8px}.chip{font-size:11.5px;padding:6px 11px}}
@media(max-width:420px){.chip:nth-child(3){display:none}}
@media(max-height:620px){.sub{display:none}.chips{display:none}}
@media(prefers-reduced-motion:reduce){.fr{animation:none;opacity:1}.backdrop svg{animation:none;transform:scale(1.03)}.caret{animation:none}}
</style>
</head>
<body>
<div class="wash"></div>
<div class="backdrop" aria-hidden="true">
<svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4ede1"/><stop offset="1" stop-color="#f1dcc3"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f3b98a"/><stop offset=".7" stop-color="#eba477"/><stop offset="1" stop-color="#eba477" stop-opacity="0"/></radialGradient>
<linearGradient id="m1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8895f"/><stop offset="1" stop-color="#b9593d"/></linearGradient>
<linearGradient id="m2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2a07a"/><stop offset="1" stop-color="#c4694a"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4bf9a"/><stop offset="1" stop-color="#8fa57a"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3b585"/><stop offset="1" stop-color="#6f8c64"/></linearGradient>
<filter id="paint" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .08 0"/></filter>
<g id="pine"><path d="M0 -120 L26 -62 L12 -62 L34 -22 L14 -22 L38 20 L-38 20 L-14 -22 L-34 -22 L-12 -62 L-26 -62Z" fill="#6d8a5e"/><path d="M0 -120 L26 -62 L12 -62 L34 -22 L14 -22 L38 20 L10 20 L8 -60Z" fill="#587650" opacity=".7"/><rect x="-4" y="20" width="8" height="22" fill="#7a5a3c"/></g>
</defs>
<rect width="1600" height="600" fill="url(#sky)"/>
<circle cx="800" cy="350" r="105" fill="url(#sun)" opacity=".9"/>
<g>
<path d="M0 260 L120 190 L260 250 L360 200 L470 270 L600 330 L600 600 L0 600Z" fill="#cf9a73" opacity=".7"/>
<path d="M1000 330 L1150 240 L1280 290 L1420 215 L1600 300 L1600 600 L1000 600Z" fill="#cf9a73" opacity=".75"/>
<path d="M-40 400 C300 380 500 380 600 360 C700 330 750 335 800 350 C860 330 950 330 1050 360 C1200 390 1400 380 1660 400 L1660 620 L-40 620Z" fill="#e0bf9f"/>
<path d="M-40 290 C80 230 200 210 300 250 C420 300 500 380 620 420 L620 620 L-40 620Z" fill="url(#m1)"/>
<path d="M-40 290 C80 230 200 210 300 250 C260 330 200 400 120 460 L-40 480Z" fill="#a24a34" opacity=".35"/>
<path d="M1050 420 C1180 350 1300 290 1420 270 C1500 258 1560 270 1660 300 L1660 620 L1050 620Z" fill="url(#m2)"/>
<path d="M1420 270 C1500 258 1560 270 1660 300 L1660 400 C1560 340 1480 320 1420 270Z" fill="#a24a34" opacity=".25"/>
<path d="M-40 430 C200 380 420 400 640 410 C860 420 1060 390 1260 400 C1420 408 1540 390 1660 400 L1660 620 L-40 620Z" fill="#c9cfae"/>
<path d="M-40 470 C150 400 350 420 560 470 C760 510 900 450 1100 470 C1300 490 1500 440 1660 460 L1660 620 L-40 620Z" fill="url(#g1)"/>
<path d="M250 620 C330 545 480 505 700 505 C940 505 1060 535 1180 620Z" fill="#e9d6b4" opacity=".85"/>
<path d="M-40 540 C200 490 380 520 560 560 C760 600 1000 560 1200 540 C1400 520 1500 540 1660 520 L1660 620 L-40 620Z" fill="url(#g2)"/>
<path d="M700 610 C760 560 820 540 880 515 C930 497 960 490 990 488" stroke="#f0dcb8" stroke-width="14" fill="none" stroke-linecap="round" opacity=".85"/>
</g>
<use href="#pine" transform="translate(480 520) scale(.7)"/>
<use href="#pine" transform="translate(560 540) scale(.5)" opacity=".9"/>
<use href="#pine" transform="translate(1090 555) scale(.95)"/>
<use href="#pine" transform="translate(1180 570) scale(.65)"/>
<use href="#pine" transform="translate(1360 540) scale(.8)"/>
<use href="#pine" transform="translate(110 570) scale(.55)" opacity=".9"/>
<rect width="1600" height="600" filter="url(#grain)"/>
</svg>
</div>

<div class="page">
<nav>
<a class="brand fr" href="#" style="--d:0ms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor" stroke="none"/></svg>ROVE</a>
<a class="nl fr" href="#" style="--d:60ms">Discover</a>
<a class="nl fr" href="#" style="--d:110ms">Pricing</a>
<a class="nl fr" href="#" style="--d:160ms">FAQs</a>
<a class="login fr" href="#" style="--d:200ms">Login</a>
<a class="pill fr" href="#" style="--d:250ms">Plan my trip <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
</nav>

<main class="hero">
<div class="kicker fr" style="--d:260ms"><i></i>AI Trip Planner<i></i></div>
<h1 class="fr" style="--d:340ms">Where should we<br>take <em>you?</em></h1>
<p class="sub fr" style="--d:440ms">Tell Rove where you're headed and what you love — get a trip built just for you.</p>
<div class="box fr" style="--d:540ms">
<div class="field"><span id="tw" class="empty"></span><i class="caret"></i></div>
<button class="up" aria-label="Attach file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l8-8"/></svg></button>
<button class="go"><span class="t">Plan my trip</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
</div>
<div class="chips fr" style="--d:640ms"><span class="chip"><b></b>Weekend escapes</span><span class="chip"><b></b>Food &amp; wine trails</span><span class="chip"><b></b>Off the map</span></div>
</main>
</div>

<script>
(function(){
var P=["A 5-day food tour of Tokyo, no crowds…","A quiet week in the Dolomites, great hikes…","Two weeks island-hopping Greece on a budget…"];
var el=document.getElementById('tw');
function set(s){el.textContent=s;el.classList.toggle('empty',!s)}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){set(P[0]);return}
var i=0,n=0;
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
(async function loop(){
await wait(700);
for(;;){
var p=P[i];
for(n=1;n<=p.length;n++){set(p.slice(0,n));await wait(42+Math.random()*30)}
await wait(1900);
for(n=p.length-1;n>=0;n--){set(p.slice(0,n));await wait(22)}
await wait(300);
i=(i+1)%P.length;
}
})();
})();
</script>
</body>
</html>
