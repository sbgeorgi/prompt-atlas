<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velorah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font-display:'Instrument Serif',serif;
  --font-body:'Inter',sans-serif;
  --background:201 100% 13%;
  --foreground:0 0% 100%;
  --muted-foreground:240 4% 66%;
  --primary:0 0% 100%;--primary-foreground:0 0% 4%;
  --secondary:0 0% 10%;--muted:0 0% 10%;--accent:0 0% 10%;
  --border:0 0% 18%;--input:0 0% 18%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);background:hsl(var(--background));color:hsl(var(--foreground));overflow-x:hidden;-webkit-font-smoothing:antialiased}
.text-foreground{color:hsl(var(--foreground))}
.text-muted{color:hsl(var(--muted-foreground))}
.page{position:relative;min-height:100vh;min-height:100svh;width:100%;overflow:hidden;display:flex;flex-direction:column}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:block;
  background:radial-gradient(120% 80% at 50% 105%,#3f7f93 0%,#0d4a63 30%,#00344b 60%,#002133 100%)}
nav{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:24px 32px;max-width:80rem;margin:0 auto;width:100%}
.logo{font-family:var(--font-display);font-size:1.875rem;letter-spacing:-.025em;line-height:1;color:hsl(var(--foreground))}
.logo sup{font-size:.75rem}
.links{display:none;gap:32px;list-style:none}
.links a{font-size:.875rem;color:hsl(var(--muted-foreground));text-decoration:none;transition:color .2s}
.links a:hover,.links a.active{color:hsl(var(--foreground))}
@media(min-width:768px){.links{display:flex}}
.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden;font-family:var(--font-body);color:hsl(var(--foreground));cursor:pointer;transition:transform .3s ease}
.liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.liquid-glass:hover{transform:scale(1.03)}
.btn-nav{border-radius:9999px;padding:10px 24px;font-size:.875rem}
.btn-hero{border-radius:9999px;padding:20px 56px;font-size:1rem;margin-top:48px}
main{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 24px 160px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:3rem;line-height:.95;letter-spacing:-2.46px;max-width:80rem}
h1 em{font-style:normal;color:hsl(var(--muted-foreground))}
@media(min-width:640px){h1{font-size:4.5rem}}
@media(min-width:768px){h1{font-size:6rem}}
.sub{color:hsl(var(--muted-foreground));font-size:1rem;max-width:42rem;margin-top:32px;line-height:1.625}
@media(min-width:640px){.sub{font-size:1.125rem}}
@keyframes fade-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-rise{animation:fade-rise .8s ease-out both}
.animate-fade-rise-delay{animation:fade-rise .8s ease-out .2s both}
.animate-fade-rise-delay-2{animation:fade-rise .8s ease-out .4s both}
@media(prefers-reduced-motion:reduce){.animate-fade-rise,.animate-fade-rise-delay,.animate-fade-rise-delay-2{animation:none}.liquid-glass{transition:none}}
</style>
</head>
<body>
<div class="page">
  <canvas class="bg" id="bg" aria-hidden="true"></canvas>
  <nav>
    <div class="logo">Velorah<sup>®</sup></div>
    <ul class="links">
      <li><a href="#" class="active">Home</a></li>
      <li><a href="#">Studio</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Journal</a></li>
      <li><a href="#">Reach Us</a></li>
    </ul>
    <button class="liquid-glass btn-nav">Begin Journey</button>
  </nav>
  <main>
    <h1 class="animate-fade-rise">Where <em>dreams</em> rise <em>through the silence.</em></h1>
    <p class="sub animate-fade-rise-delay">We're designing tools for deep thinkers, bold creators, and quiet rebels. Amid the chaos, we build digital spaces for sharp focus and inspired work.</p>
    <button class="liquid-glass btn-hero animate-fade-rise-delay-2">Begin Journey</button>
  </main>
</div>
<script>
(function(){
  // Stand-in for the looping background video: slow drifting clouds lit by a rising glow, WebGL.
  var c=document.getElementById('bg');
  var gl=c.getContext('webgl',{antialias:false,alpha:false});
  if(!gl)return;
  var vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs='precision mediump float;uniform vec2 r;uniform float t;'+
  'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
  'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}'+
  'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}'+
  'void main(){vec2 uv=gl_FragCoord.xy/r;vec2 q=(gl_FragCoord.xy-.5*r)/r.y;'+
  'vec3 deep=vec3(0.,.13,.2);vec3 mid=vec3(.05,.30,.40);vec3 glow=vec3(.55,.78,.82);vec3 warm=vec3(.95,.82,.70);'+
  'vec3 col=mix(deep,mid,smoothstep(1.,0.,uv.y));'+
  'float g=exp(-pow(length(vec2(q.x*.8,q.y+.55)),2.)*2.2);'+
  'col+=glow*g*.55+warm*g*g*.3;'+
  'vec2 w=vec2(q.x*1.6,q.y*2.4);float s=t*.03;'+
  'float f=fbm(w+vec2(s,-s*.6)+fbm(w*1.3+vec2(-s,s*.8)));'+
  'float cl=smoothstep(.38,.85,f);'+
  'vec3 cc=mix(mid*.9,glow,smoothstep(.2,1.,uv.y<.6?1.-uv.y*.9:.4)*.7+g*.4);'+
  'col=mix(col,cc,cl*.55);'+
  'col*=1.-.55*smoothstep(.45,1.1,length(q*vec2(.9,1.1)));'+
  'col*=.78;'+
  'gl_FragColor=vec4(col,1.);}';
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
  var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;
  gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var ur=gl.getUniformLocation(pr,'r'),ut=gl.getUniformLocation(pr,'t');
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){var d=Math.min(window.devicePixelRatio||1,1)*.6;c.width=Math.max(2,Math.floor(c.clientWidth*d));c.height=Math.max(2,Math.floor(c.clientHeight*d));gl.viewport(0,0,c.width,c.height);}
  function draw(ms){gl.uniform2f(ur,c.width,c.height);gl.uniform1f(ut,ms/1000+20);gl.drawArrays(gl.TRIANGLES,0,3);}
  function loop(ms){draw(ms);requestAnimationFrame(loop);}
  size();
  window.addEventListener('resize',function(){size();if(still)draw(0);});
  if(still)draw(0);else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
