<!doctype html>
<html lang="en">
<head>

<title>404 - Skybridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  /* Prompt font face "Geist Mono:SemiBold" (Figma-hosted) -> Geist Mono 600 via Google Fonts */
  :root { --mono: "Geist Mono", "Geist Mono:SemiBold", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #000; overflow-x: hidden; }
  body { font-family: var(--mono); font-weight: 600; color: #fff; }
  main { position: relative; min-height: 100svh; overflow: hidden; background: #000; }

  /* Background "video" substitute: living sky + bridge on canvas (no overlay on top) */
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 1; z-index: 0; }

  .brand { position: absolute; z-index: 2; top: 80px; left: 50%; width: 233px; height: 40px;
    transform: translateX(-50%); }
  .brand svg { position: absolute; display: block; overflow: visible; }
  .brand .mark { left: 0; top: 0; width: 54px; height: 40px; }
  .brand .word { left: 68px; top: -25px; width: 164.311px; height: 100px; }

  .content { position: absolute; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 483px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 44px; }
  h1 { margin: 0; font-family: var(--mono); font-weight: 600; font-style: normal;
    font-size: 295.751px; line-height: 1.1; letter-spacing: -24.6459px; padding: 0 0 0.12em;
    background: linear-gradient(247.3282658084845deg, rgb(255,255,255) 2.5334%, rgba(255,255,255,.4) 93.612%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .rule { width: 425px; height: 1px; background: #fff; flex: none; }
  p { margin: 0; width: 100%; font-size: 24px; line-height: 1.1; letter-spacing: -2px; font-weight: 600; color: #fff; }

  @media (max-width: 640px) {
    .brand { top: 32px; transform: translateX(-50%) scale(.75); transform-origin: top center; }
    .content { width: min(100% - 40px, 360px); gap: 28px; }
    h1 { font-size: clamp(140px, 52vw, 200px); letter-spacing: -0.09em; height: auto; min-height: 0; padding-bottom: .12em; }
    .rule { width: 100%; }
    p { font-size: clamp(16px, 4.5vw, 20px); letter-spacing: -1.3px; }
  }
</style>
</head>
<body>
<main>
  <canvas id="bg" aria-hidden="true"></canvas>

  <div class="brand" aria-label="LGPSM">
    <svg class="mark" viewBox="0 0 54 40" fill="none" aria-hidden="true">
      <path d="M38 0H26V12H38V0Z" fill="white"/>
      <path d="M54 12H38V28H54V12Z" fill="white"/>
      <path d="M38 28H26V40H38V28Z" fill="white"/>
      <path d="M26 12H16V22H26V12Z" fill="white"/>
      <path d="M16 22H8V30H16V22Z" fill="white"/>
      <path d="M16 2H6V12H16V2Z" fill="white"/>
      <path d="M6 12H0V18H6V12Z" fill="white"/>
    </svg>
    <svg class="word" viewBox="0 0 164.311 100" fill="none" aria-hidden="true">
      <path d="M122.498 37.4573H131.321L139.533 51.6222L147.772 37.4573H156.595V56.0604H152.449V37.6433L141.739 56.0604H137.354L126.617 37.6433V56.0604H122.498V37.4573ZM95.921 48.8317C92.785 48.8317 90.261 46.307 90.261 43.1445C90.261 40.0086 92.785 37.4573 95.921 37.4573H119.972V41.6031H95.921C95.071 41.6031 94.38 42.2941 94.38 43.1445C94.38 44.0215 95.071 44.7125 95.921 44.7125H114.285C117.421 44.7125 119.972 47.2372 119.972 50.3997C119.972 53.5357 117.421 56.0604 114.285 56.0604H90.261V51.9411H114.285C115.136 51.9411 115.827 51.2501 115.827 50.3997C115.827 49.5227 115.136 48.8317 114.285 48.8317H95.921ZM80.857 37.4573C84.843 37.4573 88.086 40.6995 88.086 44.7125C88.086 48.6989 84.843 51.9411 80.857 51.9411H62.254V56.0604H58.135V37.4573H80.857ZM80.83 47.7953C82.558 47.7953 83.94 46.4133 83.94 44.7125C83.94 42.985 82.558 41.6031 80.83 41.6031H62.254V47.7953H80.83ZM35.975 41.6031C33.105 41.6031 30.7927 43.9152 30.7927 46.7588C30.7927 49.629 33.105 51.9411 35.975 51.9411H51.336V48.6989H35.576V44.5796H55.482V56.0604H35.975C30.8192 56.0604 26.6734 51.9145 26.6734 46.7588C26.6734 41.6297 30.8192 37.4573 35.975 37.4573H55.482V41.6031H35.975ZM0 56.0604V37.4573H4.1192V51.9411H24.9281V56.0604H0ZM164.311 36.4177C164.311 37.7529 163.228 38.8354 161.893 38.8354C160.558 38.8354 159.475 37.7529 159.475 36.4177C159.475 35.0824 160.558 34 161.893 34C163.228 34 164.311 35.0824 164.311 36.4177Z" fill="white"/>
    </svg>
  </div>

  <div class="content">
    <h1>404</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>The path may be broken, but the journey isn't. Let's get you back.</p>
  </div>
</main>

<script>
/* Substitute for the (unavailable) background MP4: a dusk sky with drifting clouds,
   a suspension bridge silhouette and dark water. Drawn only by the canvas; nothing sits over it. */
(function () {
  var cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  var cl = document.createElement('canvas'), cctx = cl.getContext('2d');
  var CW = 200, CH = 120;
  cl.width = CW; cl.height = CH;
  var img = cctx.createImageData(CW, CH);

  var N = 256, perm = new Uint8Array(N * 2), grid = new Float32Array(N);
  var s = 7; function rnd() { s = (s * 16807) % 2147483647; return s / 2147483647; }
  var i;
  for (i = 0; i < N; i++) { perm[i] = i; grid[i] = rnd(); }
  for (i = N - 1; i > 0; i--) { var j = (rnd() * (i + 1)) | 0, t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (i = 0; i < N; i++) perm[i + N] = perm[i];
  function sm(t) { return t * t * (3 - 2 * t); }
  function vn(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    xi &= 255; yi &= 255;
    var a = grid[perm[perm[xi] + yi]], b = grid[perm[perm[xi + 1] + yi]],
        c = grid[perm[perm[xi] + yi + 1]], d = grid[perm[perm[xi + 1] + yi + 1]];
    var u = sm(xf), v = sm(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y) { var f = 0, a = .5; for (var o = 0; o < 4; o++) { f += a * vn(x, y); x *= 2.03; y *= 2.03; a *= .5; } return f; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  var stops = [[0, [9, 14, 38]], [.45, [28, 38, 82]], [.75, [66, 56, 108]], [.92, [138, 86, 112]], [1, [186, 118, 112]]];
  function sky(t) {
    for (var k = 1; k < stops.length; k++) if (t <= stops[k][0]) {
      var a = stops[k - 1], b = stops[k], u = (t - a[0]) / (b[0] - a[0]);
      return [lerp(a[1][0], b[1][0], u), lerp(a[1][1], b[1][1], u), lerp(a[1][2], b[1][2], u)];
    }
    return stops[stops.length - 1][1];
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', resize); resize();

  var INK = '#0b0d1c';
  function frame(ms) {
    var t = ms / 1000, horizon = .88, d = img.data, x, y;
    for (y = 0; y < CH; y++) {
      var ty = y / CH, base = sky(Math.min(1, ty / horizon));
      for (x = 0; x < CW; x++) {
        var o = (y * CW + x) * 4;
        var n = fbm(x * .035 + t * .22, y * .07 + 3.1);
        var n2 = fbm(x * .05 - t * .12 + 40, y * .11 + 9);
        var c = Math.max(0, (n * .65 + n2 * .35) - .45) * 3.2;
        c = Math.min(1, c) * (ty < horizon ? 1 : 0) * (.35 + .65 * Math.min(1, ty / .5));
        var warm = Math.pow(Math.max(0, ty / horizon), 2.2);
        var cr = lerp(110, 210, warm), cg = lerp(120, 150, warm), cb = lerp(180, 160, warm);
        d[o] = lerp(base[0], cr, c * .75); d[o + 1] = lerp(base[1], cg, c * .75); d[o + 2] = lerp(base[2], cb, c * .75); d[o + 3] = 255;
      }
    }
    cctx.putImageData(img, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(cl, 0, 0, W, H);

    var hy = H * horizon;
    var wg = ctx.createLinearGradient(0, hy, 0, H);
    wg.addColorStop(0, '#4a3a5e'); wg.addColorStop(.25, '#26233f'); wg.addColorStop(1, '#07091a');
    ctx.fillStyle = wg; ctx.fillRect(0, hy, W, H - hy);
    ctx.globalAlpha = .18;
    for (i = 0; i < 22; i++) {
      var yy = hy + 4 + Math.pow(i / 22, 1.6) * (H - hy - 6);
      var ww = 30 + (yy - hy) * .4;
      var xx = ((i * 197.3 + Math.sin(t * .6 + i) * 40 + t * 12) % (W + ww)) - ww;
      ctx.fillStyle = '#ffc9a0'; ctx.fillRect(xx, yy + Math.sin(t + i * 1.7) * 1.5, ww, 1.2);
    }
    ctx.globalAlpha = 1;

    // far shore haze
    ctx.fillStyle = 'rgba(30,24,52,.55)';
    for (i = 0; i < 46; i++) {
      var bw = W / 46, bh = (6 + ((i * 37) % 23)) * (H / 800);
      ctx.fillRect(i * bw, hy - bh, bw - 1, bh);
    }

    // suspension bridge silhouette
    var deckY = hy - H * .035, topY = H * .22, tw = Math.max(9, W * .011);
    var t0 = W * .24, t1 = W * .76, mid = (t0 + t1) / 2, towers = [t0, t1];
    ctx.fillStyle = INK;
    ctx.fillRect(-2, deckY, W + 4, Math.max(5, H * .008));
    ctx.fillRect(-2, deckY + H * .008, W + 4, 2);
    towers.forEach(function (tx) {
      ctx.fillStyle = INK;
      ctx.fillRect(tx - tw, topY, tw * .8, hy + H * .02 - topY);
      ctx.fillRect(tx + tw * .2, topY, tw * .8, hy + H * .02 - topY);
      ctx.fillRect(tx - tw, topY + (deckY - topY) * .28, tw * 2, tw * .7);
      ctx.fillRect(tx - tw, topY + (deckY - topY) * .62, tw * 2, tw * .7);
      ctx.fillRect(tx - tw * 1.1, topY - 4, tw * 2.2, 5);
      var bl = .5 + .5 * Math.sin(t * 2.2 + tx);
      ctx.fillStyle = 'rgba(255,90,70,' + (.35 + .65 * bl) + ')';
      ctx.beginPath(); ctx.arc(tx, topY - 9, 3, 0, 6.283); ctx.fill();
    });
    ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
    var ctrlY = deckY - H * .02 + (deckY - topY) * .55;
    ctx.beginPath(); ctx.moveTo(t0, topY); ctx.quadraticCurveTo(mid, ctrlY, t1, topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(t0, topY); ctx.quadraticCurveTo(t0 * .45, deckY - (deckY - topY) * .55, -4, deckY - 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(t1, topY); ctx.quadraticCurveTo(t1 + (W - t1) * .55, deckY - (deckY - topY) * .55, W + 4, deckY - 4); ctx.stroke();
    ctx.lineWidth = 1;
    for (i = 1; i < 40; i++) {
      var u = i / 40, bx = lerp(lerp(t0, mid, u), lerp(mid, t1, u), u);
      var by = lerp(lerp(topY, ctrlY, u), lerp(ctrlY, topY, u), u);
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, deckY); ctx.stroke();
    }
    for (i = 0; i < 70; i++) {
      var lx = (i + .5) / 70 * W, a = .55 + .45 * Math.sin(t * 1.3 + i * 2.1);
      ctx.fillStyle = 'rgba(255,214,150,' + (.5 * a) + ')';
      ctx.fillRect(lx, deckY - 3, 1.6, 2);
      ctx.fillStyle = 'rgba(255,200,140,' + (.12 * a) + ')';
      ctx.fillRect(lx, hy + 5 + (i % 4) * 7, 1.4, 5);
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) frame(5000); else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
