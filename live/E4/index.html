<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aethera - Beyond silence, we build the eternal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--background:#fff;--ink:#000;--mute:#6F6F6F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--background);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.display{font-family:'Instrument Serif',Georgia,serif}
.wrap{position:relative;min-height:100vh;min-height:100svh;width:100%;overflow:hidden}
.video{position:absolute;top:300px;inset:auto 0 0 0;height:calc(100% - 300px);z-index:0;opacity:0;will-change:opacity}
.video canvas{width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28%);mask-image:linear-gradient(to bottom,transparent,#000 28%)}
.overlay{position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,var(--background),transparent,var(--background));pointer-events:none}
nav{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:1.5rem 2rem;max-width:80rem;margin:0 auto}
.logo{font-size:1.875rem;line-height:2.25rem;letter-spacing:-.025em;color:#000}
.logo sup{font-size:.45em;vertical-align:super;margin-left:1px}
.menu{display:flex;gap:2rem;list-style:none}
.menu a{font-size:.875rem;color:var(--mute);text-decoration:none;transition:color .2s}
.menu a:hover,.menu a.on{color:#000}
.btn{display:inline-block;border:0;border-radius:9999px;background:#000;color:#fff;font:inherit;cursor:pointer;text-decoration:none;transition:transform .2s}
.btn:hover{transform:scale(1.03)}
.btn.sm{padding:.625rem 1.5rem;font-size:.875rem}
.btn.lg{padding:1.25rem 3.5rem;font-size:1rem;margin-top:3rem}
.hero{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(8rem - 75px) 1.5rem 10rem}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;max-width:80rem;font-size:3rem;line-height:.95;letter-spacing:-2.46px;color:#000}
h1 em{font-style:italic;color:var(--mute)}
.desc{max-width:42rem;margin-top:2rem;font-size:1rem;line-height:1.625;color:var(--mute)}
@media(min-width:640px){h1{font-size:4.5rem}.desc{font-size:1.125rem}}
@media(min-width:768px){h1{font-size:6rem}}
@media(max-width:720px){.menu{display:none}nav{padding:1.25rem 1.25rem}h1{letter-spacing:-1.6px}}
@keyframes fade-rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-rise{animation:fade-rise .8s ease-out both}
.animate-fade-rise-delay{animation:fade-rise .8s ease-out .2s both}
.animate-fade-rise-delay-2{animation:fade-rise .8s ease-out .4s both}
@media(prefers-reduced-motion:reduce){.animate-fade-rise,.animate-fade-rise-delay,.animate-fade-rise-delay-2{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="video" id="video"><canvas id="cv"></canvas></div>
  <div class="overlay"></div>
  <nav>
    <div class="logo display">Aethera<sup>&reg;</sup></div>
    <ul class="menu">
      <li><a href="#" class="on">Home</a></li>
      <li><a href="#">Studio</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Journal</a></li>
      <li><a href="#">Reach Us</a></li>
    </ul>
    <a href="#" class="btn sm">Begin Journey</a>
  </nav>
  <section class="hero">
    <h1 class="animate-fade-rise">Beyond <em>silence,</em> we build <em>the eternal.</em></h1>
    <p class="desc animate-fade-rise-delay">Building platforms for brilliant minds, fearless makers, and thoughtful souls. Through the noise, we craft digital havens for deep work and pure flows.</p>
    <a href="#" class="btn lg animate-fade-rise-delay-2">Begin Journey</a>
  </section>
</div>
<script>
(function(){
  // Stand-in for the looping video: a procedural, slow, pale silk/cloud animation on canvas,
  // driven by the same fade-in / fade-out loop logic as the prompt (0.5s fades, manual loop).
  var wrap=document.getElementById('video'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR=8,FADE=.5,W=0,H=0,t0=null,restartAt=0,ended=false;
  function size(){var r=wrap.getBoundingClientRect();W=cv.width=Math.max(2,Math.ceil(r.width/3));H=cv.height=Math.max(2,Math.ceil(r.height/3))}
  size();addEventListener('resize',size);
  function draw(t){
    ctx.fillStyle='#f4f6fa';ctx.fillRect(0,0,W,H);
    var blobs=[[.2,.55,.55,'200,214,236'],[.7,.45,.6,'222,208,232'],[.5,.8,.7,'196,222,226'],[.85,.8,.5,'236,226,210'],[.1,.9,.5,'208,218,240']];
    for(var i=0;i<blobs.length;i++){
      var b=blobs[i],a=t*.5+i*1.7;
      var x=(b[0]+Math.sin(a)*.12)*W,y=(b[1]+Math.cos(a*.8)*.1)*H,r=b[2]*Math.max(W,H)*.6;
      var g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba('+b[3]+',.95)');g.addColorStop(1,'rgba('+b[3]+',0)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    }
    ctx.lineWidth=1;
    for(var k=0;k<14;k++){
      ctx.beginPath();
      ctx.strokeStyle='rgba(255,255,255,'+(.35+.25*Math.sin(k+t))+')';
      for(var x2=0;x2<=W;x2+=4){
        var y2=H*(.35+k*.04)+Math.sin(x2*.018+t*.9+k*.5)*H*.08+Math.sin(x2*.007-t*.4+k)*H*.06;
        x2?ctx.lineTo(x2,y2):ctx.moveTo(x2,y2);
      }
      ctx.stroke();
    }
  }
  function frame(now){
    if(t0===null)t0=now;
    var el=(now-t0)/1000;
    if(ended){
      wrap.style.opacity=0;
      if(now>=restartAt){ended=false;t0=now;el=0}
    }
    if(!ended){
      var op=1;
      if(el<FADE)op=el/FADE;else if(DUR-el<FADE)op=Math.max(0,(DUR-el)/FADE);
      wrap.style.opacity=op;
      draw(el+ (reduce?3:0));
      if(el>=DUR){ended=true;wrap.style.opacity=0;restartAt=now+100}
    }
    if(!reduce)requestAnimationFrame(frame);
  }
  if(reduce){wrap.style.opacity=1;draw(3)}else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
