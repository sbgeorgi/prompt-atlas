<style>

.send{left:calc(640*var(--u));top:calc(2*var(--u));width:calc(35*var(--u));height:calc(35*var(--u));border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;

/* TABLET */

/* COMPACT */
@media (max-width:599px),(max-height:599px) and (max-width:1180px){
  :root{--u:1px;--vu:1px}
  .frame{padding:max(18px,env(safe-area-inset-top)) max(clamp(18px,5.2vw,40px),env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(clamp(18px,5.2vw,40px),env(safe-area-inset-left))}

  .mark{width:30px;height:30px}.wordmark{font-size:18px}
  .burger{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);cursor:pointer}

  .hero{gap:clamp(24px,5vh,44px);padding-bottom:0}
  .h1{width:100%;max-width:15ch;font-size:clamp(29px,7.6vw,50px);line-height:1.14;letter-spacing:-.012em}
  .card{width:100%;max-width:600px;height:auto;margin-right:0;display:flex;flex-direction:column;gap:clamp(16px,4.6vh,34px);padding:clamp(13px,3.4vw,18px);border-radius:20px}
  .ph{position:static;white-space:nowrap;text-overflow:ellipsis;font-size:clamp(9.4px,2.95vw,14px);line-height:1.35}

  .right>*{position:static}
  .model{font-size:12px;gap:5px}.model svg{width:7px}
  .attach{margin-left:auto}.attach svg{width:19px}
  .send{margin-left:14px;width:40px;height:40px}.send svg{width:12px}

/* ENTRANCE */
@media (prefers-reduced-motion:no-preference){
  @keyframes e-settle-down{from{opacity:0;transform:translateY(calc(-5*var(--u)))}to{opacity:1;transform:none}}
  @keyframes e-settle-up{from{opacity:0;transform:translateY(calc(6*var(--u)))}to{opacity:1;transform:none}}
  @keyframes e-mark{from{transform:scale(.9)}to{transform:none}}
  @keyframes e-focus{from{opacity:0;transform:translateY(calc(14*var(--u)));filter:blur(calc(6*var(--u)))}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes e-panel{from{opacity:0;transform:translateY(calc(18*var(--u))) scale(.985)}to{opacity:1;transform:none}}
  @keyframes e-populate{from{opacity:0;transform:translateY(calc(4*var(--u)))}to{opacity:1;transform:none}}

  .anim .brand{animation:e-settle-down .58s var(--e-soft) .06s both}
  .anim .mark{animation:e-mark .62s var(--e-primary) .06s both}
  .anim .links a{animation:e-settle-down .50s var(--e-soft) both}

  .anim .nav>.cta{animation:e-settle-down .55s var(--e-soft) .34s both}
  .anim .h1{animation:e-focus 1s var(--e-primary) .30s both;will-change:transform,opacity}
  .anim .card{animation:e-panel .90s var(--e-primary) .62s both;will-change:transform,opacity}
  .anim .ph{animation:e-populate .50s var(--e-soft) .88s both}
  .anim .chips{animation:e-populate .50s var(--e-soft) .94s both}
  .anim .right{animation:e-populate .50s var(--e-soft) 1s both}
  .anim .send{animation:e-send .50s var(--e-primary) 1s both}
  .anim .proof p{animation:e-settle-up .55s var(--e-soft) 1.08s both}

}

</style>

<body>
<div class="stage">
  <canvas class="stage-video" id="bg" aria-hidden="true"></canvas>
  <div class="frame">
    <input type="checkbox" id="menu" aria-label="Menu">
    <header class="nav">
      <a class="brand" href="#" aria-label="Fastshot home">
        <svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#9C86CE"/><circle cx="17" cy="17" r="8.6" fill="#FFFFFF"/><circle cx="17" cy="17" r="3.7" fill="#151519"/></svg>
        <span class="wordmark">Fastshot</span>
      </a>
      <nav class="links" aria-label="Primary"><a href="#">Features</a><a href="#">Examples</a><a href="#">Pricing</a><a href="#">Docs</a></nav>
      <a class="cta" href="#"><span>Get Started</span></a>

    </header>

    </div></div></div>
    <main class="hero">

        <p class="ph">Build a fintech tracking app with bank level privacy and...</p>

            <button type="button" class="chip" style="--cw:108;--pl:16;--ig:3.9;--iw:11.8"><svg viewBox="0 0 12 18" aria-hidden="true"><path d="M3 0h3v6H3a3 3 0 0 1 0-6zM6 0h3a3 3 0 0 1 0 6H6zM3 6h3v6H3a3 3 0 0 1 0-6zM12 9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM3 12h3v3a3 3 0 1 1-3-3z"/></svg><span>Attach a Figma</span></button>
            <button type="button" class="chip" style="--cw:107;--pl:15.8;--ig:2.9;--iw:12.13"><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="6" opacity=".45"/><path d="M6 0a6 6 0 0 1 0 12z"/></svg><span>Today's Theme</span></button>
          </div>
          <div class="right">
            <button type="button" class="model">Sonnet 4.5<svg viewBox="0 0 7 4" aria-hidden="true"><path d="M.8.8 3.5 3.2 6.2.8"/></svg></button>
            <button type="button" class="attach" aria-label="Attach file"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M17.2 9.6 10.4 16.4a4.4 4.4 0 0 1-6.2-6.2l7-7a2.9 2.9 0 0 1 4.1 4.1l-7 7a1.4 1.4 0 0 1-2-2l6.4-6.4"/></svg></button>

          </div>
        </div>
      </form>
    </main>
    <footer class="proof">
      <p>Built by engineers from</p>
      <div class="logos">

</div>
<script>
/* dawn lake + mountains, painted once (stand-in for the background video) */
(function(){
  var cv=document.getElementById('bg'),ctx=cv.getContext('2d');
  function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function noise(seed){var r=rng(seed),v=[];for(var i=0;i<256;i++)v.push(r());return function(x){var i=Math.floor(x),f=x-i,a=v[i&255],b=v[(i+1)&255],t=f*f*(3-2*f);return a+(b-a)*t}}
  function ridge(n,x,oct){var s=0,a=1,f=1,tot=0;for(var o=0;o<oct;o++){var v=1-Math.abs(n(x*f+o*31.7)*2-1);s+=Math.pow(v,1.6)*a;tot+=a;a*=.52;f*=2.3}return s/tot}
  function draw(){
    var dpr=Math.min(window.devicePixelRatio||1,1.5),W=Math.round(cv.clientWidth*dpr),H=Math.round(cv.clientHeight*dpr);
    if(!W||!H)return;cv.width=W;cv.height=H;
    var hy=Math.round(H*.62),sunX=W*.66;
    var sc=document.createElement('canvas');sc.width=W;sc.height=hy;var c=sc.getContext('2d');
    var g=c.createLinearGradient(0,0,0,hy);
    g.addColorStop(0,'#0b1630');g.addColorStop(.38,'#23305f');g.addColorStop(.66,'#5f5a8c');g.addColorStop(.86,'#c98d98');g.addColorStop(1,'#f5c39f');
    c.fillStyle=g;c.fillRect(0,0,W,hy);
    var r=c.createRadialGradient(sunX,hy,0,sunX,hy,W*.42);
    r.addColorStop(0,'rgba(255,224,176,.95)');r.addColorStop(.18,'rgba(255,196,150,.55)');r.addColorStop(.6,'rgba(235,150,140,.14)');r.addColorStop(1,'rgba(235,150,140,0)');
    c.fillStyle=r;c.fillRect(0,0,W,hy);
    // faint high clouds
    var cr=rng(7);c.fillStyle='rgba(255,190,170,.07)';
    for(var i=0;i<9;i++){var cx=cr()*W,cy=hy*(.3+cr()*.4),cw=W*(.12+cr()*.2);c.beginPath();c.ellipse(cx,cy,cw,cw*.018,0,0,7);c.fill()}
    function layer(seed,scale,off,amp,top,bot,peak){
      var n=noise(seed),step=Math.max(2,Math.round(W/700));
      c.beginPath();c.moveTo(0,hy+3);
      for(var x=0;x<=W+step;x+=step){var k=x/W,env=.55+.45*Math.sin(Math.PI*Math.min(1,Math.max(0,k*1.0+off*.05)));
        var y=hy-amp*H*(.18+.82*ridge(n,k*scale+off,7))*(.7+.3*env);c.lineTo(x,y)}
      c.lineTo(W,hy+3);c.closePath();
      var lg=c.createLinearGradient(0,hy-amp*H,0,hy);lg.addColorStop(0,top);lg.addColorStop(peak,top);lg.addColorStop(1,bot);
      c.fillStyle=lg;c.fill();
    }
    layer(11,2.6,2.0,.30,'#e9bfb9','#b98aa0',.12);
    layer(23,3.6,9.3,.21,'#6f6c9a','#b888a0',.35);
    layer(37,4.6,4.1,.13,'#2b3158','#7d6a92',.5);
    var mg=c.createLinearGradient(0,hy-H*.1,0,hy);mg.addColorStop(0,'rgba(245,190,170,0)');mg.addColorStop(1,'rgba(250,205,175,.55)');
    c.fillStyle=mg;c.fillRect(0,hy-H*.1,W,H*.1);
    // front shore trees (dark ridge line)
    var nn=noise(91);c.beginPath();c.moveTo(0,hy+3);
    for(var x=0;x<=W;x+=2){var k=x/W;var y=hy-H*.012*(.3+nn(k*60)*1.2+nn(k*9)*.8);c.lineTo(x,y)}
    c.lineTo(W,hy+3);c.closePath();c.fillStyle='#161a33';c.fill();
    // main
    ctx.drawImage(sc,0,0);
    var lh=H-hy;var lg=ctx.createLinearGradient(0,hy,0,H);lg.addColorStop(0,'#caa29f');lg.addColorStop(.12,'#6d5f86');lg.addColorStop(1,'#0e1428');
    ctx.fillStyle=lg;ctx.fillRect(0,hy,W,lh);
    ctx.globalAlpha=.88;
    for(var y=0;y<lh;y++){
      var d=y/lh,srcY=hy-1-Math.min(hy-1,y*.95*(1+d*.6));
      var dx=Math.sin(y*.09+Math.sin(y*.013)*4)*(1+d*5)*dpr*.9;
      ctx.drawImage(sc,0,srcY,W,1,dx,hy+y,W,1);
    }
    ctx.globalAlpha=1;
    var dk=ctx.createLinearGradient(0,hy,0,H);dk.addColorStop(0,'rgba(18,22,48,.12)');dk.addColorStop(.55,'rgba(10,14,32,.5)');dk.addColorStop(1,'rgba(8,11,24,.86)');
    ctx.fillStyle=dk;ctx.fillRect(0,hy,W,lh);
    // sun glints
    var gr=rng(5);
    for(var i=0;i<140;i++){var d=Math.pow(gr(),1.6),y=hy+3+d*lh*.8,wd=(W*.012+gr()*W*.07)*(.4+d*1.4),xx=sunX+(gr()-.5)*W*(.07+d*.2);
      ctx.fillStyle='rgba(255,214,170,'+((1-d)*.4*gr()).toFixed(3)+')';ctx.fillRect(xx-wd/2,y,wd,Math.max(1,dpr*(.6+d*1.6)))}
    // horizon haze
    var hz=ctx.createLinearGradient(0,hy-4,0,hy+H*.04);hz.addColorStop(0,'rgba(255,215,185,0)');hz.addColorStop(.4,'rgba(255,215,185,.28)');hz.addColorStop(1,'rgba(255,215,185,0)');
    ctx.fillStyle=hz;ctx.fillRect(0,hy-4,W,H*.04+4);
    // gentle overall vignette for text legibility
    var v=ctx.createRadialGradient(W/2,H*.5,H*.3,W/2,H*.5,H*1.1);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(4,6,14,.45)');
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  }
  draw();var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(draw,120)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.catch(function(){});
})();
/* entrance teardown */
(function(){
  var h=document.documentElement,done=false;
  function end(){if(done)return;done=true;h.classList.remove('anim')}
  var last=document.querySelector('.logos svg:last-child');
  if(last)last.addEventListener('animationend',end);
  setTimeout(end,2600);
})();
</script>
