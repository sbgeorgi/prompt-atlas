<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lattice</title>
<style>
  /* Clear colour lives on <html> ONLY, so a canvas at z-index -1 stays visible. */
  html { background: #05060b; color: #c8cee0; }
  body { margin: 0; min-height: 100vh; overflow: hidden;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: -1; }
  .tag { position: fixed; left: 16px; top: 14px; z-index: 1; pointer-events: none;
         font-size: 8px; letter-spacing: .14em; text-transform: uppercase; line-height: 1.5; }
  .tag b { display: block; font-weight: 600; color: #c8cee0; font-size: 8px; }
  .tag span { display: block; color: #c8cee0; opacity: .55; letter-spacing: .2em; }
  .cur { position: fixed; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px;
         border: 1px solid rgba(200,206,224,.8); border-radius: 50%; z-index: 2;
         pointer-events: none; opacity: 0; transition: opacity .3s; }
  .cur::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px;
         margin: -1.5px; border-radius: 50%; background: #fff; }
  @media (min-width: 700px) { .tag, .tag b { font-size: 10px; } .tag { left: 24px; top: 22px; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="tag"><b>Lattice</b><span>Move the cursor</span></div>
<div class="cur" id="cur"></div>
<script>
(function () {
const CFG = { clear: '#05060b', bg: '#06070d', line: '#2c3d6b', hot: '#5cf2ff',
              cells: 1.4, speed: 0.55, grain: 0.016, dprCap: 1.5, maxFragments: 2400000, fps: 60 };

const FRAG = `#version 300 es
precision highp float;
out vec4 O;
uniform vec2 uRes; uniform float uTime; uniform vec2 uPointer; uniform float uOn;
uniform vec3 uBg, uLine, uHot; uniform float uCells, uSpeed, uGrain;

float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }

/* An analytic anti-aliased grid line. fwidth() gives the width of one screen
   pixel in grid space, so the line stays exactly one pixel wide at every depth. */
float grid(vec2 g, float w){
  vec2 d = abs(fract(g) - 0.5);
  vec2 f = fwidth(g) * w;
  vec2 l = smoothstep(f, vec2(0.0), d - f);
  return max(l.x, l.y);
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 sp = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

  float horizon = 0.30;
  float y = sp.y - horizon;
  if (y > -0.006) {
    float glow = exp(-(y * y) / 0.0016) * 0.55;
    vec3 sky = uBg + uHot * glow;
    sky += (h21(gl_FragCoord.xy + fract(uTime) * 33.7) - 0.5) * uGrain;
    O = vec4(max(sky, 0.0), 1.0); return;
  }
  float z = 0.36 / -y;
  vec2 g = vec2(sp.x * z, z + uTime * uSpeed) * uCells;

  float line = grid(g, 0.9);

  vec2 pw = vec2((uPointer.x - 0.5) * uRes.x / uRes.y, 0.0);
  float pz = 0.36 / max(0.02, (0.5 - uPointer.y) + horizon);
  float d = length(vec2(sp.x * z, z) - vec2(pw.x * pz / max(pz, 0.001), pz));
  float ring = exp(-pow(d - 1.4, 2.0) * 1.6) * uOn;

  float fade = exp(-z * 0.10);
  vec3 col = uBg;
  col += uLine * line * fade;
  col += uHot * line * ring * 1.8 * fade;
  col += uHot * exp(-(y * y) / 0.0022) * 0.20;

  col += (h21(gl_FragCoord.xy + fract(uTime) * 33.7) - 0.5) * uGrain;
  O = vec4(max(col, 0.0), 1.0);
}`;

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(hover: none) and (pointer: coarse)').matches;
const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
const MOBILE = innerWidth < 768 || COARSE;

const cv = document.getElementById('bg');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) { cv.style.background = CFG.clear; return; }

const VERT = `#version 300 es
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh) || '';
    console.error(log + '\n' + src.split('\n').map((l, i) => String(i + 1).padStart(3) + ' | ' + l).join('\n'));
    throw new Error('shader: ' + log.split('\n')[0]);
  }
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const U = {};
for (let i = 0, n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i < n; i++) {
  const nm = gl.getActiveUniform(prog, i).name.replace(/\[0\]$/, '');
  U[nm] = gl.getUniformLocation(prog, nm);
}
const rgb = h => {
  const n = parseInt(h.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
};

const MAX_FRAG = CFG.maxFragments || 2.6e6;
let W = 0, H = 0, DPR = 1;
function fit() {
  const w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight;
  const byTier = Math.min(devicePixelRatio || 1, MOBILE ? 1.25 : (CFG.dprCap || 1.75));
  const byArea = Math.sqrt(MAX_FRAG / Math.max(1, w * h));
  const dpr = Math.max(0.6, Math.min(byTier, byArea));
  const nw = Math.round(w * dpr), nh = Math.round(h * dpr);
  if (nw === W && nh === H) return false;
  W = nw; H = nh; DPR = dpr;
  cv.width = W; cv.height = H;
  gl.viewport(0, 0, W, H);
  return true;
}
fit();
let lastW = innerWidth;
addEventListener('resize', () => {
  if (MOBILE && innerWidth === lastW) return;
  lastW = innerWidth; fit();
  if (RM) draw(0);
}, { passive: true });

const P = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, on: 0 };
const cur = document.getElementById('cur');
if (FINE && !MOBILE && CFG.pointer !== false) {
  addEventListener('pointermove', e => {
    P.tx = e.clientX / innerWidth;
    P.ty = 1 - e.clientY / innerHeight;
    P.on = 1;
    cur.style.opacity = 1;
    cur.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    if (RM) { P.x = P.tx; P.y = P.ty; draw(0); }
  }, { passive: true });
}

gl.uniform3fv(U.uBg, rgb(CFG.bg));
gl.uniform3fv(U.uLine, rgb(CFG.line));
gl.uniform3fv(U.uHot, rgb(CFG.hot));
gl.uniform1f(U.uCells, CFG.cells);
gl.uniform1f(U.uSpeed, CFG.speed);
gl.uniform1f(U.uGrain, CFG.grain);
function draw(t) {
  fit();
  gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uTime, RM ? 3.0 : t);
  gl.uniform2f(U.uPointer, P.x, P.y);
  gl.uniform1f(U.uOn, P.on);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

const t0 = performance.now();
let last = t0, budget = 1000 / (MOBILE ? 30 : (CFG.fps || 60));
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < budget) return;
  const dt = Math.min(0.05, (now - last) / 1000) || 0.016;
  last = now;
  const k = 1 - Math.pow(1 - 0.08, dt * 60);
  P.x += (P.tx - P.x) * k;
  P.y += (P.ty - P.y) * k;
  draw((now - t0) / 1000, dt);
}
draw(0);
if (!RM) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
