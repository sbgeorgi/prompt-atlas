:root {

* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: clip; }
body { background: #0a0a0b; color: var(--ink); font-family: Inter, Helvetica Neue, Arial, sans-serif; overflow-x: clip; }

.boot p { font-size: 12.5px; letter-spacing: 0.05em; color: rgba(255, 255, 255, 0.42); }
.bar { width: 150px; height: 1px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }

.nav-wrap { position: fixed; top: var(--nav-top); left: 0; right: 0; z-index: 80; display: flex; justify-content: center; padding: 0 max(14px, env(safe-area-inset-left, 0px)) 0 max(14px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.nav { pointer-events: auto; display: flex; align-items: center; gap: 18px; max-width: min(100%, 520px); padding: 6px 8px 6px 16px; border-radius: 999px; background: rgba(48,48,50,.55); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: 0 10px 40px rgba(0,0,0,.18); }

.seg button { border: 0; background: transparent; color: rgba(255,255,255,.55); font-size: 13px; font-weight: 500; padding: 8px 16px; min-height: 44px; border-radius: 999px; cursor: pointer; transition: background .25s ease, color .25s ease; -webkit-tap-highlight-color: transparent; }

.stage { position: fixed; top: 0; left: 0; width: 100%; height: var(--vh); z-index: 1; overflow: hidden; }
.layer { position: absolute; inset: 0; opacity: 0; will-change: opacity; }

.hero { background: #0a0a0b; isolation: isolate; }
.hero-copy { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: flex-start; text-align: left; padding: calc(88px + env(safe-area-inset-top, 0px)) var(--pad) 0 max(var(--pad), env(safe-area-inset-left, 0px)); pointer-events: none; }
.hero-copy h1 { font-weight: 500; letter-spacing: -0.045em; line-height: 1.18; color: rgba(255,255,255,.92); font-size: clamp(24px, 3.6vw, 52px); max-width: min(18ch, 100%); }

.apps { background: #0d0d0e; }

.scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scene .bg { filter: blur(28px) saturate(1.08) brightness(0.55); transform: scale(1.14); }

.more { position: absolute; left: 50%; bottom: calc(14px + var(--safe-bottom)); transform: translateX(-50%); z-index: 6; border: 0; background: rgba(20,20,22,.28); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: rgba(255,255,255,.78); padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; text-align: center; max-width: calc(100% - 28px); white-space: normal; line-height: 1.3; -webkit-tap-highlight-color: transparent; }

}
</style>

      { k: "Dirt & moisture", v: "IP6K9K sealed jackets" },
      { k: "Wear resistance", tag: "ISO 6722-1 CLASS 3" } ] }

/* ---------- procedural art (stands in for the hosted video + photos) ---------- */
function tubePath(ctx, f, N, r, c) {
  var P = [], i, s, a, b, dx, dy, l;
  for (i = 0; i <= N; i++) { s = i / N; a = f(s); P.push({ x: a[0], y: a[1], r: r * (a[2] || 1) }); }

    for (var i = 0; i <= N; i++) { var p = P[i]; var X = p.x + p.nx * p.r * off, Y = p.y + p.ny * p.r * off; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }

  line(-0.42, r * 0.34, c.hi);
  line(-0.55, r * 0.09, c.hi2);
}

function drawHero(cv, t) {

    { base: "#3b414c", rib: "rgba(8,9,12,.75)", dark: "rgba(0,0,0,.35)", hi: "rgba(205,214,230,.55)", hi2: "rgba(255,255,255,.7)" },
    { base: "#4a3a66", rib: "rgba(10,6,20,.7)", dark: "rgba(0,0,0,.35)", hi: "rgba(190,160,240,.55)", hi2: "rgba(255,255,255,.55)" },
    { base: "#2c3038", rib: "rgba(0,0,0,.8)", dark: "rgba(0,0,0,.4)", hi: "rgba(160,170,190,.45)", hi2: "rgba(255,255,255,.4)" }

      var f = function (s) {
        var q = s * len;

        var y = h * (0.78 - k * 0.07 - 0.2 * q) + Math.sin(q * 5.2 + ph) * amp * (0.35 + q) + k * h * 0.02;

var THEME = [
  { a: "#d9a02a", b: "#2b1d08", cable: { base: "#1a1a1a", rib: "rgba(0,0,0,.9)", dark: "rgba(0,0,0,.45)", hi: "rgba(255,255,255,.35)", hi2: "rgba(255,255,255,.55)" }, motif: "stripes" },
  { a: "#8a4fe0", b: "#150a30", cable: { base: "#6d3fb8", rib: "rgba(20,5,45,.75)", dark: "rgba(10,0,30,.45)", hi: "rgba(220,190,255,.6)", hi2: "rgba(255,255,255,.7)" }, motif: "rings" },
  { a: "#3a8fd8", b: "#0a1a2c", cable: { base: "#1b1b1d", rib: "rgba(0,0,0,.9)", dark: "rgba(0,0,0,.45)", hi: "rgba(255,255,255,.3)", hi2: "rgba(255,255,255,.5)" }, motif: "road" },
  { a: "#9aa4b2", b: "#14171c", cable: { base: "#50565f", rib: "rgba(8,9,12,.8)", dark: "rgba(0,0,0,.4)", hi: "rgba(235,240,250,.55)", hi2: "rgba(255,255,255,.75)" }, motif: "rails" },
  { a: "#6fae3d", b: "#0f1c08", cable: { base: "#26361c", rib: "rgba(0,0,0,.8)", dark: "rgba(0,0,0,.45)", hi: "rgba(190,230,150,.45)", hi2: "rgba(255,255,255,.5)" }, motif: "hills" }

function paintBg(ctx, w, h, th) {
  var g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, th.a); g.addColorStop(0.55, th.b); g.addColorStop(1, "#050506");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.translate(w * .5, h * .5); ctx.rotate(-0.5);

    ctx.strokeStyle = "rgba(190,150,255,.5)"; ctx.lineWidth = w * .008;
    for (i = 1; i < 7; i++) { ctx.beginPath(); ctx.arc(w * .55, h * .5, i * h * .17, 0, 7); ctx.stroke(); }
  } else if (th.motif === "road") {
    ctx.fillStyle = "rgba(255,255,255,.35)";
    for (i = 0; i < 9; i++) ctx.fillRect(w * (i * .14 - .02), h * .72, w * .07, h * .02);
    ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(0, h * .6, w, h * .4);

    ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = w * .01;
    for (i = -3; i < 4; i++) { ctx.beginPath(); ctx.moveTo(w * (.5 + i * .02), h * .35); ctx.lineTo(w * (.5 + i * .28), h * 1.1); ctx.stroke(); }

    ctx.fillStyle = "rgba(160,220,90,.4)";
    ctx.beginPath(); ctx.moveTo(0, h * .7);
    for (i = 0; i <= 20; i++) ctx.lineTo(w * i / 20, h * (.66 + Math.sin(i * .6) * .06));

    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.moveTo(0, h * .82);
    for (i = 0; i <= 20; i++) ctx.lineTo(w * i / 20, h * (.8 + Math.cos(i * .45) * .05));

}
function paintCable(ctx, w, h, i) {

    return [x, y, 1];
  };
  tubePath(ctx, f, 320, r, { base: th.cable.base, rib: th.cable.rib, dark: th.cable.dark, hi: th.cable.hi, hi2: th.cable.hi2, shadow: true });
  var f2 = function (s) { var a = f(s); return [a[0], a[1] - h * 0.115, 0.45]; };
  tubePath(ctx, function (s) { var a = f(s * 0.86 + 0.07); return [a[0], a[1] + h * 0.12, 0.42]; }, 240, r, { base: th.cable.base, rib: th.cable.rib, dark: th.cable.dark, hi: th.cable.hi, hi2: th.cable.hi2, shadow: true });
}
function mk(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
var ART = APPS.map(function (_, i) {
  var b = mk(960, 540), bc = b.getContext("2d"); paintBg(bc, 960, 540, THEME[i]);
  var c = mk(1280, 720); paintCable(c.getContext("2d"), 1280, 720, i);
  var t = mk(480, 270), tc = t.getContext("2d"); paintBg(tc, 480, 270, THEME[i]); tc.drawImage(c, 0, 0, 480, 270);
  return { bg: b.toDataURL("image/jpeg", 0.8), cable: c.toDataURL("image/png"), thumb: t.toDataURL("image/jpeg", 0.8) };
});

/* ---------- app (mirrors the spec's scroll architecture) ---------- */
var video = document.getElementById("heroVideo"); // a canvas here, scrubbed the same way
var heroLayer = document.getElementById("heroLayer"), appsLayer = document.getElementById("appsLayer"), track = document.getElementById("track");
var scenes = [].slice.call(document.querySelectorAll(".scene"));
var menu = document.getElementById("menu"), card = document.getElementById("card"), more = document.getElementById("more");
var btnFull = document.getElementById("btnFull"), btnOverview = document.getElementById("btnOverview");
var boot = document.getElementById("boot"), bootBar = document.getElementById("bootBar"), bootPct = document.getElementById("bootPct");

scenes.forEach(function (s, i) { var im = s.querySelectorAll("img"); im[0].src = ART[i].bg; im[1].src = ART[i].cable; });

var clamp = function (n, a, b) { return Math.max(a, Math.min(b, n)); };
var range = function (v, a, b) { return clamp((v - a) / (b - a), 0, 1); };
var MOBILE_BP = 900, STEPS = APPS.length - 1;
var HERO_VH = 4.4, FADE_VH = 1.0, STEP_VH = 1.0;
var heroTarget = 0, seekAt = 0, dur = 6, ready = false, raf = 0, index = -1, wheelLock = false;
var vh = innerHeight, lastW = innerWidth, heroLen = 0, fadeLen = 0, appsLen = 0, appsStart = 0, lastDrawn = -1;

function sizeCanvas() {
  var d = Math.min(window.devicePixelRatio || 1, 1.5);
  video.width = Math.max(2, Math.round(innerWidth * d)); video.height = Math.max(2, Math.round(innerHeight * d));
  lastDrawn = -1;
}
function layout(force) {
  var h = Math.max(1, innerHeight);
  if (!force && innerWidth === lastW && Math.abs(h - vh) < 120) return;
  vh = h; lastW = innerWidth;
  document.documentElement.style.setProperty("--vh", h + "px");
  heroLen = HERO_VH * vh; fadeLen = FADE_VH * vh; appsLen = STEP_VH * STEPS * vh; appsStart = heroLen + fadeLen;
  track.style.height = (appsStart + appsLen + vh) + "px";
  sizeCanvas();
}
var heroFromScroll = function () { heroTarget = clamp((scrollY || 0) / heroLen, 0, 1); };

var opts = APPS.map(function (item, i) {
  var b = document.createElement("button"); b.type = "button"; b.className = "opt" + (i === 0 ? " is-on" : "");
  b.innerHTML = item.label + '<img alt="" src="' + ART[i].thumb + '">';
  b.addEventListener("click", function () { setIndex(i, false); });
  menu.appendChild(b); return b;
});

function setBootProgress(f) { bootBar.style.transform = "scaleX(" + f + ")"; bootPct.textContent = "LOADING " + Math.round(f * 100) + "%"; }
var started = false;
function start() {
  if (started) return; started = ready = true; boot.classList.add("done");
  heroFromScroll(); seekAt = heroTarget * dur; renderCard(0); paintUI();
}
// the hosted clip is replaced by a procedural canvas: a short fake preload keeps the preloader beat
function preload() {
  var t0 = performance.now(), D = 800;
  (function tick() {
    var f = clamp((performance.now() - t0) / D, 0, 1);
    setBootProgress(f * f * (3 - 2 * f));
    f < 1 ? setTimeout(tick, 30) : start();
  })();
}

function renderCard(i) {
  var item = APPS[i];
  var h = "<h2>" + item.title + "</h2>";
  item.specs.forEach(function (s) {
    h += '<div class="spec"><b></b><div><small>' + s.k + "</small>" + (s.tag ? '<span class="tag">' + s.tag + "</span>" : "<span>" + s.v + "</span>") + "</div></div>";
  });
  if (item.colors) h += '<div class="spec"><b></b><div><small>Supplied in</small><div class="swatches">' + item.colors.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join("") + "</div></div></div>";
  card.innerHTML = h; more.textContent = item.more;
}
function setIndex(i, fromScroll) {
  if (!Number.isFinite(i)) return;
  var next = clamp(i, 0, STEPS);
  if (next !== index) {
    index = next;
    scenes.forEach(function (s, k) { s.classList.toggle("is-on", k === index); });
    opts.forEach(function (o, k) { o.classList.toggle("is-on", k === index); });
    renderCard(index);
    if (innerWidth <= MOBILE_BP) {
      var a = opts[index].getBoundingClientRect(), m = menu.getBoundingClientRect();
      menu.scrollBy({ left: (a.left + a.width / 2) - (m.left + m.width / 2), behavior: "smooth" });
    }
  }
  if (!fromScroll) scrollTo({ top: appsStart + (index / STEPS) * appsLen, behavior: "smooth" });
}

var lastFade = -1, lastOnApps = null;
function paintUI() {
  var y = scrollY || pageYOffset, fadeP = range(y, heroLen, appsStart);
  if (fadeP !== lastFade) {
    lastFade = fadeP;
    heroLayer.style.opacity = 1 - fadeP; appsLayer.style.opacity = fadeP;
    heroLayer.style.visibility = fadeP === 1 ? "hidden" : "visible";
    appsLayer.style.visibility = fadeP === 0 ? "hidden" : "visible";
  }
  setIndex(Math.round(range(y, appsStart, appsStart + appsLen) * STEPS), true);
  var onApps = fadeP > 0.5;
  if (onApps !== lastOnApps) { lastOnApps = onApps; btnFull.classList.toggle("is-on", !onApps); btnOverview.classList.toggle("is-on", onApps); }
}
function frame() {
  if (ready && dur) {
    var gap = heroTarget * dur - seekAt;
    if (Math.abs(gap) > 0.0008) seekAt += gap * 0.115;
  }
  var p = Math.round(seekAt / dur * 2000) / 2000;
  if (ready && p !== lastDrawn) { lastDrawn = p; drawHero(video, p); }
  paintUI();
  raf = requestAnimationFrame(frame);
}

/* ---------- events ---------- */
addEventListener("scroll", heroFromScroll, { passive: true });
addEventListener("resize", function () { layout(false); heroFromScroll(); });
addEventListener("orientationchange", function () { layout(true); heroFromScroll(); });
function inAppsZone() { var y = scrollY || 0; return y >= appsStart - 1 && y <= appsStart + appsLen + 1; }
addEventListener("wheel", function (e) {
  if (!inAppsZone() || wheelLock) return;
  var down = e.deltaY > 0;
  if ((down && index >= STEPS) || (!down && index <= 0)) return;
  e.preventDefault(); wheelLock = true; setIndex(index + (down ? 1 : -1), false);
  setTimeout(function () { wheelLock = false; }, 620);
}, { passive: false });
var tx = 0, ty = 0;
addEventListener("touchstart", function (e) { ty = e.touches[0].clientY; tx = e.touches[0].clientX; }, { passive: true });
addEventListener("touchend", function (e) {
  var t = e.changedTouches[0], dy = ty - t.clientY, dx = Math.abs(tx - t.clientX);
  if (Math.abs(dy) < 40 || dx > 60 || !inAppsZone()) return;
  var down = dy > 0;
  if ((down && index >= STEPS) || (!down && index <= 0)) return;
  setIndex(index + (down ? 1 : -1), false);
}, { passive: true });
btnFull.addEventListener("click", function () { scrollTo({ top: 0, behavior: "smooth" }); });
btnOverview.addEventListener("click", function () { scrollTo({ top: appsStart, behavior: "smooth" }); });
more.addEventListener("click", function (e) { e.preventDefault(); });
document.addEventListener("visibilitychange", function () {
  if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(frame);
});

/* ---------- bootstrap ---------- */
layout(true);
renderCard(0);
paintUI();
preload();
raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
