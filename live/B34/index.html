<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyElite - Private Jets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gray-50:#f9fafb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
  --navy:#202A36;--navy-h:#1a2229;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--gray-50);color:var(--gray-900);-webkit-font-smoothing:antialiased}
.page{min-height:100vh;background:var(--gray-50)}
.hero{position:relative;height:100vh;overflow:hidden}
/* video substitute: generated sky */
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.veil{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 50% 46%,rgba(255,255,255,.4),rgba(255,255,255,0) 70%)}
.wrap{position:relative;height:100%;display:flex;flex-direction:column}
nav{position:relative;z-index:5;max-width:80rem;width:100%;margin:0 auto;padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:1.5rem;line-height:2rem;font-weight:600;color:var(--gray-900);letter-spacing:-.01em}
.menu{display:none;gap:2rem;list-style:none}
.menu a,.mobile a{color:var(--gray-900);text-decoration:none;transition:color .2s;font-size:1rem}
.menu a:hover,.mobile a:hover{color:var(--gray-700)}
.burger{background:none;border:0;color:var(--gray-900);cursor:pointer;padding:.25rem;display:inline-flex}
.burger svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.burger .x{display:none}
.burger.open .x{display:block}.burger.open .m{display:none}
.mobile{display:none;position:absolute;left:2rem;right:2rem;top:100%;margin-top:-.5rem;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:1rem;box-shadow:0 20px 40px -12px rgba(17,24,39,.25);padding:1rem 1.5rem;flex-direction:column;gap:1rem}
.mobile.open{display:flex}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 1.5rem}
.content{text-align:center;margin-top:-20rem;display:flex;flex-direction:column;align-items:center}
.label{font-size:.875rem;line-height:1.25rem;font-weight:600;color:var(--gray-600);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem}
h1{font-weight:400;line-height:1;letter-spacing:-.05em;font-size:3.75rem}
h1 span{display:block}
.l1{color:var(--gray-500)}
.l2{color:#202A36;margin-top:-12px}
.sub{font-size:1.125rem;line-height:1.75rem;color:var(--gray-600);margin:1.25rem 0 1.5rem;max-width:42rem}
.cta{display:flex;gap:1rem;justify-content:center}
.btn{padding:.5rem 1rem;border-radius:9999px;border:0;font:inherit;font-weight:500;cursor:pointer;transition:background-color .2s,color .2s}
.btn.alt{background:var(--gray-300);color:var(--gray-800)}.btn.alt:hover{background:var(--gray-400)}
.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy-h)}
.btn:focus-visible,.burger:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
@media(min-width:768px){
  .menu{display:flex}.burger,.mobile{display:none!important}
  h1{font-size:4.5rem}.sub{font-size:1.25rem;line-height:1.75rem}
}
@media(min-width:1024px){h1{font-size:6rem}}
@media(max-height:620px){.content{margin-top:-6rem}}
@media(max-width:767px){.content{margin-top:-10rem}}
</style>
</head>
<body>
<div class="page">
<section class="hero">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="veil"></div>
  <div class="wrap">
    <nav>
      <div class="brand">SkyElite</div>
      <ul class="menu">
        <li><a href="#start">Start</a></li><li><a href="#story">Story</a></li><li><a href="#rates">Rates</a></li><li><a href="#benefits">Benefits</a></li><li><a href="#faq">FAQ</a></li>
      </ul>
      <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false">
        <svg class="m" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg class="x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="mobile" id="mobile">
        <a href="#start">Start</a><a href="#story">Story</a><a href="#rates">Rates</a><a href="#benefits">Benefits</a><a href="#faq">FAQ</a>
      </div>
    </nav>
    <main>
      <div class="content">
        <p class="label">Private Jets</p>
        <h1><span class="l1">Premium.</span><span class="l2">Accessible.</span></h1>
        <p class="sub">Your dedication deserves recognition.</p>
        <div class="cta">
          <button class="btn alt">Discover</button>
          <button class="btn pri">Book Now</button>
        </div>
      </div>
    </main>
  </div>
</section>
</div>
<script>
(function(){
  var b=document.getElementById('burger'),m=document.getElementById('mobile');
  b.addEventListener('click',function(){var o=m.classList.toggle('open');b.classList.toggle('open',o);b.setAttribute('aria-expanded',o)});

  // Generated stand-in for the background video: looping drifting clouds + a distant jet.
  var c=document.getElementById('sky'),x=c.getContext('2d'),W,H,dpr,clouds=[],puffs,t0=performance.now();
  var seed=7;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
  function sprite(){ // soft cloud puff sprite
    var s=document.createElement('canvas');s.width=s.height=256;var g=s.getContext('2d');
    var gr=g.createRadialGradient(128,128,0,128,128,128);
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.55,'rgba(255,255,255,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.fillRect(0,0,256,256);
    g.globalCompositeOperation='source-atop';var sh=g.createLinearGradient(0,60,0,220);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(120,150,190,.55)');g.fillStyle=sh;g.fillRect(0,0,256,256);return s}
  puffs=sprite();
  function build(){
    seed=7;clouds=[];
    var n=Math.round(W/90)+6;
    for(var i=0;i<n;i++){
      var layer=rnd(), y=H*(.5+rnd()*.55);
      var cl={x:rnd()*W*1.4-W*.2,y:y,s:.5+layer*.9,v:4+layer*14,p:[]};
      var k=5+Math.floor(rnd()*6);
      for(var j=0;j<k;j++)cl.p.push({dx:(rnd()-.5)*220,dy:(rnd()-.5)*40,r:50+rnd()*80,a:.7+rnd()*.3});
      clouds.push(cl);
    }
    clouds.sort(function(a,b){return a.s-b.s});
  }
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;
    c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);build();
  }
  function jet(px,py,sc,ang){
    x.save();x.translate(px,py);x.rotate(ang);x.scale(sc,sc);x.fillStyle='rgba(32,42,54,.85)';
    x.beginPath();x.moveTo(40,0);x.quadraticCurveTo(30,-4,0,-4);x.lineTo(-34,-4);x.lineTo(-40,-14);x.lineTo(-34,-14);x.lineTo(-26,-4);
    x.lineTo(-30,-3);x.lineTo(-30,3);x.lineTo(-26,4);x.lineTo(-34,14);x.lineTo(-40,14);x.lineTo(-34,4);x.lineTo(0,4);x.quadraticCurveTo(30,4,40,0);x.fill();
    // swept wings
    x.beginPath();x.moveTo(8,-3);x.lineTo(-14,-30);x.lineTo(-20,-30);x.lineTo(-8,-3);x.fill();
    x.beginPath();x.moveTo(8,3);x.lineTo(-14,30);x.lineTo(-20,30);x.lineTo(-8,3);x.fill();
    x.restore();
  }
  function frame(now){
    var t=(now-t0)/1000;
    var g=x.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#6fa5dc');g.addColorStop(.4,'#9ec6ea');g.addColorStop(.75,'#cfe3f5');g.addColorStop(1,'#e8f1f9');
    x.fillStyle=g;x.fillRect(0,0,W,H);
    // sun glow
    var sg=x.createRadialGradient(W*.78,H*.18,0,W*.78,H*.18,H*.7);
    sg.addColorStop(0,'rgba(255,248,230,.75)');sg.addColorStop(1,'rgba(255,248,230,0)');
    x.fillStyle=sg;x.fillRect(0,0,W,H);
    // distant jet with contrail (loops across the sky)
    var cycle=40,u=(t%cycle)/cycle, jx=-120+u*(W+240), jy=H*.78-u*H*.22;
    var tg=x.createLinearGradient(jx-W*.45,0,jx-30,0);
    tg.addColorStop(0,'rgba(255,255,255,0)');tg.addColorStop(1,'rgba(255,255,255,.85)');
    x.save();x.translate(0,0);x.strokeStyle=tg;x.lineWidth=3;x.lineCap='round';
    x.beginPath();x.moveTo(jx-W*.45,jy+W*.45*.22*H/(W+240));x.lineTo(jx-30,jy+2);x.stroke();x.restore();
    jet(jx,jy,.7,-Math.atan(.22*H/(W+240)));
    // clouds
    var wrapW=W+700;
    for(var i=0;i<clouds.length;i++){
      var cl=clouds[i],cx=((cl.x+t*cl.v)%wrapW+wrapW)%wrapW-350;
      for(var j=0;j<cl.p.length;j++){
        var p=cl.p[j],r=p.r*cl.s;
        x.globalAlpha=p.a*(.55+cl.s*.25>1?1:.55+cl.s*.25);
        x.drawImage(puffs,cx+p.dx*cl.s-r,cl.y+p.dy*cl.s-r*.62,r*2,r*1.24);
      }
    }
    x.globalAlpha=1;
    // soft haze at the horizon
    var hz=x.createLinearGradient(0,H*.7,0,H);
    hz.addColorStop(0,'rgba(249,250,251,0)');hz.addColorStop(1,'rgba(249,250,251,.55)');
    x.fillStyle=hz;x.fillRect(0,H*.7,W,H*.3);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize',size);size();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
