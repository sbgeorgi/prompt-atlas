<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand-gray:#1A1A1A;--font-sans:"Inter",ui-sans-serif,system-ui,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff}
body{font-family:var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.5}
::selection{background:rgba(255,255,255,.3)}
button,input{font:inherit;color:inherit}
svg{display:block}

main{display:flex;min-height:100vh;width:100%;background:#000;padding:8px;transition:all .5s}

/* left hero */
.hero{display:none;position:relative;flex-direction:column;align-items:center;justify-content:flex-end;
  width:52%;padding:0 48px 128px;border-radius:24px;overflow:hidden;height:100%;
  box-shadow:0 25px 50px -12px rgba(0,0,0,.6);background:#02060a}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(7px);transform:scale(1.04)}
.hero-inner{position:relative;z-index:10;width:100%;max-width:320px}
.hero-inner>*+*{margin-top:32px}
.fade{opacity:0;transform:translateY(10px);animation:rise .5s ease-out forwards;animation-delay:calc(.2s + var(--i)*.15s)}
@keyframes rise{to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;justify-content:center;gap:8px}
.brand svg{width:20px;height:20px;fill:#fff;stroke:#fff}
.brand span{font-size:20px;font-weight:600;letter-spacing:-.025em}
.headblock{text-align:center}
.headblock h1{font-size:36px;line-height:40px;font-weight:500;letter-spacing:-.025em;white-space:nowrap}
.headblock p{margin-top:12px;padding:0 16px;color:rgba(255,255,255,.6);font-size:14px;line-height:1.625}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:12px;padding:8px 20px 8px 8px;border-radius:999px;font-size:14px;font-weight:500}
.step .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:600;flex:none}
.step.on{background:#fff;color:#000;border:1px solid #fff}
.step.on .n{background:#000;color:#fff}
.step.off{background:var(--brand-gray);color:#fff;border:none}
.step.off .n{background:rgba(255,255,255,.1);color:rgba(255,255,255,.4)}

/* right form */
.right{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;overflow-y:auto}
.card{width:100%;max-width:576px;opacity:0;animation:fadein .8s ease-out forwards}
@keyframes fadein{to{opacity:1}}
.card>*+*{margin-top:32px}
.head h2{font-size:30px;line-height:36px;font-weight:500;letter-spacing:-.025em}
.head p{margin-top:8px;color:rgba(255,255,255,.4);font-size:14px}
.social{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:48px;background:#000;border:1px solid rgba(255,255,255,.1);
  border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.sbtn:hover{background:rgba(255,255,255,.05)}
.sbtn svg{width:18px;height:18px}
.divider{position:relative;display:flex;justify-content:center}
.divider::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.1)}
.divider span{position:relative;background:#000;padding:0 16px;font-size:12px;font-weight:500;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em}
form{display:flex;flex-direction:column;gap:20px;margin-top:32px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:500;color:#fff}
.inp{position:relative}
.inp input{width:100%;height:44px;background:var(--brand-gray);border:none;border-radius:12px;padding:0 16px;color:#fff;font-size:14px;outline:none;transition:box-shadow .2s}
.inp input::placeholder{color:rgba(255,255,255,.2)}
.inp input:focus{box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.inp.pw input{padding-right:48px}
.eye{position:absolute;right:0;top:0;height:44px;width:48px;display:grid;place-items:center;background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;transition:color .2s}
.eye:hover{color:#fff}
.eye svg{width:18px;height:18px}
.hint{font-size:12px;color:rgba(255,255,255,.4)}
.submit{width:100%;height:56px;margin-top:16px;background:#fff;color:#000;font-weight:600;border:none;border-radius:12px;cursor:pointer;transition:background .2s,transform .1s}
.submit:hover{background:rgba(255,255,255,.9)}
.submit:active{transform:scale(.98)}
.foot{text-align:center;font-size:14px;color:rgba(255,255,255,.4)}
.foot a{color:#fff;font-weight:500;text-decoration:none;margin-left:4px}
.foot a:hover{text-decoration:underline}
.ok{text-align:center;font-size:13px;color:rgba(255,255,255,.6);min-height:0}

@media(min-width:640px){.right{padding-left:48px;padding-right:48px}.card>*+*{margin-top:40px}}
@media(min-width:1024px){
  main{height:100vh;overflow:hidden;padding:16px}
  .hero{display:flex}
  .right{padding:24px 64px;overflow:hidden}
  .card>*+*{margin-top:24px}
  form{margin-top:24px}
}
@media(min-width:1280px){.right{padding-left:96px;padding-right:96px}}
@media(prefers-reduced-motion:reduce){.fade,.card{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<main>
  <section class="hero" aria-label="Aurora introduction">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="hero-inner">
      <div class="fade brand" style="--i:0">
        <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        <span>Aurora</span>
      </div>
      <div class="fade headblock" style="--i:1">
        <h1>Join Aurora</h1>
        <p>Follow these 3 quick phases to activate your space.</p>
      </div>
      <div class="steps">
        <div class="fade step on" style="--i:2"><span class="n">1</span>Register your identity</div>
        <div class="fade step off" style="--i:3"><span class="n">2</span>Configure your studio</div>
        <div class="fade step off" style="--i:4"><span class="n">3</span>Finalize your profile</div>
      </div>
    </div>
  </section>

  <section class="right">
    <div class="card">
      <div class="head">
        <h2>Create New Profile</h2>
        <p>Input your basic details to begin the journey.</p>
      </div>

      <div class="social">
        <button class="sbtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" x2="12" y1="8" y2="8"/><line x1="3.95" x2="8.54" y1="6.06" y2="14"/><line x1="10.88" x2="15.46" y1="21.94" y2="14"/></svg>
          Google
        </button>
        <button class="sbtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
          Github
        </button>
      </div>

      <div class="divider"><span>Or</span></div>

      <form id="f" novalidate>
        <div class="two">
          <div class="field"><label for="fn">First Name</label><div class="inp"><input id="fn" type="text" placeholder="Jane" autocomplete="given-name"></div></div>
          <div class="field"><label for="ln">Last Name</label><div class="inp"><input id="ln" type="text" placeholder="Doe" autocomplete="family-name"></div></div>
        </div>
        <div class="field"><label for="em">Email</label><div class="inp"><input id="em" type="email" placeholder="jane@aurora.studio" autocomplete="email"></div></div>
        <div class="field">
          <label for="pw">Password</label>
          <div class="inp pw">
            <input id="pw" type="password" placeholder="Create a password" autocomplete="new-password">
            <button class="eye" type="button" id="eye" aria-label="Show password">
              <svg id="eyeI" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="hint">Requires at least 8 symbols.</span>
        </div>
        <button class="submit" type="submit">Create Account</button>
        <p class="ok" id="msg" role="status"></p>
        <p class="foot">Member of the team?<a href="#">Log in</a></p>
      </form>
    </div>
  </section>
</main>

<script>
/* password toggle */
(function(){
  var pw=document.getElementById('pw'),eye=document.getElementById('eye'),ic=document.getElementById('eyeI');
  var show='<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>';
  var hide='<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>';
  eye.addEventListener('click',function(){
    var t=pw.type==='password';pw.type=t?'text':'password';ic.innerHTML=t?hide:show;
    eye.setAttribute('aria-label',t?'Hide password':'Show password');
  });
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    document.getElementById('msg').textContent=pw.value.length<8?'Password needs at least 8 symbols.':'Phase 1 complete. Next: configure your studio.';
  });
})();

/* generative aurora sky (stands in for the background video) */
(function(){
  var c=document.getElementById('sky'),g=c.getContext('2d'),W,H,dpr,stars=[];
  function size(){
    var r=c.parentNode.getBoundingClientRect();if(!r.width)return;
    dpr=.75;W=r.width;H=r.height;
    c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
    var s=1;stars=[];for(var i=0;i<140;i++){s=(s*16807)%2147483647;var a=s/2147483647;s=(s*16807)%2147483647;var b=s/2147483647;s=(s*16807)%2147483647;var d=s/2147483647;
      stars.push([a*W,b*H*.8,.3+d*1,d*6.28]);}
  }
  var bands=[
    {hue:152,y:.26,amp:.07,k:1.7,sp:.00028,ph:0,h:.34,a:.55},
    {hue:172,y:.32,amp:.06,k:2.3,sp:-.00022,ph:2,h:.28,a:.45},
    {hue:268,y:.20,amp:.08,k:1.3,sp:.00018,ph:4,h:.30,a:.38},
    {hue:195,y:.36,amp:.05,k:2.9,sp:.00032,ph:1,h:.22,a:.30}
  ];
  function frame(t){
    if(!W){size();}
    if(!W){requestAnimationFrame(frame);return}
    g.globalCompositeOperation='source-over';
    var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#01040a');bg.addColorStop(.7,'#041420');bg.addColorStop(1,'#020a10');
    g.fillStyle=bg;g.fillRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){var s=stars[i];g.globalAlpha=.35+.45*Math.sin(t*.0012+s[3]);g.fillStyle='#fff';g.fillRect(s[0],s[1],s[2],s[2]);}
    g.globalAlpha=1;g.globalCompositeOperation='lighter';
    var N=Math.ceil(W/7);
    bands.forEach(function(b){
      for(var i=0;i<N;i++){
        var x=i/(N-1)*W,u=i/(N-1);
        var yc=H*(b.y+b.amp*Math.sin(u*b.k*6.28+b.ph+t*b.sp*6)+b.amp*.5*Math.sin(u*b.k*13+t*b.sp*9));
        var ht=H*b.h*(.55+.45*Math.sin(u*5.1+b.ph+t*b.sp*4));
        var gr=g.createLinearGradient(0,yc-ht,0,yc+ht*.35);
        gr.addColorStop(0,'hsla('+b.hue+',90%,60%,0)');
        gr.addColorStop(.75,'hsla('+(b.hue+12)+',95%,62%,'+(b.a*.22)+')');
        gr.addColorStop(.92,'hsla('+(b.hue-8)+',100%,72%,'+(b.a*.5)+')');
        gr.addColorStop(1,'hsla('+b.hue+',90%,60%,0)');
        g.fillStyle=gr;g.fillRect(x-W/N,yc-ht,W/N*2+1,ht*1.35);
      }
    });
    g.globalCompositeOperation='source-over';
    /* horizon: dark ridge silhouette */
    g.fillStyle='#010306';g.beginPath();g.moveTo(0,H);
    for(var x=0;x<=W;x+=12){var y=H*.9-Math.abs(Math.sin(x*.004+1.3))*H*.06-Math.sin(x*.013)*H*.012;g.lineTo(x,y);}
    g.lineTo(W,H);g.closePath();g.fill();
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(frame);
  }
  size();window.addEventListener('resize',size);
  requestAnimationFrame(frame);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)setTimeout(function(){frame(4000)},50);
})();
</script>
</body>
</html>
