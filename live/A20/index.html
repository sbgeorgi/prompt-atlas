<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STILLWATER — Built for deep work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f8f4;
  --ink:#16231b;
  --ink-soft:rgba(22,35,27,.72);
  --ink-dim:rgba(22,35,27,.52);
  --line:rgba(22,35,27,.16);
  --green:#2f5d43;
  --cream:#f2f6ef;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* background film stand-in (canvas) */
.bg-video{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:var(--paper);object-fit:cover}
.bg-video.vid{opacity:0;transition:opacity 1.2s ease}
.bg-video.vid.on{opacity:1}

.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 48% at 50% 48%, rgba(246,248,244,.52) 0%, rgba(246,248,244,0) 72%),
    linear-gradient(to bottom, rgba(246,248,244,.66) 0%, rgba(246,248,244,.06) 34%, rgba(246,248,244,.06) 66%, rgba(246,248,244,.58) 100%);}
.blur-mask{position:fixed;inset:0;z-index:2;pointer-events:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 22%);
  mask-image:linear-gradient(to top,#000 0%,transparent 22%)}

.shell{position:relative;z-index:10;height:100vh;height:100dvh;display:flex;flex-direction:column}

nav{position:relative;display:flex;align-items:center;justify-content:space-between;padding:28px 48px}
.wordmark{display:flex;align-items:center;gap:14px;font-family:Manrope,sans-serif;font-weight:800;font-size:14px;letter-spacing:.24em;color:var(--ink)}
.wordmark i{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(47,93,67,.16);display:block}
.links{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:38px;margin-top:0}
.links a,.signin{font-size:13px;font-weight:500;color:var(--ink-soft);transition:color .2s}
.links a:hover,.signin:hover{color:var(--ink)}
.nav-r{display:flex;align-items:center;gap:22px}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;background:var(--green);color:var(--cream);font-family:Manrope,sans-serif;font-weight:600;
  box-shadow:0 8px 22px -6px rgba(47,93,67,.5),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .25s,background .25s,box-shadow .25s}
.pill:hover{background:#356a4c;transform:translateY(-1px)}
.pill.sm{padding:9px 20px;font-size:13px}
.pill.lg{padding:16px 30px;font-size:15px;box-shadow:0 14px 34px -8px rgba(47,93,67,.55),inset 0 1px 0 rgba(255,255,255,.22)}
.pill.lg:hover{transform:translateY(-2px)}
.pill svg{width:16px;height:16px}

.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px 44px}
.kicker{display:inline-flex;align-items:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.34em;color:var(--green);
  padding:9px 20px 9px 18px;border-radius:999px;border:1px solid rgba(47,93,67,.26);background:rgba(246,248,244,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--green);display:block;flex:none}
h1{font-family:Manrope,sans-serif;font-weight:700;font-size:clamp(56px,8.4vw,108px);line-height:.96;letter-spacing:-.045em;color:var(--ink);margin-top:30px;
  text-shadow:0 2px 40px rgba(246,248,244,.55)}
.sub{font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--ink-soft);max-width:530px;margin-top:26px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:20px;margin-top:34px}
.ghost{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--ink-soft);transition:color .2s}
.ghost svg{width:15px;height:15px;transition:transform .25s}
.ghost:hover{color:var(--ink)}.ghost:hover svg{transform:translateX(4px)}

footer{display:flex;justify-content:center;align-items:center;gap:16px;padding:0 48px 30px;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.3em;color:var(--ink-dim)}
footer b{width:26px;height:1px;background:var(--line);display:block;flex:none}

/* entrance */
.rise{opacity:0;animation:blurFadeUp 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes blurFadeUp{from{opacity:0;filter:blur(20px);transform:translateY(36px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
.links{animation:none}
.links a{opacity:0;animation:blurFadeUp 1s cubic-bezier(.2,.7,.2,1) forwards}
@media (prefers-reduced-motion:reduce){
  .rise,.links a{animation:none!important;opacity:1!important;filter:none!important;transform:none!important}
  .pill,.ghost svg{transition:none}
}

@media (max-width:960px){
  .links{display:none}
  nav{padding:22px 24px}
  .hero{padding:0 24px 32px}
  footer{padding:0 24px 24px;font-size:9.5px;letter-spacing:.2em;text-align:center}
}
@media (max-width:520px){
  .kicker{font-size:9.5px;letter-spacing:.2em;padding:8px 14px}
  .signin{display:none}
  .wordmark{letter-spacing:.18em}
  footer b{width:14px}
}
@media (max-height:640px){h1{margin-top:18px}.sub{margin-top:16px}.cta{margin-top:22px}}
</style>
</head>
<body>
<canvas class="bg-video" id="film" aria-hidden="true"></canvas>
<video class="bg-video vid" id="bgv" src="https://zxdefgavgwfxastwmmjm.supabase.co/storage/v1/object/public/assets/stillwater.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
<div class="scrim"></div>
<div class="blur-mask"></div>

<div class="shell">
  <nav>
    <a class="wordmark rise" href="#" style="animation-delay:0ms"><i></i>STILLWATER</a>
    <div class="links">
      <a href="#" style="animation-delay:90ms">Product</a>
      <a href="#" style="animation-delay:140ms">Studio</a>
      <a href="#" style="animation-delay:190ms">About</a>
      <a href="#" style="animation-delay:240ms">Journal</a>
    </div>
    <div class="nav-r">
      <a class="signin rise" href="#" style="animation-delay:290ms">Sign in</a>
      <a class="pill sm rise" href="#" style="animation-delay:340ms">Begin</a>
    </div>
  </nav>

  <main class="hero">
    <div class="kicker rise" style="animation-delay:440ms"><i></i>A calm home for focused work</div>
    <h1 class="rise" style="animation-delay:540ms">Built for deep work.</h1>
    <p class="sub rise" style="animation-delay:680ms">A quiet place to think, make, and finish — one uninterrupted surface for the work that deserves your full attention.</p>
    <div class="cta">
      <a class="pill lg rise" href="#" style="animation-delay:800ms">Begin
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
      <a class="ghost rise" href="#" style="animation-delay:900ms">See how it works
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
    </div>
  </main>

  <footer class="rise" style="animation-delay:1020ms"><b></b>STILLWATER — DEEP WORK, UNDISTURBED<b></b></footer>
</div>

<script>
/* Painterly valley stand-in for the background film: procedural canvas, slow drifting light, river shimmer, meadow sway. */
(function(){
  var cv=document.getElementById('film'),ctx=cv.getContext('2d');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W,H,DPR,far,fg,seed;
  function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
  function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
  function ridge(g,pts,col,w,h){g.beginPath();g.moveTo(0,h);pts.forEach(function(p){g.lineTo(p[0]*w,p[1]*h)});g.lineTo(w,h);g.closePath();g.fillStyle=col;g.fill()}
  function smooth(g,pts,w,h,col){ // smooth hill via quadratic curves
    g.beginPath();g.moveTo(pts[0][0]*w,pts[0][1]*h);
    for(var i=1;i<pts.length-1;i++){var mx=(pts[i][0]+pts[i+1][0])/2*w,my=(pts[i][1]+pts[i+1][1])/2*h;g.quadraticCurveTo(pts[i][0]*w,pts[i][1]*h,mx,my)}
    var l=pts[pts.length-1];g.lineTo(l[0]*w,l[1]*h);g.lineTo(w,h);g.lineTo(0,h);g.closePath();g.fillStyle=col;g.fill()}

  function build(){
    DPR=Math.min(window.devicePixelRatio||1,1.5);
    W=cv.width=Math.round(innerWidth*DPR);H=cv.height=Math.round(innerHeight*DPR);
    seed=1234;
    far=mk(W,H);var g=far.getContext('2d');
    // sky haze
    var sk=g.createLinearGradient(0,0,0,H*.34);
    sk.addColorStop(0,'#d9e6e6');sk.addColorStop(.5,'#cfe0d6');sk.addColorStop(1,'#bcd2b4');
    g.fillStyle=sk;g.fillRect(0,0,W,H);
    // distant hills
    smooth(g,[[0,.2],[.15,.17],[.3,.2],[.5,.15],[.7,.19],[.85,.14],[1,.17]],W,H,'#aac4a6');
    smooth(g,[[0,.24],[.2,.2],[.4,.23],[.6,.2],[.8,.21],[1,.19]],W,H,'#93b18f');
    // valley floor
    var fl=g.createLinearGradient(0,H*.2,0,H*.55);
    fl.addColorStop(0,'#9db57c');fl.addColorStop(.5,'#a7ae6a');fl.addColorStop(1,'#8fa05a');
    smooth(g,[[0,.3],[.25,.27],[.5,.27],[.75,.26],[1,.28]],W,H,fl);
    // left dark slope
    g.save();var ls=g.createLinearGradient(0,H*.15,W*.4,H*.42);ls.addColorStop(0,'#5f7e50');ls.addColorStop(1,'#7f9a58');
    g.beginPath();g.moveTo(0,H*.2);g.bezierCurveTo(W*.12,H*.17,W*.24,H*.2,W*.4,H*.3);g.bezierCurveTo(W*.3,H*.36,W*.12,H*.4,0,H*.43);g.closePath();g.fillStyle=ls;g.fill();g.restore();
    // right dark slope
    g.save();var rs=g.createLinearGradient(W,H*.1,W*.6,H*.4);rs.addColorStop(0,'#4f7048');rs.addColorStop(1,'#789a58');
    g.beginPath();g.moveTo(W,H*.14);g.bezierCurveTo(W*.88,H*.17,W*.74,H*.2,W*.62,H*.3);g.bezierCurveTo(W*.74,H*.36,W*.88,H*.4,W,H*.46);g.closePath();g.fillStyle=rs;g.fill();g.restore();
    // river: oxbow loop + tail
    var cx=W*.5,cy=H*.325,rx=W*.355,ry=H*.088;
    g.save();
    // bank shadow
    g.lineCap='round';g.lineJoin='round';
    function loop(wid,col){g.beginPath();g.ellipse(cx,cy,rx,ry,0,Math.PI*.04,Math.PI*1.96);g.lineWidth=wid;g.strokeStyle=col;g.stroke()}
    loop(H*.058,'rgba(110,130,80,.5)');loop(H*.046,'#d3e6e8');loop(H*.036,'#86bdd4');loop(H*.016,'#b9dbe8');
    // tail upstream
    g.beginPath();g.moveTo(cx+rx*.92,cy-ry*.35);g.bezierCurveTo(W*.8,H*.2,W*.62,H*.21,W*.45,H*.2);g.bezierCurveTo(W*.35,H*.19,W*.3,H*.205,W*.22,H*.2);
    g.lineWidth=H*.012;g.strokeStyle='rgba(188,217,224,.55)';g.stroke();
    g.restore();
    // island inside loop: lighter pasture
    var is=g.createRadialGradient(cx,cy,0,cx,cy,rx*.9);is.addColorStop(0,'rgba(190,205,130,.55)');is.addColorStop(1,'rgba(150,175,100,0)');
    g.beginPath();g.ellipse(cx,cy,rx*.9,ry*.78,0,0,7);g.fillStyle=is;g.fill();
    // painterly strokes on hills & valley
    for(var i=0;i<900;i++){var x=rnd()*W,y=H*(.17+rnd()*.38);var a=.05+rnd()*.07;
      g.fillStyle=rnd()<.5?'rgba(70,100,55,'+a+')':'rgba(200,210,130,'+a+')';
      g.beginPath();g.ellipse(x,y,6+rnd()*26*DPR,1.5+rnd()*3.5*DPR,(rnd()-.5)*.25,0,7);g.fill()}
    // mid meadow band to fore
    var m=g.createLinearGradient(0,H*.42,0,H);
    m.addColorStop(0,'rgba(143,160,90,0)');m.addColorStop(.18,'#8e9d58');m.addColorStop(.6,'#8c9a4f');m.addColorStop(1,'#7b8a45');
    smooth(g,[[0,.46],[.2,.43],[.45,.45],[.7,.43],[1,.45]],W,H,m);
    // foreground meadow layer (separate, sways)
    fg=mk(W,Math.round(H*.62));var f=fg.getContext('2d'),fh=fg.height;
    for(var n=0;n<5200;n++){
      var t=Math.pow(rnd(),.8),y=t*fh,x=rnd()*W,s=(.3+t*1.7)*DPR;
      var len=(5+rnd()*14)*s,lean=(rnd()-.5)*.8;
      var hue=rnd();
      f.strokeStyle=hue<.4?'rgba(110,130,60,'+(.18+t*.3)+')':hue<.75?'rgba(165,170,85,'+(.16+t*.3)+')':'rgba(75,105,55,'+(.16+t*.3)+')';
      f.lineWidth=Math.max(.8,1.1*s);f.beginPath();f.moveTo(x,y);f.lineTo(x+lean*len,y-len);f.stroke()}
    for(var k=0;k<420;k++){
      var tt=Math.pow(rnd(),1.4),yy=fh*(.12+tt*.9),xx=rnd()*W,r=(1.2+tt*7)*DPR*(.6+rnd()*.8);
      var c=rnd();var col=c<.5?'rgba(250,248,235,.92)':c<.8?'rgba(240,222,120,.9)':'rgba(236,200,225,.85)';
      f.fillStyle='rgba(60,70,30,.18)';f.beginPath();f.ellipse(xx+r*.3,yy+r*.5,r*1.1,r*.45,0,0,7);f.fill();
      f.fillStyle=col;
      for(var p=0;p<5;p++){var an=p/5*6.283+rnd()*.3;f.beginPath();f.ellipse(xx+Math.cos(an)*r*.7,yy+Math.sin(an)*r*.4,r*.5,r*.32,an,0,7);f.fill()}
      f.fillStyle='rgba(215,170,40,.95)';f.beginPath();f.arc(xx,yy,r*.22,0,7);f.fill()}
    // dark blur-spot near bottom center (soft shadow, like the film)
    var sh=f.createRadialGradient(W*.43,fh*.78,0,W*.43,fh*.78,W*.05);sh.addColorStop(0,'rgba(35,75,50,.75)');sh.addColorStop(1,'rgba(35,75,50,0)');
    f.fillStyle=sh;f.fillRect(0,0,W,fh);
    // soft mist along horizon of foreground
    var mist=f.createLinearGradient(0,0,0,fh*.3);mist.addColorStop(0,'rgba(215,225,200,.55)');mist.addColorStop(1,'rgba(215,225,200,0)');
    f.fillStyle=mist;f.fillRect(0,0,W,fh*.3);
    // fade top edge of foreground so no seam
    f.globalCompositeOperation='destination-out';var fd=f.createLinearGradient(0,0,0,fh*.28);fd.addColorStop(0,'rgba(0,0,0,1)');fd.addColorStop(1,'rgba(0,0,0,0)');f.fillStyle=fd;f.fillRect(0,0,W,fh*.28);f.globalCompositeOperation='source-over';

  }

  function frame(t){
    t=(t||0)/1000;
    ctx.clearRect(0,0,W,H);
    var sx=Math.sin(t*.12)*W*.006;
    ctx.drawImage(far,-W*.01+sx,-H*.005,W*1.02,H*1.01);
    // river shimmer
    var cx=W*.5+sx,cy=H*.325,rx=W*.355,ry=H*.088;
    ctx.save();ctx.globalCompositeOperation='screen';
    for(var i=0;i<46;i++){var a=(i/46)*6.283+t*.05,fl=.5+.5*Math.sin(t*1.3+i*2.1);
      ctx.fillStyle='rgba(255,255,255,'+(.05+.22*fl)+')';
      ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,H*.011,H*.0016,0,0,7);ctx.fill()}
    ctx.restore();
    // drifting daylight
    ctx.save();ctx.globalCompositeOperation='soft-light';
    for(var j=0;j<3;j++){var px=W*(.2+.3*j+.12*Math.sin(t*.07+j*2)),py=H*(.22+.12*Math.cos(t*.06+j));
      var gr=ctx.createRadialGradient(px,py,0,px,py,W*.32);gr.addColorStop(0,'rgba(255,248,205,.5)');gr.addColorStop(1,'rgba(255,248,205,0)');
      ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
    ctx.restore();
    // cloud shadows
    ctx.save();ctx.globalCompositeOperation='multiply';
    var cs=((t*.012)%1.6-.3)*W,gr2=ctx.createRadialGradient(cs,H*.35,0,cs,H*.35,W*.25);
    gr2.addColorStop(0,'rgba(190,205,190,.5)');gr2.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gr2;ctx.fillRect(0,0,W,H);ctx.restore();
    // foreground sway
    var fy=H*.4,sw=Math.sin(t*.55)*W*.004,sc=1.02+.008*Math.sin(t*.3);
    ctx.drawImage(fg,-W*.01+sw,fy+Math.sin(t*.4)*H*.002,W*sc,fg.height*1.02);
    if(!reduce)requestAnimationFrame(frame)
  }
  function start(){build();frame(2)}
  start();
  var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){build();if(reduce)frame(2)},120)});
})();
</script>
<script>
/* Background film: start the loop on canvas-ready/load; fade in once it actually plays. */
(function(){
  var v=document.getElementById('bgv');if(!v)return;
  function go(){try{var p=v.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
  v.addEventListener('playing',function(){v.classList.add('on')});
  v.addEventListener('canplay',go);
  window.addEventListener('load',go);
  go();
})();
</script>
</body>
</html>
