    var g=c.createLinearGradient(0,-58,0,58);g.addColorStop(0,'#2d3947');g.addColorStop(.5,'#5a6a7b');g.addColorStop(.55,'#d9d2c4');g.addColorStop(1,'#f1ece2');
    c.fillStyle=g;c.beginPath();c.moveTo(178,2);c.bezierCurveTo(168,-34,112,-56,40,-58);c.bezierCurveTo(-50,-58,-125,-32,-190,-9);c.lineTo(-190,9);c.bezierCurveTo(-125,32,-50,58,40,58);c.bezierCurveTo(112,56,168,38,178,2);c.closePath();c.fill();
    /* breast barring */
    c.strokeStyle='rgba(60,60,60,.35)';c.lineWidth=2.2;for(var b=0;b<9;b++){var bx=-90+b*22;c.beginPath();c.moveTo(bx,6+Math.abs(b-4));c.quadraticCurveTo(bx+8,18,bx-3,36-Math.abs(b-4)*2);c.stroke();}
    wing(c,1,t,false);
    /* head */
    var hg=c.createRadialGradient(150,-14,4,150,-4,44);hg.addColorStop(0,'#3d4a5a');hg.addColorStop(1,'#1d2530');
    c.fillStyle=hg;c.beginPath();c.ellipse(148,-3,48,42,-.08,0,7);c.fill();
    c.fillStyle='#e8e3d8';c.beginPath();c.ellipse(158,22,26,16,0,0,7);c.fill();
    c.fillStyle='#161b22';c.beginPath();c.moveTo(146,8);c.quadraticCurveTo(172,14,170,48);c.quadraticCurveTo(148,36,138,12);c.closePath();c.fill();
    /* beak */
    c.fillStyle='#8896a6';c.beginPath();c.moveTo(188,-10);c.quadraticCurveTo(218,-6,212,20);c.quadraticCurveTo(200,8,186,8);c.closePath();c.fill();
    c.fillStyle='#d8b43a';c.beginPath();c.ellipse(184,-1,6,8,0,0,7);c.fill();
    /* eye */
    c.fillStyle='#d8b43a';c.beginPath();c.arc(166,-14,10,0,7);c.fill();c.fillStyle='#07090c';c.beginPath();c.arc(169,-14,6,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(171.5,-16.5,1.8,0,7);c.fill();

  function draw(now){

    var ang=Math.PI*.64,dx=Math.cos(ang),dy=Math.sin(ang);

    for(var i=0;i<seeds.length;i++){var s=seeds[i];var p=((s.y+t*s.v*-.9)%1+1)%1;

/* ---------- Layout engine ---------- */
(function(){
  var REF_W=1464,REF_H=949,PHOTO_W=836,PANE_W=628,CARD_W=613,CARD_H=922;
  var CONTENT_H=697;
  var IMG_W=1177,IMG_H=1336,IMG_REF_SCALE=836/1177;
  var PANE_RATIO=PANE_W/REF_W;
  var HERO_W=681,HERO_H=219;
  var RAMP_HI=1280,RAMP_LO=1000,PHOTO_MIN=0.42,RAMP_LO2=820,PHOTO_MIN2=0.36;
  var mqLandscape=window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
  var mqPortrait=window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');
  var $=function(s){return document.querySelector(s)};
  var photo=$('.photo'),pane=$('.pane'),card=$('#card'),cardIn=$('#cardIn'),hero=$('#hero'),hl1=$('#hl1'),hl2=$('#hl2');
  var mode='';
  function setMode(m){
    if(m===mode)return;mode=m;
    [photo,pane,card,cardIn,hero].forEach(function(e){e.style.cssText='';});
    document.body.style.cssText='';
    document.body.classList.toggle('tabport',m==='tabport');
    document.body.classList.toggle('stacked',m==='phone');
  }
  function photoRatio(vw){
    var hi=1-PANE_RATIO;
    if(vw>=RAMP_HI)return hi;
    if(vw>=RAMP_LO){return PHOTO_MIN+(hi-PHOTO_MIN)*(vw-RAMP_LO)/(RAMP_HI-RAMP_LO);}
    if(vw>=RAMP_LO2){return PHOTO_MIN2+(PHOTO_MIN-PHOTO_MIN2)*(vw-RAMP_LO2)/(RAMP_LO-RAMP_LO2);}
    return PHOTO_MIN2;
  }
  function placeCard(paneW,vh,top){
    var cs=Math.min(paneW/PANE_W,vh/CONTENT_H),gapL=1*cs,mT=14*cs,mB=13*cs,mR=14*cs;
    var cw=Math.max(CARD_W*cs,paneW-gapL-mR),ch=vh-mT-mB;
    card.style.left=gapL+'px';card.style.top=mT+'px';card.style.width=cw+'px';card.style.height=ch+'px';
    card.style.borderRadius=(26*cs)+'px';card.style.borderWidth=Math.max(1,cs)+'px';
    cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';
  }
  function seatHero(photoW,vh){
    var imgScale=Math.max(photoW/IMG_W,vh/IMG_H);
    var s=Math.min(imgScale/IMG_REF_SCALE,photoW*0.92/HERO_W);
    hero.style.transform='scale('+s+')';
  }
  function headlineMeasure(){
    var cs=getComputedStyle(hl1),sp=document.createElement('span');
    sp.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:0';
    ['fontFamily','fontSize','fontWeight','letterSpacing','wordSpacing','fontVariationSettings'].forEach(function(k){sp.style[k]=cs[k];});
    sp.textContent='Find Signal to Action Instantly';document.body.appendChild(sp);
    var w=sp.getBoundingClientRect().width;sp.remove();return w;
  }
  function layout(){
    var vw=window.innerWidth,vh=window.innerHeight;
    if(mqLandscape.matches){
      setMode('land');
      var pw=Math.round(vw*photoRatio(vw));
      photo.style.width=pw+'px';pane.style.left=pw+'px';
      placeCard(vw-pw,vh);seatHero(pw,vh);
    }else if(mqPortrait.matches){
      setMode('tabport');
      var band=Math.round(vh*0.425),side=Math.round(vw*0.0525),foot=Math.round(vh*0.0297);
      var b=document.body.style;
      b.setProperty('--band-h',band+'px');b.setProperty('--side',side+'px');
      b.setProperty('--hero-bottom',(band*0.06493)+'px');
      b.setProperty('--badge-k',band*0.0742/37);
      b.setProperty('--tp-hero-fs',(band*0.1058)+'px');
      b.setProperty('--tp-hero-gap',(band*-0.0)+'px');
      pane.style.top=band+'px';
      var cw=vw-2*side,ch=vh-band-foot-14;
      card.style.left=side+'px';card.style.top='14px';card.style.width=cw+'px';card.style.height=ch+'px';
      card.style.right='auto';
      var cs=Math.min(cw/CARD_W,ch/CARD_H);
      cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,'+Math.max(0,(ch-CARD_H*cs)/2)+'px) scale('+cs+')';
      card.style.borderRadius=(26*cs)+'px';
      $('.hl-wrap').style.width=Math.round(headlineMeasure()*0.61)+'px';
    }else{
      setMode('phone');
    }
  }
  window.addEventListener('resize',layout,{passive:true});
  window.addEventListener('orientationchange',layout);
  if(mqLandscape.addEventListener){mqLandscape.addEventListener('change',layout);mqPortrait.addEventListener('change',layout);}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
  layout();
})();
</script>

<script>
/* ---------- Entrance (runs once) ---------- */
(function(){
  var root=document.documentElement;
  function releaseEntrance(){clearTimeout(window.__entryFallback);root.classList.remove('entry-pending');}
  var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce||!Element.prototype.animate){releaseEntrance();return;}
  var ease='cubic-bezier(.16,1,.3,1)',softEase='cubic-bezier(.22,1,.36,1)';
  var compact=window.matchMedia('(max-width:699px)').matches;
  var $=function(s){return document.querySelector(s)};
  var anims=[];
  function go(sel,delay,dur,easing,y,extra){
    var el=$(sel);if(!el)return;
    var from={opacity:0,transform:'translateY('+y+'px)'},to={opacity:1,transform:'none'};
    if(extra){from.clipPath='inset(100% 0 0 0)';to.clipPath='inset(0 0 0 0)';}
    if(sel==='.card'&&!compact)from.transform='translateY(12px) scale(.988)';
    anims.push(el.animate([from,to],{delay:delay,duration:dur,easing:easing,fill:'both'}));
  }
  function start(){
    go('.card',40,820,ease,14);
    go('.badge',120,480,softEase,8);
    go('#hl1',240,760,ease,compact?12:16,1);
    go('#hl2',330,760,ease,compact?12:16,1);
    go('#h1',470,620,ease,10);
    go('#sub',570,560,ease,10);
    go('#email',720,520,softEase,8);
    go('#pw',790,520,softEase,8);
    go('#loginBtn',930,560,ease,8);
    go('.divider',1060,440,softEase,6);
    go('#gBtn',1150,540,ease,8);
    go('#bottom',1260,500,softEase,6);
    root.classList.remove('entry-pending');
    Promise.allSettled(anims.map(function(a){return a.finished;})).then(function(){
      anims.forEach(function(a){a.cancel();});anims.length=0;releaseEntrance();
    });
  }
  Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(function(r){setTimeout(r,650);})]).then(function(){
    requestAnimationFrame(function(){requestAnimationFrame(start);});
  });
})();
</script>
