<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#F16524}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
a{text-decoration:none}
.page{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(to bottom,#FF8233,#FDAC55)}

/* background 404 */
.bg{position:absolute;inset:0;pointer-events:none;opacity:.8;-webkit-mask-image:linear-gradient(to bottom,black 40%,transparent 95%);mask-image:linear-gradient(to bottom,black 40%,transparent 95%)}
.bg-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.big{color:#fff;font-weight:900;line-height:1;letter-spacing:-.05em;white-space:nowrap;font-size:clamp(200px,48vw,800px);transform-origin:center}
.oval{position:absolute;background:#fff;border-radius:9999px;height:22vh;width:clamp(120px,20vw,400px);transform-origin:center}
@media(min-width:640px){.oval{height:26vh}}
@media(min-width:768px){.oval{height:50vh}}

/* nav */
nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 16px}
@media(min-width:640px){nav{padding:20px 24px}}
@media(min-width:768px){nav{padding:20px 48px}}
.logo{display:flex;align-items:center}
.dots{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.dots i{display:block;width:10px;height:10px;background:#fff;border-radius:9999px}
@media(min-width:640px){.dots i{width:12px;height:12px}}
.logo b{color:#fff;font-weight:700;font-size:18px;margin-left:4px}
@media(min-width:640px){.logo b{font-size:20px}}
.links{display:none;gap:4px}
@media(min-width:768px){.links{display:flex}}
.links a{padding:6px 16px;font-size:14px;font-weight:500;border-radius:9999px;background:#fff;color:var(--accent);transition:opacity .2s}
.links a:hover,.menu-btn:hover{opacity:.9}
.menu-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;color:#fff;background:var(--accent);border:0;cursor:pointer;font:500 14px 'Inter',sans-serif;transition:opacity .2s}
@media(min-width:640px){.menu-btn{padding:10px 20px}}
.menu-btn svg{width:16px;height:16px}
.menu-btn span{display:none}
@media(min-width:640px){.menu-btn span{display:inline}}

/* mascot */
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;margin-top:calc(-6vh - 40px);z-index:10}
.stage .box{width:120vw;height:85vh}
@media(min-width:640px){.stage .box{width:70vw;height:70vh}}
@media(min-width:768px){.stage .box{width:62vw;height:78vh}}
.stage svg{width:100%;height:100%;display:block;overflow:visible}

/* bottom */
.bottom{position:relative;z-index:30;margin-top:auto;padding:0 16px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}
@media(min-width:640px){.bottom{padding-bottom:64px}}
.bottom h1{color:#fff;font-weight:500;font-size:18px;margin-bottom:12px}
@media(min-width:640px){.bottom h1{font-size:20px;margin-bottom:16px}}
@media(min-width:768px){.bottom h1{font-size:24px}}
.cta{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:9999px;color:#fff;font-weight:600;font-size:14px;background:var(--accent);transition:all .15s}
@media(min-width:640px){.cta{padding:16px 32px;font-size:16px}}
.cta:hover{transform:scale(1.05);box-shadow:0 10px 15px -3px rgba(0,0,0,.2),0 4px 6px -4px rgba(0,0,0,.2)}
.cta svg{width:16px;height:16px}
@media(min-width:640px){.cta svg{width:20px;height:20px}}

/* menu overlay */
.ov{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility 0s linear .5s}
.ov.open{visibility:visible;transition-delay:0s}
.ov .back{position:absolute;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .5s cubic-bezier(.16,1,.3,1)}
.ov.open .back{opacity:1}
.panel{position:absolute;top:0;right:0;height:100%;width:100%;transform:translateX(100%);transition:transform .5s cubic-bezier(.16,1,.3,1);background:linear-gradient(135deg,#FF6B1A 0%,#FF9642 100%)}
@media(min-width:640px){.panel{width:380px}}
.ov.open .panel{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.x{width:40px;height:40px;border-radius:9999px;background:rgba(255,255,255,.2);color:#fff;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.x:hover{background:rgba(255,255,255,.3)}
.x svg{width:20px;height:20px}
.items{display:flex;flex-direction:column;gap:8px;padding:16px 24px}
.items a{padding:16px 24px;font-size:18px;font-weight:600;color:#fff;border-radius:16px;background:rgba(255,255,255,.1);opacity:0;transform:translateY(16px);transition:all .3s;transition-delay:0ms}
.items a:hover{background:rgba(255,255,255,.2)}
.ov.open .items a{opacity:1;transform:none;transition-delay:calc(150ms + var(--i)*60ms)}
.pcta{position:absolute;bottom:0;left:0;right:0;padding:24px;opacity:0;transition:opacity .3s}
.ov.open .pcta{opacity:1;transition:opacity .45s .45s}
.pcta a{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:9999px;background:#fff;color:var(--accent);font-weight:600;font-size:16px;transition:transform .2s}
.pcta a:hover{transform:scale(1.02)}
.pcta svg{width:20px;height:20px}

/* mascot animation */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.22}50%{transform:scaleX(.82);opacity:.14}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes look{0%,40%,100%{transform:translateX(0)}50%,90%{transform:translateX(5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes q1{0%{transform:translateY(8px) rotate(-12deg);opacity:0}25%{opacity:1}100%{transform:translateY(-34px) rotate(10deg);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-60}}
.bob{animation:bob 3.2s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:shadow 3.2s ease-in-out infinite}
.arm{transform-box:fill-box;transform-origin:20% 90%;animation:wave 1.1s ease-in-out infinite}
.pupils{animation:look 6s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.q{transform-box:fill-box;transform-origin:center;opacity:0;animation:q1 3.6s ease-out infinite}
.q2{animation-delay:1.2s}.q3{animation-delay:2.4s}
.trail{animation:dash 2s linear infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:wave 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="page" id="page">

  <div class="bg" aria-hidden="true">
    <div class="bg-in">
      <span class="big" id="big">404</span>
      <div class="oval" id="oval"></div>
    </div>
  </div>

  <nav>
    <a href="#" class="logo" aria-label="TinyTrails">
      <span class="dots"><i></i><i></i><i></i><i></i></span>
      <b>TinyTrails</b>
    </a>
    <div class="links">
      <a href="#">About Us</a><a href="#">Programs</a><a href="#">Reviews</a><a href="#">FAQ</a><a href="#">Contacts</a>
    </div>
    <button class="menu-btn" id="open" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      <span>Menu</span>
    </button>
  </nav>

  <!-- Mascot: inline SVG stand-in for the hosted video -->
  <div class="stage" aria-hidden="true">
    <div class="box">
      <svg viewBox="0 0 600 700" preserveAspectRatio="xMidYMid meet">
        <!-- lost trail -->
        <path class="trail" d="M70 640 C150 600 120 560 210 575 S330 640 400 600 S520 560 540 600" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>
        <!-- ground shadow -->
        <ellipse class="sh" cx="300" cy="640" rx="130" ry="18" fill="#7a2c00"/>
        <!-- floating question marks -->
        <g font-family="Inter,sans-serif" font-weight="900" fill="#2B1B4F">
          <text class="q" x="150" y="250" font-size="64">?</text>
          <text class="q q2" x="430" y="220" font-size="84">?</text>
          <text class="q q3" x="360" y="170" font-size="48">?</text>
        </g>
        <g class="bob">
          <!-- legs -->
          <path d="M255 560 v55 q0 14 -14 14 h-26 q-14 0 -10 -14 q6 -16 24 -16 v-39z" fill="#2B1B4F"/>
          <path d="M345 560 v55 q0 14 14 14 h26 q14 0 10 -14 q-6 -16 -24 -16 v-39z" fill="#2B1B4F"/>
          <!-- backpack -->
          <rect x="190" y="360" width="90" height="170" rx="34" fill="#FFC53D" stroke="#2B1B4F" stroke-width="7"/>
          <rect x="205" y="440" width="60" height="50" rx="14" fill="#F5A81C" stroke="#2B1B4F" stroke-width="5"/>
          <!-- bedroll -->
          <rect x="196" y="338" width="140" height="34" rx="17" fill="#1FB5A5" stroke="#2B1B4F" stroke-width="6"/>
          <!-- body -->
          <path d="M230 400 q0 -50 70 -50 q70 0 70 50 v140 q0 40 -70 40 q-70 0 -70 -40z" fill="#1FB5A5" stroke="#2B1B4F" stroke-width="7"/>
          <path d="M240 470 h120" stroke="#fff" stroke-opacity=".55" stroke-width="10" stroke-linecap="round"/>
          <!-- left arm holding map (down) -->
          <g>
            <path d="M236 410 q-40 30 -34 78" fill="none" stroke="#2B1B4F" stroke-width="30" stroke-linecap="round"/>
            <path d="M236 410 q-40 30 -34 78" fill="none" stroke="#1FB5A5" stroke-width="18" stroke-linecap="round"/>
            <g transform="rotate(-12 205 520)">
              <rect x="150" y="470" width="96" height="76" rx="6" fill="#FFF3D6" stroke="#2B1B4F" stroke-width="6"/>
              <path d="M170 530 q16 -40 30 -10 t30 -34" fill="none" stroke="#F16524" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/>
              <path d="M214 484 l12 12 m0 -12 l-12 12" stroke="#E5332A" stroke-width="5" stroke-linecap="round"/>
              <circle cx="205" cy="485" r="0"/>
            </g>
            <circle cx="203" cy="490" r="15" fill="#FFD9B8" stroke="#2B1B4F" stroke-width="6"/>
          </g>
          <!-- right arm waving -->
          <g class="arm">
            <path d="M364 410 q56 -10 62 -78" fill="none" stroke="#2B1B4F" stroke-width="30" stroke-linecap="round"/>
            <path d="M364 410 q56 -10 62 -78" fill="none" stroke="#1FB5A5" stroke-width="18" stroke-linecap="round"/>
            <circle cx="426" cy="326" r="17" fill="#FFD9B8" stroke="#2B1B4F" stroke-width="6"/>
          </g>
          <!-- head -->
          <circle cx="300" cy="250" r="105" fill="#FFD9B8" stroke="#2B1B4F" stroke-width="7"/>
          <!-- hat -->
          <path d="M190 232 q0 -112 110 -112 q110 0 110 112 q-110 -26 -220 0z" fill="#F16524" stroke="#2B1B4F" stroke-width="7" stroke-linejoin="round"/>
          <path d="M176 238 q124 -40 248 0 q-8 18 -30 14 q-94 -22 -188 0 q-24 4 -30 -14z" fill="#E5551A" stroke="#2B1B4F" stroke-width="7" stroke-linejoin="round"/>
          <circle cx="300" cy="112" r="14" fill="#fff" stroke="#2B1B4F" stroke-width="6"/>
          <!-- cheeks -->
          <ellipse cx="228" cy="296" rx="20" ry="12" fill="#FF9B7A" opacity=".75"/>
          <ellipse cx="372" cy="296" rx="20" ry="12" fill="#FF9B7A" opacity=".75"/>
          <!-- eyes -->
          <g>
            <g class="eye"><ellipse cx="256" cy="272" rx="22" ry="27" fill="#fff" stroke="#2B1B4F" stroke-width="5"/></g>
            <g class="eye"><ellipse cx="344" cy="272" rx="22" ry="27" fill="#fff" stroke="#2B1B4F" stroke-width="5"/></g>
            <g class="pupils"><circle cx="254" cy="276" r="11" fill="#2B1B4F"/><circle cx="342" cy="276" r="11" fill="#2B1B4F"/>
            <circle cx="258" cy="271" r="3.5" fill="#fff"/><circle cx="346" cy="271" r="3.5" fill="#fff"/></g>
          </g>
          <!-- brows (worried) -->
          <path d="M232 238 q22 -14 42 -2 M326 236 q20 -12 42 2" fill="none" stroke="#2B1B4F" stroke-width="6" stroke-linecap="round"/>
          <!-- mouth -->
          <path d="M276 330 q24 -18 48 0" fill="none" stroke="#2B1B4F" stroke-width="6" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="bottom">
    <h1>Oops, something went wrong!</h1>
    <a class="cta" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Back to Home
    </a>
  </div>

  <!-- menu overlay -->
  <div class="ov" id="ov" aria-hidden="true">
    <div class="back" id="back"></div>
    <aside class="panel">
      <div class="ph">
        <a href="#" class="logo"><span class="dots"><i></i><i></i><i></i><i></i></span><b>TinyTrails</b></a>
        <button class="x" id="close" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="items">
        <a href="#" style="--i:0">About Us</a><a href="#" style="--i:1">Programs</a><a href="#" style="--i:2">Reviews</a><a href="#" style="--i:3">FAQ</a><a href="#" style="--i:4">Contacts</a>
      </div>
      <div class="pcta"><a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back to Home</a></div>
    </aside>
  </div>
</div>

<script>
(function(){
  var big=document.getElementById('big'), oval=document.getElementById('oval');
  function fit(){
    var h=big.offsetHeight||1;
    var sy=window.innerHeight/h;
    big.style.transform='scale(1.15,'+(sy*1.4)+')';
    oval.style.transform='scaleY('+sy+')';
  }
  fit(); window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

  var ov=document.getElementById('ov');
  function set(o){
    ov.classList.toggle('open',o);
    ov.setAttribute('aria-hidden',o?'false':'true');
    document.body.style.overflow=o?'hidden':'';
  }
  document.getElementById('open').onclick=function(){set(true)};
  document.getElementById('close').onclick=function(){set(false)};
  document.getElementById('back').onclick=function(){set(false)};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false)});
})();
</script>
</body>
</html>
