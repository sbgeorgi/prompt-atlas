<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHALK - Strength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--base:#080808;--bone:#dcdcdc;--ink:#f4f4f2;--hair:rgba(255,255,255,.12);--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter Tight',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--base);color:var(--ink);font-family:var(--sans)}
body{overflow-x:hidden}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:10px}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px 3.2vw}
.word{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--ink)}
.links{display:flex;gap:38px}
.links a{color:rgba(255,255,255,.55);text-decoration:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase}
.links a:hover{color:var(--ink)}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:99px;padding:9px 18px;transition:background .3s,color .3s}
.pill:hover{background:var(--bone);color:#080808}
.pill.solid{background:var(--bone);color:#080808;border-color:var(--bone);font-size:11px;padding:15px 30px}
.stage{height:700vh;position:relative}
.sticky{position:sticky;top:0;height:100vh;overflow:hidden;background:#050505}
#film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#050505}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 220px 90px rgba(0,0,0,.85);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;height:28vh;background:linear-gradient(rgba(0,0,0,.82),transparent);pointer-events:none}
.bot{position:absolute;left:0;right:0;bottom:0;height:40vh;background:linear-gradient(to top,rgba(0,0,0,.92),transparent);pointer-events:none}
.beat{position:absolute;left:0;right:0;text-align:center;padding:0 6vw;opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .9s ease;pointer-events:none;
 font-weight:500;font-size:clamp(30px,4.6vw,64px);letter-spacing:-.035em;line-height:1.05;text-shadow:0 2px 30px rgba(0,0,0,.9),0 0 60px rgba(0,0,0,.8)}
.beat.on{opacity:1;transform:none}
.b1{top:30vh}.b2{bottom:21vh}.b3{bottom:21vh}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080808;color:rgba(255,255,255,.6);transition:opacity .8s;z-index:5}
.loading.off{opacity:0;pointer-events:none}
.rail{position:fixed;left:3.2vw;bottom:28px;z-index:20;display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.55)}
.rail .track{width:64px;height:1px;background:var(--hair);position:relative}
.rail .fill{position:absolute;left:0;top:0;height:1px;width:0;background:var(--bone)}
.spec{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;display:flex;gap:44px;text-align:center}
.spec b{display:block;font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--ink)}
.spec span{display:block;margin-top:4px;font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.close{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:var(--base);border-top:1px solid var(--hair);padding:12vh 6vw;text-align:center;position:relative;z-index:2}
@media(max-width:820px){.links,.spec{display:none}}
@media(prefers-reduced-motion:reduce){
 .stage{height:auto}.sticky{position:static;height:100vh;display:flex;flex-direction:column;justify-content:center;gap:12px}
 #film{position:relative;height:60vh;flex:none}
 .beat{position:relative;opacity:1;transform:none;padding:24px 6vw;z-index:3}
 .top,.bot,.vig{display:none}
}
</style>
</head>
<body>
<nav>
 <div class="word">CHALK</div>
 <div class="links"><a href="#">Method</a><a href="#">Coaches</a><a href="#">Membership</a><a href="#">Visit</a></div>
 <a class="pill" href="#close">Start training</a>
</nav>

<section class="stage" id="stage">
 <div class="sticky">
  <video id="film" muted playsinline preload="auto" aria-label="A lifter chalking his hands in a dark gym"></video>
  <div class="vig"></div><div class="top"></div><div class="bot"></div>
  <div class="beat b1" data-a="0" data-b="0.14">Before the lift.</div>
  <div class="beat b2" data-a="0.24" data-b="0.38">Five in the morning. Empty room.</div>
  <div class="beat b3" data-a="0.72" data-b="0.88">The dust is the receipt.</div>
  <div class="loading mono" id="loading">Loading</div>
 </div>
</section>

<div class="rail mono"><span id="pct">00</span><div class="track"><div class="fill" id="fill"></div></div></div>
<div class="spec"><div><b>4:45</b><span>doors open</span></div><div><b>0</b><span>mirrors</span></div><div><b>1</b><span>rule</span></div></div>

<section class="close" id="close"><a class="pill solid" href="#">Start training</a></section>

<script>
(function(){
var SRC='https://zxdefgavgwfxastwmmjm.supabase.co/storage/v1/object/public/assets/chalk.mp4';
var video=document.getElementById('film');
var stage=document.getElementById('stage'),beats=[].slice.call(document.querySelectorAll('.beat'));
var pctEl=document.getElementById('pct'),fillEl=document.getElementById('fill'),loading=document.getElementById('loading');
var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
var target=0,current=0,written=-1;

function clamp(x){return Math.max(0,Math.min(1,x))}
function readTarget(){var r=stage.getBoundingClientRect();var span=r.height-window.innerHeight;return span>0?clamp(-r.top/span):0}
function setBeats(p){beats.forEach(function(b){var a=+b.dataset.a,e=+b.dataset.b;b.classList.toggle('on',reduce||(p>=a&&p<=e));});}

function tick(){
 if(!reduce){
  target=readTarget();current+=(target-current)*.12;
  if(Math.abs(target-current)<.0004)current=target;
  if(video.duration>0){
   var nt=current*(video.duration-.05);
   if(Math.abs(nt-written)>.005){video.currentTime=nt;written=nt;}
  }
  var pc=Math.round(current*100);
  pctEl.textContent=(pc<10?'0':'')+pc;fillEl.style.width=(current*100)+'%';
  setBeats(current);
 }
 requestAnimationFrame(tick);
}

if(reduce){video.controls=true;pctEl.textContent='--';}
setBeats(0);
video.addEventListener('loadeddata',function(){video.currentTime=0;loading.classList.add('off');});
fetch(SRC).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.blob();})
 .then(function(b){video.src=URL.createObjectURL(b);})
 .catch(function(){loading.textContent='Unavailable';});
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
